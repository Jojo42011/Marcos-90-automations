<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco — web demo</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --user: #1e3a5f;
      --bot: #1a2f26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    header label {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    header input[type="text"] {
      width: 12rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      max-width: 42rem;
      margin: 0 auto;
      width: 100%;
    }
    .bubble {
      max-width: 90%;
      padding: 0.65rem 0.85rem;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border: 1px solid var(--border);
    }
    .bubble.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
    }
    .bubble.error {
      align-self: stretch;
      background: #3a1f1f;
      border-color: #6b3030;
      color: #f0b4b4;
      font-size: 0.85rem;
    }
    .bubble.pending {
      opacity: 0.7;
      font-style: italic;
    }
    footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      max-width: 42rem;
      margin: 0 auto;
      width: 100%;
    }
    form {
      display: flex;
      gap: 0.5rem;
    }
    form input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    form button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint {
      margin: 0.5rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Marco web demo</h1>
    <label>
      user_id
      <input type="text" id="userId" value="demo-user-1" autocomplete="off" />
    </label>
  </header>
  <div id="log" aria-live="polite"></div>
  <footer>
    <form id="f">
      <input type="text" id="msg" placeholder="Type a message…" autocomplete="off" required />
      <button type="submit" id="send">Send</button>
    </form>
    <p class="hint">Same host as <code>/simulate</code> — no CORS setup needed. Use a stable user_id to keep thread state.</p>
  </footer>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("f");
    const msg = document.getElementById("msg");
    const userId = document.getElementById("userId");
    const sendBtn = document.getElementById("send");

    function addBubble(text, cls) {
      const el = document.createElement("div");
      el.className = "bubble " + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msg.value.trim();
      if (!text) return;
      const uid = userId.value.trim() || "demo-user-1";
      addBubble(text, "user");
      msg.value = "";
      const pending = addBubble("…", "bot pending");
      sendBtn.disabled = true;
      try {
        const res = await fetch("/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            platform: "instagram",
            user_id: uid,
            message: text,
            comment_or_dm: "dm",
          }),
        });
        const data = await res.json().catch(() => ({}));
        pending.remove();
        if (!res.ok) {
          addBubble(data.error || "Request failed (" + res.status + ")", "error");
          return;
        }
        if (data.reply) addBubble(data.reply, "bot");
        else addBubble("(no reply)", "bot");
      } catch (err) {
        pending.remove();
        addBubble(String(err.message || err), "error");
      } finally {
        sendBtn.disabled = false;
        msg.focus();
      }
    });
  </script>
</body>
</html>
