<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Harvey - Marco 90</title>
<style>
 /* ============================================================
    NEUTRAL UI SHELL - collapsible sidebar + tabbed iframe views
    + programmatic ("voice") navigation. No brand, no colors.
    THEME: override the CSS variables below. Everything is driven
    off --accent / --bg / --line - change those and it re-skins.
    ============================================================ */
 /* Brivity theme - white chrome, teal accent (matches the CRM). Harvey's own
    screen stays dark inside its iframe; this only skins the shell. */
 :root {
   --bg:       #f9fbfb;
   --panel:    #ffffff;
   --text:     #333333;
   --muted:    #5f6b78;
   --line:     #edf0f0;
   --line-2:   rgba(89,196,196,0.5);
   --accent:   #59c4c4;
   --accent-2: #4ca7a7;
   --soft:     #eef7f7;
   --ok:       #10b981;
   --w:        240px;
   --font:     "Helvetica Neue",Helvetica,Arial,-apple-system,"Segoe UI",Roboto,sans-serif;
   --mono:     ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
 }
 * { box-sizing:border-box; margin:0; padding:0; }
 html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; -webkit-font-smoothing:antialiased; }
 #shell { display:flex; height:100vh; width:100vw; }


 /* ── Sidebar ── */
 #side {
   position:relative; flex:0 0 var(--w); width:var(--w);
   background:var(--panel);
   border-right:1px solid var(--line); box-shadow:1px 0 3px rgba(16,24,40,.04);
   display:flex; flex-direction:column; z-index:20;
   transition:margin-left .34s cubic-bezier(.4,0,.2,1), opacity .3s;
 }
 #shell.collapsed #side { margin-left:calc(-1 * var(--w)); opacity:0; }


 #side-head { display:flex; align-items:center; justify-content:space-between; padding:16px 14px 12px 16px; border-bottom:1px solid var(--line); }
 #brand { display:flex; align-items:center; gap:9px; }
 #brand .wm { display:flex; flex-direction:column; line-height:1; font-family:Georgia,"Times New Roman",serif; }
 #brand .wm small { font-size:5.6px; letter-spacing:.18em; color:#c23b3b; margin-bottom:2px; white-space:nowrap; }
 #brand .wm b { font-weight:700; font-size:13px; letter-spacing:.06em; color:#3a3f45; }
 #collapse { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:#fff; color:#8b95a0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
 #collapse:hover { border-color:var(--line-2); color:var(--accent); background:var(--soft); }


 #nav { flex:1; overflow-y:auto; padding:6px 12px; }
 #nav::-webkit-scrollbar { width:0; }
 .nav-sep { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); padding:14px 10px 8px; font-weight:600; }
 .nav-item { position:relative; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:3px; border:1px solid transparent; transition:background .16s, border-color .16s, transform .1s; }
 .nav-item:hover { background:#f6f8f8; transform:translateX(2px); }
 .nav-item.active { background:var(--soft); border-color:rgba(89,196,196,0.35); }
 .nav-item.active::before { content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:22px; border-radius:2px; background:var(--accent); }
 .nav-item .ic { flex:0 0 auto; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); color:var(--accent); background:#fff; }
 .nav-item .ic svg { width:18px; height:18px; }
 .nav-item.active .ic { border-color:rgba(89,196,196,0.45); }
 .nav-item .tx .l { font-size:13.5px; font-weight:600; color:var(--text); }
 .nav-item .tx .s { font-size:11px; color:var(--muted); margin-top:1px; }
 #side-foot { padding:14px 18px; border-top:1px solid var(--line); font-size:9.5px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; display:flex; align-items:center; gap:8px; }
 .dot { width:6px; height:6px; border-radius:50%; background:var(--ok); }


 /* ── Floating reopen (when collapsed): a small, unobtrusive arrow that sits
       just below where the logo lives, out of the way of page headers. ── */
 #reopen { position:fixed; top:54px; left:8px; z-index:60; display:none; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.94); border:1px solid var(--line); box-shadow:0 1px 4px rgba(16,24,40,.14); cursor:pointer; align-items:center; justify-content:center; color:#8b95a0; opacity:.8; transition:opacity .15s, color .15s; }
 #reopen:hover { opacity:1; color:var(--accent); border-color:var(--line-2); }
 #shell.collapsed #reopen { display:flex; }


 /* ── Main + iframe views ── */
 #main { flex:1; position:relative; min-width:0; }
 .frame { position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; pointer-events:none; transition:opacity .2s; background:var(--bg); }
 .frame.active { opacity:1; pointer-events:auto; }




 #toast { position:absolute; top:18px; left:50%; transform:translateX(-50%) translateY(-24px); z-index:70; background:var(--bg); border:1px solid var(--line-2); color:var(--text); font-size:13px; padding:11px 18px; border-radius:11px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
 #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
 #toast b { color:var(--accent); }

 /* ── Shell-level task notification popups: visible on top of whichever tab
    is active (unlike the identical popup inside team-tasks.html's own
    iframe, which is invisible whenever that tab isn't the active one). ── */
 #notePops { position:absolute; top:18px; right:18px; z-index:75; display:flex; flex-direction:column; gap:10px; width:320px; max-width:88vw; }
 .notecard { position:relative; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; box-shadow:0 14px 34px rgba(16,24,40,.16); padding:12px 32px 12px 14px; cursor:pointer; animation:notecardIn .22s ease; }
 @keyframes notecardIn { from{ transform:translateX(24px); opacity:0; } to{ transform:none; opacity:1; } }
 .notecard b { font-size:13px; color:var(--text); }
 .notecard p { font-size:12px; color:var(--muted); margin-top:3px; }
 .notecard .x { position:absolute; top:7px; right:8px; border:none; background:none; color:var(--muted); font-size:14px; cursor:pointer; line-height:1; padding:2px; }

 /* ── Unread-assignment count on the Tasks tab ── */
 .nav-item .badge { display:none; margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:#e2483d; color:#fff; font-size:11px; font-weight:700; align-items:center; justify-content:center; line-height:1; flex:0 0 auto; }
 .nav-item .badge.on { display:flex; }

 /* Signed-in chip in the sidebar footer — click to switch user (goes to /who). */
 #whoBtn { display:flex; align-items:center; gap:7px; flex:1; min-width:0; background:none; border:none; padding:0; cursor:pointer; font-family:var(--font); text-align:left; color:inherit; }
 #whoBtn:hover #whoLabel { color:var(--accent); }
 #whoAv { flex:0 0 auto; width:18px; height:18px; border-radius:50%; display:none; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:9px; }
 #whoAv.on { display:flex; }


 @media (max-width:780px){ :root{ --w:210px; } }
</style>
</head>
<body>
 <div id="shell">
   <aside id="side">
     <div id="side-head">
       <div id="brand">
         <svg width="34" height="34" viewBox="0 0 48 48" fill="none">
           <defs><linearGradient id="mpr" x1="0" y1="2" x2="0" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4695b"/><stop offset="1" stop-color="#bd1e2b"/></linearGradient></defs>
           <path d="M24 4 44 24 24 44 4 24Z" stroke="url(#mpr)" stroke-width="2.2"/>
           <path d="M24 9 39 24 24 39 9 24Z" stroke="url(#mpr)" stroke-width="1" opacity=".55"/>
           <path d="M14.5 22 24 12.5 33.5 22" stroke="url(#mpr)" stroke-width="1.9" stroke-linejoin="round"/>
           <g fill="url(#mpr)"><rect x="21" y="15.4" width="2.3" height="2.3" rx=".4"/><rect x="24.7" y="15.4" width="2.3" height="2.3" rx=".4"/><rect x="21" y="18.3" width="2.3" height="2.3" rx=".4"/><rect x="24.7" y="18.3" width="2.3" height="2.3" rx=".4"/></g>
           <text x="24" y="33.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="14.5" fill="url(#mpr)">M</text>
           <g stroke="url(#mpr)" stroke-width="1.5" stroke-linecap="round"><line x1="17" y1="34.5" x2="17" y2="41"/><line x1="20.4" y1="35.5" x2="20.4" y2="41"/><line x1="27.6" y1="35.5" x2="27.6" y2="41"/><line x1="31" y1="34.5" x2="31" y2="41"/></g>
         </svg>
         <span class="wm"><small>HAPPINESS BEGINS AT HOME</small><b>MARCO PUGA</b></span>
       </div>
       <button id="collapse" title="Collapse (Ctrl/⌘ + \)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
     </div>
     <nav id="nav"></nav>
     <div id="side-foot">
       <span class="dot"></span>
       <button id="whoBtn" title="Switch user">
         <span id="whoAv"></span>
         <span id="whoLabel" style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Marco Puga &middot; Live</span>
       </button>
       <button id="logoutBtn" title="Sign out" style="display:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;align-items:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
     </div>
   </aside>


   <div id="reopen" title="Open menu"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>


   <div id="main">
     <div id="frames"></div>
     <div id="toast"></div>
     <div id="notePops"></div>
   </div>
 </div>



<script>
/* ================================================================
  CONFIG - edit this. Each tab is one iframe view.
  - key:   unique id, used by programmatic navigation
  - label / sub: sidebar text
  - src:   the page/app to embed (same-origin recommended so
           postMessage works and audio persists across tabs)
  - home:  the first/primary tab (loads immediately, stays live
           in the background so a voice assistant can keep running)
  - icon:  inline SVG string (optional)
  ================================================================ */
var TABS = [
 {
   key: "harvey",
   label: "Harvey",
   sub: "AI Assistant",
   src: "/operator",
   home: true,
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>'
 },
 {
   key: "chat",
   label: "Chat with Harvey",
   sub: "Clean chat mode",
   src: "/hull-chat",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
 },
 {
   key: "crm",
   label: "CRM",
   sub: "Leads · Deals · Tasks",
   src: "/crm",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'
 },
 {
   key: "jobs",
   label: "Harvey Jobs",
   sub: "Delegated work",
   src: "/jobs",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.9 4.9l2.9 2.9"/><path d="M16.2 16.2l2.9 2.9"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.9 19.1l2.9-2.9"/><path d="M16.2 7.8l2.9-2.9"/></svg>'
 },
 {
   key: "tracker",
   label: "Tracker",
   sub: "Buyers · Sellers",
   src: "/tracker",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h6v14H3z"/><path d="M15 5h6v9h-6z"/><path d="M9 9h6"/></svg>'
 },
 {
   key: "dm",
   label: "DM Agent",
   sub: "Instagram · SMS · Replies",
   src: "/chat",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
 },
 {
   key: "content",
   label: "Content Manager",
   sub: "TikTok · Scores · Brain",
   src: "/social",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 10l4.553-2.069A1 1 0 0121 8.845v6.31a1 1 0 01-1.447.894L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>'
 },
 /* Ad Manager tab pulled from the sidebar at Marco's request (2026-07-24).
    Nothing was deleted: public/ads.html, src/core/adsStore.ts, the /ads route
    and /api/ads/* all still work, so restoring it is just uncommenting this.
 {
   key: "ads",
   label: "Ad Manager",
   sub: "Instagram · Facebook",
   src: "/ads",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a2 2 0 0 1-3.6 1.2L6 12"/></svg>'
 },
 */
 {
   key: "tasks",
   label: "Tasks",
   sub: "Command Center",
   src: "/team-tasks",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>'
 },
 {
   key: "howto",
   label: "How to Use",
   sub: "Guided tour of every tab",
   src: "/how-to",
   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
 }
];


/* Section separators - a label is rendered before the tab whose key is listed
   here (null = no separator before that item). Configured, not core logic. */
var SECTIONS = {
 harvey:    null,
 crm:       'Operations',
 dm:        null,
 content:   'Growth',
 tasks:     null,
 howto:     'Help'
};


/* Message type the shell listens for (from an embedded page / assistant). */
var NAV_MESSAGE_TYPE = "app-navigate";


/* A generic dot icon; replace per-tab via TABS[i].icon if you want. */
var DEFAULT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/></svg>';


/* ── TEAM IDENTITY ────────────────────────────────────────────────
   Who is at this device. Same localStorage key the Task Command board
   uses, so signing in here signs you in there too (and vice versa).
   This is the lightweight "who's on" picker, NOT the real account auth
   in /api/auth/* — that system is separate and currently switched off. */
var USER_KEY = "marcoTaskUser";
/* Only used if /api/team/roster can't be reached — the gate must never be
   a dead end that locks someone out of the app. Server list wins. */
var ROSTER_FALLBACK = [
  { id:"marco",    name:"Marco",    role:"Lead Agent", color:"#7C3AED" },
  { id:"wesley",   name:"Wesley",   role:"Agent",      color:"#0E7490" },
  { id:"kendrick", name:"Kendrick", role:"Assistant",  color:"#DB2777" },
  { id:"carlos",   name:"Carlos",   role:"Assistant",  color:"#A16207" }
];
var ROSTER = ROSTER_FALLBACK.slice();

function currentUser(){ try{ return localStorage.getItem(USER_KEY) || ""; }catch(_){ return ""; } }
function rosterMember(id){
  for(var i=0;i<ROSTER.length;i++) if(ROSTER[i].id===id) return ROSTER[i];
  return null;
}

/* Nobody signed in on this device → the sign-in screen, immediately.
   Checked synchronously (not after the auth/roster fetches) so the app never
   flashes usable to someone we can't identify. replace(), not href, so Back
   doesn't bounce them straight into this redirect again. */
if(!currentUser()){
  location.replace("/who?next=" + encodeURIComponent(location.pathname + location.search));
}

/** Switching user goes through the same one screen, never a second picker. */
function goSignIn(){
  location.href = "/who?next=" + encodeURIComponent(location.pathname + location.search);
}


function initShell(){
 "use strict";
 var byKey = {}; TABS.forEach(function(t){ byKey[t.key]=t; });
 var home = (TABS.find(function(t){return t.home;}) || TABS[0]).key;
 var current = home;
 var nav = document.getElementById("nav"), frames = document.getElementById("frames");
 var toastEl = document.getElementById("toast"), shell = document.getElementById("shell");


 nav.innerHTML = TABS.map(function(t,i){
   var sep = SECTIONS[t.key] ? '<div class="nav-sep">'+SECTIONS[t.key]+'</div>' : '';
   return sep + '<div class="nav-item'+(t.key===current?' active':'')+'" data-key="'+t.key+'" title="'+t.label+'">'+
     '<div class="ic">'+(t.icon||DEFAULT_ICON)+'</div><div class="tx"><div class="l">'+t.label+'</div><div class="s">'+(t.sub||'')+'</div></div>'+
     '<span class="badge" data-badge="'+t.key+'"></span></div>';
 }).join("");


 frames.innerHTML = TABS.map(function(t){
   var src = t.key===home ? ' src="'+t.src+'"' : ''; // home loads now; others lazy-load on first open
   return '<iframe class="frame'+(t.key===current?' active':'')+'" id="frame-'+t.key+'" data-src="'+t.src+'"'+src+' allow="microphone; autoplay; camera"></iframe>';
 }).join("");


 function toast(m){ toastEl.innerHTML=m; toastEl.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove("show");},3000); }


 function activate(key, programmatic){
   if(!byKey[key]) return;
   var f = document.getElementById("frame-"+key);
   if(f && !f.src) f.src = f.getAttribute("data-src");  // lazy-load on first visit
   TABS.forEach(function(t){
     document.getElementById("frame-"+t.key).classList.toggle("active", t.key===key);
     var ni = nav.querySelector('.nav-item[data-key="'+t.key+'"]'); if(ni) ni.classList.toggle("active", t.key===key);
   });
   current = key;
   if(programmatic && key!==home) toast('Opened <b>'+byKey[key].label+'</b>');
 }


 /* Collapse → current tab goes full-screen. Persisted. */
 function setCollapsed(v){ shell.classList.toggle("collapsed", v); try{ localStorage.setItem("shell_collapsed", v?"1":"0"); }catch(_){} }
 document.getElementById("collapse").onclick = function(){ setCollapsed(true); };
 document.getElementById("reopen").onclick = function(){ setCollapsed(false); };
 document.addEventListener("keydown", function(e){ if((e.metaKey||e.ctrlKey) && e.key==="\\"){ e.preventDefault(); setCollapsed(!shell.classList.contains("collapsed")); } });
 try{ if(localStorage.getItem("shell_collapsed")==="1") shell.classList.add("collapsed"); }catch(_){}


 nav.addEventListener("click", function(e){ var it=e.target.closest(".nav-item"); if(it) activate(it.getAttribute("data-key")); });


 /* PROGRAMMATIC / VOICE NAVIGATION ────────────────────────────────
    An embedded page (e.g. your assistant iframe) tells the shell to
    switch tabs by posting a message to the parent window:
        window.parent.postMessage({ type: "app-navigate", tab: "view2" }, "*");
    The home tab stays loaded in the background, so if it's a voice
    assistant it keeps talking/listening while another tab is shown. */
 window.addEventListener("message", function(e){
   var d = e.data || {};
   if(d.type===NAV_MESSAGE_TYPE && d.tab){ activate(String(d.tab).toLowerCase(), true); }
 });


 /* Optional deep link: ?tab=view2 */
 var q = new URLSearchParams(location.search).get("tab"); if(q && byKey[q]) activate(q);


 /* Expose a tiny API in case you want to drive it from this window too. */
 window.AppShell = { open:function(k){ activate(k, true); }, collapse:setCollapsed, tabs:TABS };

 /* TASK-ASSIGNMENT POPUPS ─────────────────────────────────────────
    team-tasks.html already has this exact popup, but it only renders
    while Tasks is the active tab - inactive iframes are opacity:0 (not
    display:none) so its poller keeps running invisibly in the background.
    This mirrors that poller here at the shell level so an assignment is
    visible no matter which tab you're on; suppressed only when Tasks
    itself is active, since that page already shows its own copy (avoids
    a literal double popup in that one case). Identity is read from the
    same localStorage key team-tasks.html's "who's on?" gate writes, so
    no separate sign-in step is needed. */
 var notePops = document.getElementById("notePops");
 var noteSeenKey = "shell_note_seen";
 var noteSeen = {};
 try{ (JSON.parse(localStorage.getItem(noteSeenKey)||"[]")).forEach(function(id){ noteSeen[id]=1; }); }catch(_){}

 function escNote(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

 function popNoteCard(n){
   var el = document.createElement("div");
   el.className = "notecard";
   el.innerHTML = "<b>"+escNote(n.title)+"</b><p>"+escNote(n.body)+"</p><button class=\"x\">✕</button>";
   el.querySelector(".x").onclick = function(e){ e.stopPropagation(); el.remove(); };
   el.onclick = function(){ el.remove(); activate("tasks", true); };
   notePops.appendChild(el);
   setTimeout(function(){ if(el.parentNode) el.remove(); }, 15000);
 }

 /* Count pill on a sidebar tab. 0 hides it. */
 function setNavBadge(key, n){
   var el = nav.querySelector('.badge[data-badge="'+key+'"]');
   if(!el) return;
   el.textContent = n > 99 ? "99+" : String(n);
   el.classList.toggle("on", n > 0);
 }

 /* At most this many toasts per poll — signing in with a backlog of
    assignments should not bury the screen. The Tasks badge carries the
    full count, so nothing is lost by capping the popups. */
 var MAX_POPS_PER_POLL = 3;

 function pollNotes(){
   var me = currentUser();
   if(!me){ setNavBadge("tasks", 0); return; }
   fetch("/api/team/notifications?user="+encodeURIComponent(me), { credentials:"same-origin" })
     .then(function(r){ return r.ok ? r.json() : null; })
     .then(function(d){
       if(!d) return;
       var notes = d.notifications || [];
       var fresh = false, popped = 0, unreadTasks = 0;
       notes.forEach(function(n){
         // Badge: every unread task assignment, whether or not it has
         // already been popped on this device.
         if(!n.readAt && n.type === "assignment") unreadTasks++;

         if(noteSeen[n.id]) return;
         noteSeen[n.id] = 1; fresh = true;
         if(n.readAt) return;                     // already acknowledged - nothing to show
         if(current === "tasks") return;          // Tasks tab already shows its own copy of this
         if(popped >= MAX_POPS_PER_POLL) return;  // badge still counts it
         popped++;
         popNoteCard(n);
       });
       setNavBadge("tasks", unreadTasks);
       if(fresh){ try{ localStorage.setItem(noteSeenKey, JSON.stringify(Object.keys(noteSeen).slice(-500))); }catch(_){} }
     })
     .catch(function(){});
 }

 /* ── Signed-in identity ──────────────────────────────────────────
    Picking a name happens on /who (the sign-in screen), which writes
    USER_KEY — the single identity every page in this app reads. All the
    shell does is display who that is and offer to switch. */
 function paintIdentity(){
   var m = rosterMember(currentUser());
   var av = document.getElementById("whoAv");
   var label = document.getElementById("whoLabel");
   if(!m){ av.classList.remove("on"); return; }
   av.textContent = m.name.charAt(0);
   av.style.background = m.color;
   av.classList.add("on");
   // A real signed-in account (from /api/auth/me) owns this label if present.
   if(!window.__authUser) label.textContent = m.name + " · " + m.role;
 }

 document.getElementById("whoBtn").onclick = goSignIn;
 window.AppShell.signIn = goSignIn;

 /* Names/colours for the footer chip. The sign-in screen fetches this too;
    here it only affects display, so the hardcoded fallback is harmless. */
 fetch("/api/team/roster", { credentials:"same-origin" })
   .then(function(r){ return r.ok ? r.json() : null; })
   .then(function(d){ if(d && d.members && d.members.length) ROSTER = d.members; })
   .catch(function(){})
   .then(paintIdentity);

 pollNotes();
 setInterval(pollNotes, 20000);
}

/* Who's signed in — fetched before building the nav so an admin's Team tab
   can be added; also wires the sidebar's sign-out button. */
fetch("/api/auth/me", { credentials: "same-origin" })
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(d){
    var user = d && d.user;
    var who = document.getElementById("whoLabel");
    // No user (either nobody's signed in, or the login gate is currently
    // switched off in the backend) - the footer then shows the team member
    // picked at the "Who's logging in?" gate instead (see paintIdentity).
    if (user) {
      window.__authUser = user;   // real account wins the footer label
      if (who) who.textContent = user.name + " · " + user.role;
      var lo = document.getElementById("logoutBtn"); if (lo) lo.style.display = "flex";
      if (user.role === "admin") {
        TABS.push({
          key: "team", label: "Team & Activity", sub: "Accounts · logins · audit", src: "/team",
          icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
        });
        SECTIONS.team = null;
      }
    }
  })
  .catch(function(){})
  .then(function(){ initShell(); });

document.getElementById("logoutBtn").addEventListener("click", function(){
  fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" })
    .catch(function(){})
    .then(function(){ location.href = "/login"; });
});
