name: Account isolation
on:
  pull_request:
  push:
    branches: [master]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/verify-storage-guards.mjs
      - run: node scripts/verify-video-knowledge.mjs
      - run: node scripts/verify-video-flow.mjs
      - run: node scripts/verify-video-auto-approval.mjs
      - run: node scripts/verify-video-backend.mjs
      - run: node scripts/verify-video-links.mjs
      - run: node scripts/verify-comment-agent.mjs
      - run: node scripts/verify-dm-reliability.mjs
      - run: node scripts/verify-task-owner-recovery.mjs
      - run: node scripts/verify-account-isolation.mjs
      - run: node scripts/verify-account-ui.mjs
      - run: node scripts/verify-harvey-credential-consent.mjs
      - run: node scripts/verify-workspace-files.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node scripts/verify-video-edit.mjs
      - run: node scripts/verify-harvey-job-ui.mjs
      - run: node scripts/verify-mls-live.mjs
      - run: node scripts/verify-harvey-work.mjs
      - run: node scripts/verify-work-continuation.mjs
      - run: node scripts/verify-openrouter-budget.mjs
      - run: node --check public/harvey-chat.js
      - run: npx playwright install --with-deps chromium
      - run: PW_CHROMIUM=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-local-browser.mjs
      - run: PW_CHROMIUM=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-browser-extension.mjs
      - run: HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-harvey-onboarding.mjs
      - run: HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-canvas-targeting.mjs
      - run: PW_CHROMIUM=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-harvey-reliability.mjs
      - run: HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-browser-persistence.mjs
      - run: HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-browser-recovery.mjs
      - run: HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-browser-upload.mjs
      - run: HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-harvey-computer-ui.mjs
      - run: TASK_UI_BROWSER=true HARVEY_BROWSER_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()") node scripts/verify-account-isolation.mjs
