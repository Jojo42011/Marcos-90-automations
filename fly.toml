# Marco DM + command center (Node). Ads proxy → Flask app (marco-agents).
# Docs: https://fly.io/docs/reference/configuration/

app = "marco-90-automation"
primary_region = "dfw"

# Top-level ON PURPOSE. In TOML a bare key attaches to the table header above
# it, so placing this further down silently made it http_service.checks.swap
# and the machine came up with SwapTotal: 0 while the config still "validated".
swap_size_mb = 1024

[build]

[[mounts]]
  source = "data"
  destination = "/data"

[env]
  VIDEO_KNOWLEDGE_ENABLED = "true"
  VIDEO_KNOWLEDGE_REPLIES_ENABLED = "true"
  ACCOUNT_ISOLATION = "true"
  TZ = "America/Chicago"
  HARVEY_BROWSER_ENABLED = "true"
  HARVEY_WORKER_ENABLED = "true"
  HARVEY_OUTCOME_AUDIT_MODEL = "anthropic/claude-sonnet-4.6"
  HARVEY_SCHEDULE_MODEL = "inception/mercury-2.5"
  HARVEY_PUBLIC_URL = "https://marco-90-automation.fly.dev"
  PORT = "3000"
  # Public URL of the Meta ads Flask dashboard (must match your Fly app name).
  AD_DASHBOARD_BASE_URL = "https://marco-agents.fly.dev"
  OPENCLAW_GATEWAY_URL = "https://harvey-claw.fly.dev"
  HARVEY_OWNER_NUMBER = "+19804430453"
  WHATSAPP_ALLOWED_TARGETS = "+17373461943"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "10s"

# Keep the CRM and background workers on two shared CPUs. Live memory use
# reached about 1.5 GiB with swap in use before the CPU resize.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
