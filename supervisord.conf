[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

[program:nodejs]
command=node /app/dist/src/server.js
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3000"

; The OpenShorts video sidecar (:8000) and the CapCutAPI draft service (:9001)
; were removed with the Content Manager on 2026-09-20. They existed only to
; serve that clip pipeline, so keeping them would burn ~1.5GB of the 2GB VM
; running two Python services nothing calls.
