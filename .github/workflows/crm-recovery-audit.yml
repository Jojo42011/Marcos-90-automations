name: CRM recovery counts
on:
  push:
    branches: [codex/crm-data-recovery]
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read only original and Marco CRM record counts
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a marco-90-automation -C "node -e \"eval(Buffer.from('','base64').toString())\""

      - name: Test candidate with live model in isolated temporary workspace
        timeout-minutes: 6
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          tar -czf /tmp/harvey-candidate.tar.gz dist scripts/smoke-harvey-recovery.mjs
          printf 'put /tmp/harvey-candidate.tar.gz /tmp/harvey-candidate-${{ github.sha }}.tar.gz\n' | flyctl ssh sftp shell -a marco-90-automation
          flyctl ssh console -a marco-90-automation -C "sh -c 'mkdir -p /tmp/harvey-candidate-${{ github.sha }} && tar -xzf /tmp/harvey-candidate-${{ github.sha }}.tar.gz -C /tmp/harvey-candidate-${{ github.sha }} && ln -s /app/node_modules /tmp/harvey-candidate-${{ github.sha }}/node_modules && cd /tmp/harvey-candidate-${{ github.sha }} && node scripts/smoke-harvey-recovery.mjs'"
