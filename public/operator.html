<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>HARVEY</title>
<style>
  :root {
    /* THEME - BLUE. Single source for the accent; canvas colors mirror these
       in the orb script's THEME block below. */
    --bg: #0a0a0a;
    --accent:        #1C6DD0;
    --accent-bright: #39B4FF;
    --accent-rgb:        28, 109, 208;
    --accent-bright-rgb: 57, 180, 255;
    --silver: #C6CAD1;
    --silver-deep: #8A8F98;
    --text: #E0E0E0;
    --label: #666;
    --white: #FFFFFF;
    --mono: "Courier New", Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }
  #hexgrid { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.5; }
  #app { position: relative; z-index: 2; display: flex; flex-direction: column; width: 100%; height: 100%; }
  #topbar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    height: 52px; padding: 0 22px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.55);
    background: rgba(10, 10, 10, 0.55); backdrop-filter: blur(2px);
  }
  #brand { font-family: var(--mono); font-size: 18px; letter-spacing: 0.55em; color: var(--text); text-transform: uppercase; padding-left: 2px; }
  #topright { display: flex; align-items: center; gap: 26px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--label); text-transform: uppercase; }
  #topright .val { color: var(--text); }
  #topright .seg { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  #topright .seg .k { color: var(--label); font-size: 9px; }
  #clock { color: var(--accent-bright); }
  #middle { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
  #center { flex: 1 1 auto; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; overflow: hidden; }
  #orb-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* A centred square: the core is a round object and stretching its canvas
     across a wide row only wastes pixels either side of it. */
  #operator-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(72vmin, 640px); height: min(72vmin, 640px); cursor: pointer; z-index: 1; }
  #status-pill {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%); z-index: 3;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
    padding: 7px 18px; border: 1px solid var(--accent); color: var(--accent);
    background: rgba(0, 6, 14, 0.45);
    transition: color 0.4s, border-color 0.4s, background 0.4s, box-shadow 0.4s; pointer-events: none;
  }
  #status-pill.standby { color: rgba(var(--accent-bright-rgb), 0.6); border-color: rgba(var(--accent-rgb), 0.5); }
  #status-pill.listening { color: var(--accent-bright); border-color: var(--accent-bright); background: rgba(var(--accent-rgb), 0.25); box-shadow: 0 0 18px rgba(var(--accent-bright-rgb), 0.35); }
  #status-pill.processing { color: var(--accent-bright); border-color: var(--accent-bright); background: rgba(var(--accent-rgb), 0.3); animation: pillPulse 0.9s ease-in-out infinite; }
  #status-pill.responding { color: var(--accent-bright); border-color: var(--accent-bright); background: rgba(var(--accent-rgb), 0.18); box-shadow: 0 0 14px rgba(var(--accent-bright-rgb), 0.25); }
  @keyframes pillPulse { 0%,100%{box-shadow:0 0 8px rgba(var(--accent-bright-rgb),0.3);opacity:0.7;} 50%{box-shadow:0 0 26px rgba(var(--accent-bright-rgb),0.7);opacity:1;} }
  #orb-label { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 3; font-family: var(--mono); font-size: 11px; letter-spacing: 0.3em; color: var(--label); text-transform: uppercase; text-align: center; pointer-events: none; white-space: nowrap; }
  #voice-note { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 3; font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em; color: rgba(var(--accent-bright-rgb), 0.55); text-transform: uppercase; display: none; pointer-events: none; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb), 0.35); }
  @media (max-width: 860px) { #topright .seg.owner { display: none; } }
  .hidden-hook { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: -9999px; }
</style>
</head>
<body>
  <canvas id="hexgrid"></canvas>

  <div id="app">
    <header id="topbar">
      <div id="brand">HARVEY</div>
      <div id="topright">
        <div class="seg owner"><span class="k">OPERATOR</span><span class="val">Marco</span></div>
        <div class="seg"><span class="k">MEMORY</span><span class="val"><a href="/memory" style="color:var(--silver);text-decoration:none;">NEURAL MAP</a></span></div>
        <div class="seg"><span class="k">DASHBOARD</span><span class="val"><a href="/dashboard" style="color:var(--silver);text-decoration:none;">COMMAND</a></span></div>
        <div class="seg"><span class="k">LOCAL TIME</span><span class="val" id="clock">--:--:--</span></div>
      </div>
    </header>

    <div id="middle">
      <main id="center">
        <div id="orb-wrap">
          <canvas id="operator-core"></canvas>
          <div id="status-pill" class="standby">STANDBY</div>
          <div id="orb-label">TAP CORE TO SPEAK</div>
          <div id="voice-note">VOICE UNAVAILABLE</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Hidden hooks Harvey's pipeline (aethon-voice.js) expects to find. The orb
       tap forwards to #harvey-mic-btn, which drives Harvey's real toggle. -->
  <canvas id="harvey-mic-btn" class="hidden-hook"></canvas>
  <div id="harvey-voice-status" class="hidden-hook"></div>
  <div id="jStatus" class="hidden-hook"><span id="jStatusText"></span><span id="jCoreHint"></span><span id="jMicIcon"></span></div>

  <!-- Harvey Core (Canvas 2D). Replaces the 603KB vendored three.min.js:
       the shared renderer needed no WebGL, and every byte in public/ ships
       in the deploy image. -->
  <script src="/harvey-core.js"></script>

  <!-- Bridge shim: the orb screen was authored against an "OperatorVoice"
       pipeline; here we delegate to Harvey's existing pipeline instead so the
       voice + brain + TTS are byte-for-byte Harvey. -->
  <script>
    window.__orbSetState = null;
    window.OperatorVoice = {
      init: function (hooks) { window.__orbSetState = hooks.setState; window.__orbLabel = hooks.orbLabelEl; },
      onOrbClick: function () { var b = document.getElementById("harvey-mic-btn"); if (b) b.click(); },
      unlockAudio: function () { if (window.unlockHarveyVoiceAudio) window.unlockHarveyVoiceAudio(); }
    };
    function __mapOrbState(t) {
      t = String(t || "").toUpperCase();
      if (t === "LISTENING") return "LISTENING";
      if (t === "PROCESSING" || t === "CONNECTING") return "PROCESSING";
      if (t === "RESPONDING") return "RESPONDING";
      return "STANDBY";
    }
    // Harvey's pipeline drives state through these globals - route them to the orb.
    window.setStatus = function (t, on) { if (window.__orbSetState) window.__orbSetState(__mapOrbState(t)); };
    window.setCoreState = function (mode) { if (window.__orbSetState) window.__orbSetState(__mapOrbState(mode)); };
  </script>

  <script>
  /* Operator core: the same shared renderer /jarvis mounts. The previous
     version of this file built its own THREE.js particle sphere, which meant
     two orbs to keep in sync and two sets of behaviour to reason about. */
  (function () {
    "use strict";
    const canvas = document.getElementById("operator-core");
    const pillEl = document.getElementById("status-pill");
    const orbLabelEl = document.getElementById("orb-label");
    const voiceNoteEl = document.getElementById("voice-note");
    if (!canvas || !window.HarveyCore) return;

    const STATES = {
      STANDBY:    { core: "idle",      pill: "standby",    name: "STANDBY",    label: "TAP CORE TO SPEAK" },
      LISTENING:  { core: "listening", pill: "listening",  name: "LISTENING",  label: "SPEAK NOW" },
      PROCESSING: { core: "thinking",  pill: "processing", name: "PROCESSING", label: "THINKING" },
      RESPONDING: { core: "speaking",  pill: "responding", name: "RESPONDING", label: "TAP TO INTERRUPT" },
    };
    let currentState = "STANDBY";

    function setState(key) {
      const target = STATES[key] || STATES.STANDBY;
      currentState = key;
      pillEl.textContent = target.name;
      pillEl.className = target.pill;
      orbLabelEl.textContent = target.label;
      window.HarveyCore.setState(target.core);
    }

    window.HarveyCore.mount(canvas, {
      onActivate: function () { window.OperatorVoice.onOrbClick(); },
    });

    window.OperatorVoice.init({
      setState: setState,
      getCurrentState: function () { return currentState; },
      orbLabelEl: orbLabelEl,
      voiceNoteEl: voiceNoteEl,
    });
    setState("STANDBY");
  })();
  </script>

  <!-- Harvey's real pipeline: streaming TTS + STT/brain. Loaded AFTER the orb so
       the bridge globals + hidden hooks exist. -->
  <!-- Voice can start a background job, and this page has no transcript to put a
       reply card in, so the watcher renders as a floating notice. -->
  <script src="/harvey-jobwatch.js"></script>
  <script src="/harvey-streaming-tts.js"></script>
  <script src="/aethon-voice.js"></script>
  <script>HarveyJobWatch.init({ mount: "floating" });</script>
</body>
</html>
