<!DOCTYPE html>
<html lang="en">
<head>
<script src="/account-session.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analytics — Marco Puga Realty</title>
<style>
  :root{
    --accent:#59c4c4; --accent-2:#4ca7a7; --soft:#eef8f8;
    --line:#e8edee; --text:#1f2b30; --muted:#6b7a82; --bg:#f7fafa;
    --ok:#0f9d76; --warn:#b45309; --bad:#c0616a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:22px 26px 40px}
  h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .head .grow{flex:1;min-width:220px}
  button.refresh{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
  button.refresh:hover{border-color:var(--accent)}
  button.refresh[disabled]{opacity:.55;cursor:default}

  /* Tabs: one per platform, plus the combined roll-up. */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{position:relative;display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid transparent;border-bottom:none;
       border-radius:9px 9px 0 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;background:transparent;bottom:-1px}
  .tab:hover{color:var(--text);background:#fff}
  .tab.active{color:var(--text);background:#fff;border-color:var(--line);border-bottom:1px solid #fff}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:#cbd5d5;flex:0 0 auto}
  .tab .dot.live{background:var(--ok)} .tab .dot.warn{background:var(--warn)} .tab .dot.bad{background:var(--bad)}
  .tabsep{width:1px;align-self:center;height:18px;background:var(--line);margin:0 5px}

  .banner{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-bottom:16px;border:1px solid}
  .banner.info{background:var(--soft);border-color:rgba(89,196,196,.35);color:#215b5b}
  .banner.warn{background:#fffbeb;border-color:rgba(180,83,9,.25);color:#8a4b09}
  .banner.bad{background:#fef2f2;border-color:rgba(192,97,106,.3);color:#8f3a41}
  .banner b{font-weight:700}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 15px}
  .card .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .card .v{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
  .card .v.none{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
  .card .n{font-size:11px;color:var(--muted);margin-top:4px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin-bottom:16px}
  .panel h2{font-size:13px;font-weight:700;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #f2f5f5;font-size:13px}
  .row:last-child{border-bottom:none}
  .row .lbl{color:var(--muted)}
  .row .val{font-weight:600;text-align:right}
  .mix{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#f0f3f3;margin:10px 0 8px}
  .mix i{display:block;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
  a.top{color:#0f766e;text-decoration:none;font-weight:600}
  a.top:hover{text-decoration:underline}
  .empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .empty .big{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
  .src{font-size:11px;color:var(--muted);margin-top:12px}
:root{--card:#fff}
  button.refresh,.card,.panel{background:var(--card)}
  .tab:hover,.tab.active{background:transparent}.tab.active{border-color:transparent;border-bottom:2px solid var(--accent)}
  .row{border-color:var(--line)}.mix{background:var(--line)}
  [data-theme="dark"] .banner.info{color:#a9d6d6}
  [data-theme="dark"] .banner.warn{background:#342b1b;color:#edc98c}
  [data-theme="dark"] .banner.bad{background:#342328;color:#efb0b7}
  [data-theme="dark"] a.top{color:#8bd6cf}
</style>
<link rel="stylesheet" href="/growth-ui.css">
</head>
<body class="growth-page">

<div class="head">
  <div class="grow">
    <div class="eyebrow">Your growth workspace</div><h1>Analytics</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="refresh" id="refresh">Refresh</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="dmView" hidden></div>
<div id="view"><div class="empty" aria-hidden="true"></div></div>

<script>
"use strict";

var DATA = null;
var CURRENT = "all";

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

/* null and 0 are different answers and must never render the same: null is
   "no source for this", 0 is "measured, and it's zero". */
function num(v){
  if (v == null) return null;
  if (Math.abs(v) >= 1000000) return (v/1000000).toFixed(v >= 10000000 ? 0 : 1).replace(/\.0$/,"") + "M";
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/,"") + "K";
  return String(v);
}
function full(v){ return v == null ? "—" : v.toLocaleString(); }

function ago(iso){
  if (!iso) return "never";
  var ms = Date.now() - Date.parse(iso);
  if (!isFinite(ms)) return "unknown";
  var m = Math.round(ms/60000);
  if (m < 60) return m + "m ago";
  var h = Math.round(m/60);
  if (h < 48) return h + "h ago";
  return Math.round(h/24) + "d ago";
}

function dotClass(p){
  if (p.status === "live") return p.stale ? "warn" : "live";
  if (p.status === "error" || p.status === "unreadable") return "bad";
  return "";
}

function card(k, v, note, suffix){
  var shown = num(v);
  return '<div class="card"><div class="k">' + esc(k) + '</div>' +
    (shown === null
      ? '<div class="v none">No data</div>'
      : '<div class="v" title="' + esc(full(v)) + '">' + esc(shown) + esc(suffix || "") + '</div>') +
    (note ? '<div class="n">' + esc(note) + '</div>' : '') + '</div>';
}

/* Captions on listing posts run to hundreds of characters with hashtags. Shown
   whole they push every other row off the panel, so the number the operator
   came for stops being the first thing they see. */
function shortCaption(s){
  var t = String(s || "").replace(/\s+/g, " ").trim();
  return t.length > 150 ? t.slice(0, 150) + "…" : t;
}

function statusBanner(p){
  /* A failing refresh is not "stale data", it is a broken pipe — and it needs
     to read as a problem someone must fix, not as a nudge to press Refresh. */
  if (p.status === "live" && p.refreshFailing) {
    return '<div class="banner bad"><b>The automatic refresh is failing.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "live" && p.stale) {
    return '<div class="banner warn"><b>These numbers are stale.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "error") {
    return '<div class="banner bad"><b>Couldn\'t load this platform.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "unreadable") {
    return '<div class="banner bad"><b>Zernio replied, but the response couldn\'t be read.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "not_connected") {
    return '<div class="banner info"><b>Not connected yet.</b> ' + esc(p.note || "") + '</div>';
  }
  return "";
}

function mixBar(mix){
  if (!mix) return "";
  var total = (mix.viral||0)+(mix.hot||0)+(mix.average||0)+(mix.cold||0);
  if (!total) return "";
  var seg = [
    ["Viral", mix.viral||0, "#7c3aed"],
    ["Hot", mix.hot||0, "#0f9d76"],
    ["Average", mix.average||0, "#59c4c4"],
    ["Cold", mix.cold||0, "#cbd5d5"]
  ];
  return '<div class="panel"><h2>Post performance mix</h2>' +
    '<div class="mix">' + seg.map(function(s){
      return '<i style="width:' + ((s[1]/total)*100).toFixed(2) + '%;background:' + s[2] + '"></i>';
    }).join("") + '</div>' +
    '<div class="legend">' + seg.map(function(s){
      return '<span><b style="background:' + s[2] + '"></b>' + s[0] + ' · ' + s[1] + '</span>';
    }).join("") + '</div></div>';
}

function safePostURL(url){
  try { var u=new URL(url); return /^https?:$/.test(u.protocol)?u.href:""; } catch(_){ return ""; }
}
var POST_SORT="views", POST_QUERY="", GROWTH_GOAL="comments";
function postLink(post,label,cls){
  var url=safePostURL(post.url);
  return url?'<a class="'+(cls||'top')+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':'<span class="'+(cls||'')+'">'+esc(label)+'</span>';
}
function growthCandidates(channels,goal){
  var found=[];
  channels.filter(function(c){return c.status==='live';}).forEach(function(c){
    var eligible=(c.recentPosts||[]).filter(function(p){return p.caption&&p.views>=100&&p[goal]!=null&&(!p.availableMetrics||p.availableMetrics.includes(goal));});
    if(eligible.length<4)return;
    eligible.forEach(function(post){
      var others=eligible.filter(function(x){return x!==post;}).map(function(x){return goal==='views'?x.views:x[goal]/x.views*1000;}).sort(function(a,b){return a-b;});
      var mid=Math.floor(others.length/2),baseline=others.length%2?others[mid]:(others[mid-1]+others[mid])/2;
      var score=goal==='views'?post.views:post[goal]/post.views*1000;
      if(score<=baseline||score===0)return;
      found.push({post:post,label:c.label,score:score,baseline:baseline,sample:eligible.length,lift:baseline?score/baseline:null});
    });
  });
  return found.sort(function(a,b){return (b.lift||0)-(a.lift||0)||b.score-a.score;}).slice(0,3);
}
function growthActions(channels){
  var goal=GROWTH_GOAL,items=growthCandidates(channels,goal);
  var labels={comments:'Start conversations',shares:'Earn referrals & shares',saves:'Be worth saving',views:'Reach more people'};
  var test={comments:'Make a follow-up answering the question in this caption. End with one specific question viewers can answer.',shares:'Create a companion tip for the same audience. Give viewers a useful reason to send it to a friend.',saves:'Turn the topic into a short checklist or step-by-step guide people can revisit.',views:'Test a second opening for the same topic. Keep the format and length similar so the hook is the main change.'};
  return '<section class="panel growth-lab"><div class="panel-head"><div><div class="eyebrow">Your next move</div><h2>Turn a strong signal into a weekly experiment</h2></div><select id="growthGoal" aria-label="Content growth goal">'+Object.keys(labels).map(function(k){return '<option value="'+k+'"'+(goal===k?' selected':'')+'>'+labels[k]+'</option>';}).join('')+'</select></div><div class="experiment-grid">'+(items.length?items.map(function(x,i){return '<article class="experiment"><span class="eyebrow">Experiment 0'+(i+1)+' · '+esc(x.label)+'</span><h3>'+esc(x.lift?x.lift.toFixed(1)+'× the account median':'Above the account median')+'</h3><p class="sub">'+esc(goal==='views'?full(x.score)+' views':x.score.toFixed(1)+' '+goal+' per 1,000 views')+' · compared with '+(x.sample-1)+' other eligible posts</p><blockquote>'+esc(shortCaption(x.post.caption))+'</blockquote><p>'+esc(test[goal])+'</p><div class="experiment-links">'+postLink(x.post,'Study the original ↗')+'<a class="top" href="/smartposter">Plan the follow-up →</a></div></article>';}).join(''):'<div class="empty">No reliable comparison yet. We need at least four captioned posts with 100+ views on the same account and a reported '+esc(goal)+' metric. Keep publishing and check back.</div>')+'</div><div class="src">Based on the available source sample, not every historical post. Benchmarks compare the same account; posts can have different ages. These are experiments, not proven causes or attributed leads. After seven days, compare the new post’s '+esc(goal==='views'?'views':goal+' per 1,000 views')+' and record what you learned.</div></section>';
}
function dashboardBody(p,combined){
  var posts=p.recentPosts||[];
  var html='<section class="hero"><div><div class="eyebrow">Content intelligence / '+esc(combined?'All channels':p.label)+'</div><h2>Find what moves your audience.</h2><p>See what earns attention, learn from your strongest posts, and bring that insight into your next piece of content.</p></div><div class="hero-mark" aria-hidden="true">↗</div></section>';
  if(combined){
    html+=DATA.platforms.filter(function(x){return x.status==='live';}).map(statusBanner).join('');
  }else html+=statusBanner(p);
  if((combined&&!(p.included||[]).length)||(!combined&&p.status!=='live')) return html+'<div class="panel empty"><div class="big">Your next insight starts with connected data.</div>'+esc(p.note||'Connect a social account to begin seeing performance here.')+'</div>';
  html+='<div class="cards">'+card('Audience',p.followers,'Reported followers across selected channels')+card('Content views',p.views,'Reported views · not unique people')+card('Engagement',p.engagementRate,'Interactions as a share of views','%')+card('Average views',p.avgViews,'Per post in the source data')+'</div>';
  html+=growthActions(combined?DATA.platforms:[p]);
  var ranked=posts.filter(function(x){return x.views!=null;}).slice().sort(function(a,b){return b.views-a.views;}).slice(0,7);
  var max=Math.max.apply(null,[1].concat(ranked.map(function(x){return x.views;})));
  html+='<div class="analytics-grid"><section class="panel"><div class="panel-head"><div><div class="eyebrow">The content signal</div><h2>What earns attention</h2><div class="sub">Most-viewed recent posts · limited to available data</div></div><span class="sub">'+posts.length+' posts available</span></div>';
  html+=ranked.length?'<div class="chart" role="img" aria-label="Recent posts ranked by views: '+esc(ranked.map(function(x,i){return shortCaption(x.caption||'Post '+(i+1))+': '+full(x.views)+' views';}).join('; '))+'">'+ranked.map(function(x){return '<div class="chart-col" title="'+esc(shortCaption(x.caption))+'"><strong>'+esc(num(x.views))+'</strong><div class="chart-bar" style="height:'+Math.max(0,x.views/max*170)+'px"></div></div>';}).join('')+'</div><div class="chart-labels">'+ranked.map(function(x,i){return '<span title="'+esc(shortCaption(x.caption))+'">'+esc(x.caption?String(x.caption).slice(0,38)+(x.caption.length>38?'…':''):'Post '+(i+1))+'</span>';}).join('')+'</div>':'<div class="empty">Post-level views will appear when the source reports them.</div>';
  html+='<div class="src">A comparison of posts, not a growth trend. Open the ranked content below to review the hook, topic, and call to action.</div></section>';
  var top=p.topPost;
  html+='<section class="panel spotlight"><div class="eyebrow">Creative to learn from</div><h2>Standout content</h2>'+(top?'<p class="quote">'+esc(shortCaption(top.caption)||'Your highest-viewed post')+'</p><div class="score">'+esc(num(top.views)||'—')+' <span class="sub">views</span></div><div class="sub">'+esc(top.platform||p.label)+'</div><p class="src">Review the opening, format, and audience question. Use what worked as a starting point for your next idea.</p><div style="margin-top:18px">'+postLink(top,'Review this post ↗')+'</div>':'<div class="empty">Your strongest post will appear here once performance data is available.</div>')+'</section></div>';
  html+='<div class="analytics-grid"><section class="panel"><div class="panel-head"><div><div class="eyebrow">Channel breakdown</div><h2>'+esc(combined?'Where attention comes from':'Your account at a glance')+'</h2></div></div>';
  var channels=combined?DATA.platforms:[p];
  var maxViews=Math.max.apply(null,[1].concat(channels.map(function(x){return x.status==='live'?x.views||0:0;})));
  html+=channels.map(function(x){return '<button class="channel" data-channel="'+esc(x.id)+'"><div class="channel-line"><strong>'+esc(x.label)+(x.accountUsername?' · @'+esc(x.accountUsername):'')+'</strong><span>'+esc(x.status==='live'?full(x.views)+' views':x.status.replace(/_/g,' '))+' →</span></div><div class="meter"><i style="width:'+(x.status==='live'?Math.max(0,(x.views||0)/maxViews*100):0)+'%"></i></div></button>';}).join('');
  html+='<div class="src">'+esc(combined?'Oldest included data: '+ago(p.lastUpdated):'Source: '+(p.source||'unknown')+' · updated '+ago(p.lastUpdated))+'</div></section><section class="panel"><div class="eyebrow">Audience actions</div><h2>Beyond the view</h2>'+[['Likes',p.likes],['Comments',p.comments],['Shares',p.shares],['Saves',p.saves]].map(function(x){return '<div class="row"><span class="lbl">'+x[0]+'</span><span class="val">'+full(x[1])+'</span></div>';}).join('')+'<div class="src">Look for content people discuss, share, or save. A dash means the source has not supplied that metric.</div></section></div>';
  html+='<section class="panel"><div class="panel-head"><div><div class="eyebrow">Content library</div><h2>Turn performance into your next idea</h2></div><div class="actions"><input class="search" id="postSearch" type="search" aria-label="Search post captions" placeholder="Search captions…" value="'+esc(POST_QUERY)+'"><select id="postSort" aria-label="Sort posts"><option value="views"'+(POST_SORT==='views'?' selected':'')+'>Most views</option><option value="comments"'+(POST_SORT==='comments'?' selected':'')+'>Most comments</option><option value="shares"'+(POST_SORT==='shares'?' selected':'')+'>Most shares</option><option value="recent"'+(POST_SORT==='recent'?' selected':'')+'>Most recent</option></select></div></div><div id="postResults">'+postRows(p)+'</div></section>';
  html+='<details class="panel details"><summary>All reported metrics & source details</summary><div class="detail-grid">'+[['Posts',p.posts],['Reach',p.reach],['Profile views',p.profileViews],['Follows from posts',p.followsFromPosts]].map(function(x){return '<div><div class="k">'+x[0]+'</div><div class="v">'+full(x[1])+'</div></div>';}).join('')+'</div><div class="src">Metrics may use different reporting windows across providers. Totals are not a deduplicated audience or an attributed sales funnel.</div></details>'+mixBar(p.mix);
  return html;
}
function postRows(p){
  var posts=(p.recentPosts||[]).filter(function(x){return String(x.caption||'').toLowerCase().includes(POST_QUERY.toLowerCase());}).slice().sort(function(a,b){
    if(POST_SORT==='recent') return (Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0);
    return (b[POST_SORT]==null?-1:b[POST_SORT])-(a[POST_SORT]==null?-1:a[POST_SORT]);
  });
  if(!posts.length)return '<div class="empty">'+(POST_QUERY?'No captions match your search.':'No recent posts have been reported yet.')+'</div>';
  return '<div class="table-scroll"><table class="post-table"><thead><tr><th scope="col">Content</th><th scope="col">Views</th><th scope="col">Likes</th><th scope="col">Comments</th><th scope="col">Shares</th><th scope="col">Saves</th></tr></thead><tbody>'+posts.map(function(x,i){return '<tr><td><div class="rank">'+String(i+1).padStart(2,'0')+' · '+esc(x.accountLabel||x.platform||p.label)+(x.publishedAt?' · '+esc(new Date(x.publishedAt).toLocaleDateString()):'')+'</div>'+postLink(x,shortCaption(x.caption)||'Caption unavailable — open original post','post-title')+'</td>'+['views','likes','comments','shares','saves'].map(function(k){return '<td>'+full(x[k])+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
}
function metricsBody(p){return dashboardBody(p,false);}
function combinedBody(p){return dashboardBody(p,true);}

function render(){
  if (!DATA) return;

  var tabs = [{ id:"all", label: DATA.combined.label, status: DATA.combined.status, stale: DATA.combined.stale }]
    .concat(DATA.platforms.map(function(p){ return { id:p.id, label:p.label, status:p.status, stale:p.stale }; }));

  document.getElementById("tabs").innerHTML = tabs.map(function(t){
    return '<button class="tab' + (t.id === CURRENT ? " active" : "") + '" aria-pressed="' + (t.id === CURRENT) + '" data-id="' + esc(t.id) + '">' +
      '<span class="dot ' + dotClass(t) + '"></span>' + esc(t.label) + '</button>';
  }).join("") +
    /* Separated on purpose: the DM Agent is a console, not a platform, and a
       plain fifth chip would read as another set of metrics. */
    '<span class="tabsep"></span>' +
    '<button class="tab' + (CURRENT === "dm" ? " active" : "") + '" aria-pressed="' + (CURRENT === 'dm') + '" data-id="dm">DM Agent</button>';

  var live = DATA.platforms.filter(function(p){ return p.status === "live"; }).length;
  var connected = DATA.zernio && DATA.zernio.connectedAccounts ? DATA.zernio.connectedAccounts.length : live;
  var owner = DATA.zernio && DATA.zernio.owner ? String(DATA.zernio.owner) : "";
  document.getElementById("sub").textContent =
    live + " live · " + connected + " connected on Zernio" +
    (owner ? " · " + owner + "'s profile" : "") +
    (DATA.zernio && DATA.zernio.configured ? "" : " · Zernio not connected");

  var view = document.getElementById("view");
  var dmView=document.getElementById("dmView");
  view.hidden=CURRENT==="dm"; dmView.hidden=CURRENT!=="dm";
  if (CURRENT === "dm") {
    /* Embedded, not reimplemented — it is a full console with its own thread
       list and reply flow. Kept mounted once loaded so switching tabs doesn't
       throw away an open conversation. */
    if (!document.getElementById("dmFrame")) {
      dmView.innerHTML = '<iframe id="dmFrame" title="DM Agent" src="/chat" ' +
        'style="width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);' +
        'border-radius:11px;background:#fff;display:block"></iframe>';
    }
    document.getElementById("sub").textContent = "DM Agent — this account's conversations only";
    return;
  }
  view.innerHTML = CURRENT === "all"
    ? combinedBody(DATA.combined)
    : metricsBody(DATA.platforms.filter(function(p){ return p.id === CURRENT; })[0] || DATA.platforms[0]);
}

document.getElementById("view").addEventListener("click",function(e){var b=e.target.closest("[data-channel]");if(b){CURRENT=b.dataset.channel;render();}});
document.getElementById("view").addEventListener("input",function(e){if(e.target.id!=="postSearch")return;POST_QUERY=e.target.value;document.getElementById("postResults").innerHTML=postRows(CURRENT==="all"?DATA.combined:DATA.platforms.find(function(p){return p.id===CURRENT;}));});
document.getElementById("view").addEventListener("change",function(e){if(e.target.id==="growthGoal"){GROWTH_GOAL=e.target.value;render();return;}if(e.target.id!=="postSort")return;POST_SORT=e.target.value;document.getElementById("postResults").innerHTML=postRows(CURRENT==="all"?DATA.combined:DATA.platforms.find(function(p){return p.id===CURRENT;}));});
async function load(){
  var btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    var res = await fetch("/api/analytics/social", { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("Server returned " + res.status);
    DATA = await res.json();
    render();
  } catch (err) {
    document.getElementById("sub").textContent = "Couldn't load analytics";
    document.getElementById("view").innerHTML =
      '<div class="banner bad"><b>Couldn\'t load analytics.</b> ' + esc(err.message) +
      '</div><div class="panel"><div class="empty">Nothing is shown rather than showing stale or made-up numbers. Try Refresh.</div></div>';
  } finally {
    btn.disabled = false; btn.textContent = "Refresh";
  }
}

document.getElementById("tabs").addEventListener("click", function(e){
  var t = e.target.closest(".tab");
  if (!t) return;
  CURRENT = t.getAttribute("data-id");
  render();
});
document.getElementById("refresh").addEventListener("click", load);

load();
</script>
</body>
</html>
