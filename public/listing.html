<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing · Marco Puga</title>
<style>
  /* Same palette and plain-CSS approach as listings.html — this is the page
     behind a click there, so it has to read as the same product, not a
     different one that happens to be linked. */
  :root{
    --bg:#F6F7F9; --card:#FFFFFF; --line:#E3E7EE; --ink:#0F172A; --muted:#64748B;
    --brand:#0E7490; --brand2:#0891B2; --urgent:#DC2626; --ok:#059669; --amber:#B45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .top{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--card);
       border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top h1{font-size:16px;margin:0;letter-spacing:.02em}
  .wrap{padding:18px 20px;max-width:1100px;margin:0 auto}
  button{padding:9px 16px;border:none;border-radius:8px;background:var(--brand);color:#fff;
         font-weight:700;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}

  /* Gallery: one big frame plus a thumbnail strip. Deliberately not a carousel
     that auto-advances — an agent scanning a house wants to control the pace. */
  .gallery{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .hero{position:relative;background:#EEF2F7}
  .hero img{width:100%;aspect-ratio:16/10;object-fit:contain;display:block;background:#0F172A}
  .nophoto{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
           color:var(--muted);font-size:13px;background:#EEF2F7}
  .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(15,23,42,.62);color:#fff;
       border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;padding:0;
       display:flex;align-items:center;justify-content:center}
  .nav:hover{background:rgba(15,23,42,.85)}
  .nav.prev{left:12px} .nav.next{right:12px}
  .counter{position:absolute;right:12px;bottom:12px;background:rgba(15,23,42,.72);color:#fff;
           font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
  .thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
  .thumbs img{width:84px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;
              border:2px solid transparent;flex:none;background:#EEF2F7}
  .thumbs img.on{border-color:var(--brand2)}

  .head{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .price{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .addr{font-size:17px;font-weight:700;margin-top:4px}
  .sub{font-size:13px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;
        border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .chip.active{color:var(--ok);border-color:var(--ok)}
  .chip.pending{color:var(--amber);border-color:var(--amber)}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;
         background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .fact{background:var(--card);padding:12px 14px}
  .fact .k{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .fact .v{font-size:16px;font-weight:700;margin-top:2px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .panel h2{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;
            letter-spacing:.06em;margin:0 0 10px}
  .remarks{white-space:pre-wrap;font-size:14px;line-height:1.6}
  .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 22px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row .k{color:var(--muted)}
  .row .v{font-weight:600;text-align:right}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--card);
         border:1px solid var(--line);border-radius:12px}
  .warn{background:#FFFBEB;border:1px solid #FCD34D;color:#92400E;padding:11px 14px;
        border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:14px}
  .err{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B}
  a.maplink{color:var(--brand);font-weight:700;text-decoration:none;font-size:13px}
  a.maplink:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="top">
  <button class="ghost" id="back">&larr; Back to MLS</button>
  <h1 id="topTitle">Listing</h1>
</div>

<div class="wrap" id="wrap">
  <div class="empty" id="loading">Loading listing…</div>
</div>

<script>
function token(){
  const p = new URLSearchParams(location.search);
  return p.get("token") || localStorage.getItem("dashboardToken") || "";
}
function url(path, params){
  const u = new URL(path, location.origin);
  if (params) for (const [k,v] of Object.entries(params)) if (v !== "" && v != null) u.searchParams.set(k,v);
  const t = token(); if (t) u.searchParams.set("token", t);
  return u.toString();
}
const esc = s => { const d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; };
const money = n => n==null ? "—" : "$" + Number(n).toLocaleString();
const el = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get("key") || "";

/* Going "back" means the search you came from, with its filters intact —
   history.back() does that for free. Only when this page was opened directly
   (a pasted link, a new tab) is there nothing to go back to, and then we send
   them to the MLS list rather than leaving a dead button. */
el("back").onclick = () => {
  if (history.length > 1) history.back();
  else location.href = url("/listings");
};

let PHOTOS = [], idx = 0;

function paintHero(){
  if (!PHOTOS.length) return;
  el("heroImg").src = PHOTOS[idx];
  el("counter").textContent = (idx+1) + " / " + PHOTOS.length;
  document.querySelectorAll(".thumbs img").forEach((t,i) => t.classList.toggle("on", i===idx));
  const active = document.querySelector(".thumbs img.on");
  if (active) active.scrollIntoView({ block:"nearest", inline:"nearest" });
}
function step(d){
  if (!PHOTOS.length) return;
  idx = (idx + d + PHOTOS.length) % PHOTOS.length;   // wraps both ways
  paintHero();
}

function gallery(l){
  PHOTOS = (l.photos && l.photos.length) ? l.photos : (l.photoUrl ? [l.photoUrl] : []);
  if (!PHOTOS.length) return '<div class="gallery"><div class="nophoto">No photos in the feed for this listing</div></div>';
  return '<div class="gallery">' +
    '<div class="hero">' +
      '<img id="heroImg" src="'+esc(PHOTOS[0])+'" alt="">' +
      (PHOTOS.length > 1
        ? '<button class="nav prev" id="prev" aria-label="Previous photo">&#8249;</button>' +
          '<button class="nav next" id="next" aria-label="Next photo">&#8250;</button>' +
          '<span class="counter" id="counter">1 / '+PHOTOS.length+'</span>'
        : '') +
    '</div>' +
    (PHOTOS.length > 1
      ? '<div class="thumbs">' + PHOTOS.map((p,i) =>
          '<img src="'+esc(p)+'" data-i="'+i+'" class="'+(i===0?'on':'')+'" alt="" loading="lazy">').join("") + '</div>'
      : '') +
  '</div>';
}

function factGrid(l){
  const f = [];
  if (l.beds != null) f.push(["Beds", l.beds]);
  if (l.baths != null) f.push(["Baths", l.baths]);
  if (l.livingArea) f.push(["Sq ft", Number(l.livingArea).toLocaleString()]);
  if (l.detail && l.detail.acres != null) f.push(["Acres", l.detail.acres]);
  if (l.yearBuilt) f.push(["Built", l.yearBuilt]);
  if (l.detail && l.detail.garage != null) f.push(["Garage", l.detail.garage]);
  if (l.detail && l.detail.daysOnMarket != null) f.push(["Days on market", l.detail.daysOnMarket]);
  if (!f.length) return "";
  return '<div class="facts">' + f.map(([k,v]) =>
    '<div class="fact"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>').join("") + '</div>';
}

/* Only rows the feed actually filled. A detail page padded with "—" tells you
   nothing and buries the fields that do have answers. */
function rows(pairs){
  const live = pairs.filter(([,v]) => v !== null && v !== undefined && v !== "");
  if (!live.length) return "";
  return '<div class="rows">' + live.map(([k,v]) =>
    '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>').join("") + '</div>';
}

function render(l){
  const d = l.detail || {};
  const st = (l.status||"").toLowerCase();
  const stCls = st === "active" ? "active" : st === "pending" ? "pending" : "";
  const cityLine = [l.city, l.state, l.postalCode].filter(Boolean).join(", ");
  document.title = (l.street || "Listing") + " · Marco Puga";
  el("topTitle").textContent = l.street || "Listing";

  const details = rows([
    ["Property type", l.propertyType], ["Sub type", d.subType], ["Style", d.style],
    ["Stories", d.stories], ["Construction", d.construction], ["Roof", d.roof],
    ["Flooring", d.flooring], ["Heating", d.heating], ["Cooling", d.cooling],
    ["Pool", d.pool], ["Laundry", d.laundry], ["Subdivision", l.subdivision],
    ["County", d.county],
    /* `area` and `lotSize` are deliberately absent: the feed's `property.area`
       IS the living area already shown in the fact strip, and `lotSize` is the
       same number as Acres. Printing either again just makes the reader check
       whether two rows disagree. */
    ["Annual taxes", d.taxes != null ? money(d.taxes) + (d.taxYear ? " (" + d.taxYear + ")" : "") : null],
  ]);
  const schools = rows([
    ["District", d.schoolDistrict], ["Elementary", d.elementary],
    ["Middle", d.middle], ["High", d.high],
  ]);
  const listedBy = rows([
    ["Agent", l.listAgent], ["Phone", d.agentPhone], ["Office", l.listOffice],
    ["MLS #", l.mlsNumber], ["Listed", l.listedAt ? String(l.listedAt).slice(0,10) : null],
    ["Last updated", l.modificationTs ? String(l.modificationTs).slice(0,10) : null],
  ]);
  const features = rows([
    ["Interior", d.interiorFeatures], ["Exterior", d.exteriorFeatures],
  ]);

  el("wrap").innerHTML =
    (String(l.status||"").toLowerCase() !== "active"
      ? '<div class="warn">This listing is <b>'+esc(l.status||"not active")+'</b>. It is shown for reference; it is not on the market.</div>'
      : '') +
    gallery(l) +
    '<div class="head">' +
      '<div class="price">'+money(l.listPrice)+
        (l.closePrice ? ' <span class="sub">· closed at '+esc(money(l.closePrice))+'</span>' : '')+'</div>' +
      '<div class="addr">'+esc(l.street||"(no address)")+'</div>' +
      '<div class="sub">'+esc(cityLine)+'</div>' +
      '<div class="chips">' +
        (l.status ? '<span class="chip '+stCls+'">'+esc(l.status)+'</span>' : '') +
        (l.mlsNumber ? '<span class="chip">MLS '+esc(l.mlsNumber)+'</span>' : '') +
        (l.propertyType ? '<span class="chip">'+esc(l.propertyType)+'</span>' : '') +
      '</div>' +
      (d.lat != null && d.lng != null
        ? '<div style="margin-top:10px"><a class="maplink" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+
          encodeURIComponent(d.lat + "," + d.lng)+'">Open in Maps &nearr;</a></div>'
        : '') +
    '</div>' +
    factGrid(l) +
    (l.publicRemarks ? '<div class="panel"><h2>About this home</h2><div class="remarks">'+esc(l.publicRemarks)+'</div></div>' : '') +
    (features ? '<div class="panel"><h2>Features</h2>'+features+'</div>' : '') +
    (details ? '<div class="panel"><h2>Property details</h2>'+details+'</div>' : '') +
    (schools ? '<div class="panel"><h2>Schools</h2>'+schools+'</div>' : '') +
    (listedBy ? '<div class="panel"><h2>Listed by</h2>'+listedBy+'</div>' : '');

  if (PHOTOS.length > 1) {
    el("prev").onclick = () => step(-1);
    el("next").onclick = () => step(1);
    document.querySelectorAll(".thumbs img").forEach(t =>
      t.addEventListener("click", () => { idx = Number(t.getAttribute("data-i")); paintHero(); }));
    // Arrow keys, because that is how anyone flips through photos.
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
    });
  }
}

async function load(){
  if (!KEY){ el("wrap").innerHTML = '<div class="empty">No listing was specified.</div>'; return; }
  try {
    const r = await fetch(url("/api/mls/listing/" + encodeURIComponent(KEY)));
    if (r.status === 404){
      /* Gone from the feed is its own answer — say that rather than showing an
         empty page that looks like a bug. */
      el("wrap").innerHTML = '<div class="empty">That listing is no longer in the MLS feed. It may have sold, expired or been withdrawn.</div>';
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    el("wrap").innerHTML = '<div class="empty">Could not load that listing: '+esc(e.message)+'</div>';
  }
}
load();
</script>
</body>
</html>
