name: Harvey candidate workflows
on:
  push:
    branches: ['codex/harvey-live-workflow-fixes', 'codex/harvey-existing-chat-recovery', 'codex/harvey-xlsx-input']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[live-harvey-qa]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage isolated candidate code, without changing the deployed app
        run: |
          npm install --prefix candidate-input-deps --ignore-scripts --no-audit --no-fund exceljs@4.4.0
          tar czf candidate.tar.gz dist scripts package.json candidate-input-deps
          flyctl ssh sftp put candidate.tar.gz /tmp/harvey-qa-${{ github.run_id }}.tar.gz -a marco-90-automation
          flyctl ssh console -a marco-90-automation -C "sh -c 'mkdir -p /tmp/harvey-qa-${{ github.run_id }} && tar xzf /tmp/harvey-qa-${{ github.run_id }}.tar.gz -C /tmp/harvey-qa-${{ github.run_id }} && ln -s /app/node_modules /tmp/harvey-qa-${{ github.run_id }}/node_modules'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Workbook-to-CRM, idempotent reruns and ten-page browser extraction with outcome review; $0.50 QA budget
        run: flyctl ssh console -a marco-90-automation -C "sh -c 'cd /tmp/harvey-qa-${{ github.run_id }} && NODE_PATH=/tmp/harvey-qa-${{ github.run_id }}/candidate-input-deps/node_modules node scripts/verify-harvey-candidate-live.mjs'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Visual-only record extraction with Mercury and Luna; $0.03 per model
        run: |
          for model in inception/mercury-2.5 '~openai/gpt-luna-latest'; do
            flyctl ssh console -a marco-90-automation -C "sh -c 'cd /tmp/harvey-qa-${{ github.run_id }} && NODE_PATH=/tmp/harvey-qa-${{ github.run_id }}/candidate-input-deps/node_modules HARVEY_HARNESS_SMOKE_MODEL=$model node scripts/smoke-harvey-harness-live.mjs'"
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
