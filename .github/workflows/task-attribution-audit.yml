name: Task attribution diagnostic
on:
  push:
    branches: [codex/task-creator-attribution]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read reported task attribution and worker identity only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a marco-90-automation -C "node -e \"eval(Buffer.from('','base64').toString())\""