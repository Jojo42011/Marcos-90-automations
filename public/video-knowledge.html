<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video knowledge review</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18281f;background:#f5f7f5}body{max-width:1060px;margin:auto;padding:24px}h1{margin-bottom:6px}p{line-height:1.55}.muted{color:#536358}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit;border:1px solid #b6c4ba;border-radius:6px;padding:10px}button{background:#234c36;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,textarea{background:white;color:#18281f;max-width:100%;box-sizing:border-box}input[type=url]{flex:1;min-width:220px}article{background:white;border:1px solid #d8e1db;border-radius:10px;margin:18px 0;padding:20px}article[data-state=needs_confirmation]{border:2px solid #986519}.badge{font-weight:650;color:#705013}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto;font:14px/1.5 system-ui}label{display:block;margin:12px 0}label input[type=checkbox]{margin-right:8px}.conflict{background:#fff7e8;border:1px solid #e4c68f;padding:16px;margin:12px 0;border-radius:6px}.conflict select,.conflict textarea{width:100%;margin-top:10px}details{margin:14px 0}summary{cursor:pointer;font-weight:600}a{color:#24503b}#status{min-height:24px}#error{color:#a12727}#preview{width:100%}.facts small{display:block;margin-left:25px;color:#536358}.keywords{width:100%}@media(max-width:600px){body{padding:14px}article{padding:14px}.bar>*{max-width:100%}}button:focus-visible,a:focus-visible{outline:3px solid #b98a2f;outline-offset:3px}
</style></head><body>
<a href="/">← Dashboard</a><h1>Video knowledge</h1><p class="muted">Videos are approved automatically only when every extracted detail agrees across the caption and transcript. Missing information, disagreements, and extraction problems stay here for review.</p>
<p id="status" aria-live="polite">Loading…</p><p id="error" role="alert"></p>
<div class="bar"><button id="refresh">Refresh</button><button id="sync">Check for new videos</button><button id="prev">Previous</button><button id="next">Next</button><span id="page"></span></div>
<form id="importForm" class="bar" style="margin-top:16px"><input type="url" id="importUrl" aria-label="TikTok video link" placeholder="Paste an older TikTok video link" required><button>Import link</button></form>
<section id="items" aria-label="Video review queue"></section>
<article><h2>Try a reply without sending it</h2><form id="previewForm"><label for="preview">Message or video link</label><input id="preview" maxlength="2000" placeholder="JOHNSON location?" required><button style="margin-top:12px">Preview reply</button></form><p id="previewResult" aria-live="polite"></p></article>
<script>
'use strict';let offset=0;let enabled=false;
const $=id=>document.getElementById(id);
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
async function api(body){const r=await fetch('/api/video-knowledge'+(!body?'?offset='+offset:''),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||d.detail||'Request failed');return d;}
function showError(e){$('error').textContent=e.message||String(e);}
function source(title,text){const d=el('details'),s=el('summary',title);d.append(s,el('pre',text||'No transcript yet.'));return d;}
async function load(){try{const d=await api();enabled=d.enabled;$('error').textContent='';const counts=d.summary||{};
 $('status').textContent=(d.enabled?'Video processing is on.':'Video processing is off.')+' '+(d.repliesEnabled?'Approved facts may be used in live replies.':'Live video replies are off.')+' Needs confirmation: '+(counts.needs_confirmation||0)+' · Needs review: '+(counts.needs_review||0)+' · Failed: '+(counts.failed||0);
 $('sync').disabled=!enabled;$('importForm').querySelector('button').disabled=!enabled;$('previewForm').querySelector('button').disabled=!enabled;$('prev').disabled=offset===0;$('next').disabled=d.items.length<50;$('page').textContent='Videos '+(offset+1)+'–'+(offset+d.items.length);
 $('items').replaceChildren();for(const v of d.items)render(v);if(!d.items.length)$('items').append(el('p','No videos on this page. New videos will appear after processing is enabled and discovery runs.'));
 }catch(e){showError(e);$('status').textContent='Sign in with review access to load this library.';}}
function render(v){const card=el('article');card.dataset.state=v.state;const title=el('a','Open source video · '+v.published.slice(0,10));title.href=v.url;title.target='_blank';title.rel='noopener noreferrer';card.append(title,el('h2',v.state.replaceAll('_',' ')));if(v.error)card.append(el('p',v.error));card.append(source('Caption',v.caption),source('Transcript',v.transcript));
 const approval=JSON.parse(v.approval||'{}');card.append(el('p',approval.mode==='automatic'?'Automatically approved — both sources support every extracted detail.':approval.mode==='manual'?'Approved by a reviewer.':'Awaiting review or processing.'));if(approval.mode==='review_required'){const reasons=el('ul');for(const reason of approval.reasons||[])reasons.append(el('li',reason));card.append(reasons);}
 const notes=JSON.parse(v.notes),conflicts=JSON.parse(v.conflicts||'[]'),form=el('form');const factBox=el('div');factBox.className='facts';const checks=[];
 for(const fact of notes.facts||[]){const label=el('label'),checkbox=el('input');checkbox.type='checkbox';checkbox.checked=true;label.append(checkbox,document.createTextNode(fact.field+': '+fact.value),el('small',fact.source+': “'+fact.quote+'”'));factBox.append(label);checks.push({checkbox,fact});}form.append(factBox);if(notes.evidence?.length){const evidence=el('details');evidence.append(el('summary','Extracted evidence from both sources'));for(const fact of notes.evidence)evidence.append(el('p',fact.field+' · '+fact.source+': '+fact.value+' — “'+fact.quote+'”'));form.append(evidence);}
 const kwLabel=el('label','Matching keywords (comma separated)'),kw=el('input');kw.className='keywords';kw.value=(notes.keywords||[]).join(', ');kwLabel.append(kw);form.append(kwLabel);
 const answers=[];for(const conflict of conflicts){const box=el('div');box.className='conflict';box.append(el('strong',conflict.question));conflict.candidates.forEach((f,i)=>box.append(el('p',(i+1)+'. '+f.source+': '+f.value+' — “'+f.quote+'”')));
 const select=el('select');select.required=true;select.setAttribute('aria-label','Resolve '+conflict.field);select.append(new Option('Choose after checking the source…',''));conflict.candidates.forEach((f,i)=>select.append(new Option(f.source+': '+f.value,String(i))));select.append(new Option('Leave this detail out','omit'));
 const reason=el('textarea');reason.required=true;reason.minLength=3;reason.maxLength=500;reason.placeholder='What did you verify?';reason.setAttribute('aria-label','Reason for '+conflict.field);box.append(select,reason);form.append(box);answers.push({conflict,select,reason});}
 const warnings=JSON.parse(v.warnings||'[]');const ack=el('input');ack.type='checkbox';if(warnings.length){const box=el('div');box.className='conflict';box.append(el('strong','Some proposed claims could not be verified and were left out.'));warnings.forEach(w=>box.append(el('p',w)));const label=el('label');ack.required=true;label.append(ack,document.createTextNode(' I checked these omissions against the sources.'));box.append(label);form.append(box);}
 const approve=el('button','Approve selected facts');approve.disabled=!enabled||!['needs_review','needs_confirmation','ready'].includes(v.state);form.append(approve);
 form.onsubmit=async event=>{event.preventDefault();approve.disabled=true;try{await api({action:'approve',post:v.post,revision:v.revision,notes:{facts:checks.filter(c=>c.checkbox.checked).map(c=>c.fact),keywords:kw.value.split(',').map(s=>s.trim()).filter(Boolean)},acknowledgeWarnings:ack.checked,resolutions:answers.map(a=>({field:a.conflict.field,candidate:a.select.value==='omit'?null:Number(a.select.value),reason:a.reason.value}))});await load();}catch(e){showError(e);approve.disabled=false;}};
 card.append(form);const actions=el('div');actions.className='bar';actions.style.marginTop='12px';for(const action of ['retry','disable']){const button=el('button',action==='retry'?'Retry processing':'Disable this video');button.disabled=!enabled;button.onclick=async()=>{button.disabled=true;try{await api({action,post:v.post,revision:v.revision});await load();}catch(e){showError(e);button.disabled=false;}};actions.append(button);}card.append(actions);$('items').append(card);}
$('refresh').onclick=load;$('prev').onclick=()=>{offset=Math.max(0,offset-50);load();};$('next').onclick=()=>{offset+=50;load();};
$('sync').onclick=async()=>{try{$('sync').disabled=true;await api({action:'sync'});await load();}catch(e){showError(e);$('sync').disabled=!enabled;}};
$('importForm').onsubmit=async e=>{e.preventDefault();try{await api({action:'import',url:$('importUrl').value});$('importUrl').value='';offset=0;await load();}catch(e){showError(e);}};
$('previewForm').onsubmit=async e=>{e.preventDefault();try{const d=await api({action:'preview',message:$('preview').value});$('previewResult').textContent=(d.reply||'No video matched; the existing DM flow would handle this.')+' (Preview only. Nothing sent.)';}catch(e){showError(e);}};
// Preserve unsaved review decisions; background updates only show queue counts.
setInterval(async()=>{if(document.hidden)return;try{const d=await api();const n=(d.summary?.needs_confirmation||0)+(d.summary?.needs_review||0);document.title=(n?'('+n+') ':'')+'Video knowledge review';}catch{}},60000);load();
</script></body></html>
