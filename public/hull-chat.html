<!-- ============================================================================
     hull-chat - a clean, self-contained chat UI (the JARVIS/ChatGPT feel).
     No build step, no dependencies. Everything you touch is the CONFIG block
     right below. The engine underneath it you can leave alone.

     Two agents ship configured here: Harvey (default) and Arlo. The page picks
     one from ?agent=harvey | ?agent=arlo (defaults to harvey). To point Arlo at
     a real backend, set AGENTS.arlo.send() to hit your endpoint.
     ============================================================================ -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chat</title>

<script>
/* ========================= CONFIG ==========================================
   One object per agent. `send()` is the ONLY thing that must talk to a server;
   everything else is cosmetic. Return { text, note? } or throw for an inline
   error. You get { message, sessionId, history } for free.
   =========================================================================== */

function dashToken(){
  try { return new URLSearchParams(location.search).get("token") || localStorage.getItem("dashboardToken") || ""; }
  catch(_) { return ""; }
}
function withToken(path){
  const t = dashToken(); if(!t) return path;
  return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(t);
}

const AGENTS = {
  harvey: {
    brand: "Harvey",
    tagline: "AI Assistant",
    accent: "#00d4ff",
    column: "720px",
    emptyTitle: "How can I help, Marco?",
    emptySub: "I have full view of your whole system - leads, finance, DMs, content, tasks, and everything I've learned. Ask me anything.",
    placeholder: "Message Harvey…",
    chips: [
      "How many hot leads do I have?",
      "What's my pace to $20M?",
      "Summarize today's DMs",
      "Which of my videos are performing best?",
    ],
    navLinks: [],            // e.g. [{ label:"Full console", href:"/jarvis" }]
    footnote: "Harvey can make mistakes. Double-check anything important.",
    async send({ message, sessionId }) {
      const res = await fetch(withToken("/api/jarvis/chat"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // full:true → Harvey always runs the smartest path with every tool, so
        // he has full live knowledge of the system on every message.
        body: JSON.stringify({ message, sessionId, full: true }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
      return { text: data.speech || data.reply || data.text || data.message || "(no response)", note: "" };
    },
  },

  arlo: {
    brand: "Arlo",
    tagline: "Operator",
    accent: "#8b7dff",
    column: "720px",
    emptyTitle: "What do you need, boss?",
    emptySub: "Arlo runs the ops. Ask a question or hand off a task.",
    placeholder: "Message Arlo…",
    chips: [
      "What's on my plate today?",
      "Status of the open tasks",
      "Kick off the morning scan",
    ],
    navLinks: [],
    footnote: "Arlo can make mistakes. Double-check anything important.",
    // TODO: point this at Arlo's backend. Mirrors the Harvey shape.
    async send({ message, sessionId }) {
      const res = await fetch(withToken("/api/arlo/chat"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, sessionId }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ("Arlo isn't wired up yet (" + res.status + ")"));
      return { text: data.speech || data.reply || data.text || data.message || "(no response)", note: "" };
    },
  },
};

// Optional upload sheet (the ＋ button + slide-up paste/drop panel). Off by default.
const UPLOAD = {
  enabled: false,
  async submit({ title, text }) {
    // implement to accept a pasted script / dropped file
    console.log("upload", title, text);
  },
};

// Which agent this page is. ?agent=arlo → Arlo, otherwise Harvey.
const AGENT_KEY = (new URLSearchParams(location.search).get("agent") || "harvey").toLowerCase();
const CONFIG = AGENTS[AGENT_KEY] || AGENTS.harvey;
</script>

<script>
/* ============================= ENGINE ======================================
   You shouldn't need to edit below this line.
   =========================================================================== */
(function(){
  "use strict";
  const C = CONFIG;
  document.documentElement.style.setProperty("--accent", C.accent || "#00d4ff");
  document.documentElement.style.setProperty("--column", C.column || "720px");
  document.title = "Chat · " + (C.brand || "Assistant");

  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), main = $("main"), input = $("input"), sendBtn = $("sendBtn");
  $("hBrand").textContent = C.brand || "Assistant";
  $("hTag").textContent = C.tagline || "";
  input.placeholder = C.placeholder || "Message…";
  $("footNote").textContent = C.footnote || "";
  if (Array.isArray(C.navLinks) && C.navLinks.length){
    $("hNav").innerHTML = C.navLinks.map(l => '<a class="hbtn" href="'+esc(l.href)+'" target="_top">'+esc(l.label)+'</a>').join(" ");
  }
  if (UPLOAD.enabled) $("plusBtn").style.display = "";

  // session + history
  const SKEY = "hullchat_sid_" + (AGENT_KEY);
  let sessionId = sessionStorage.getItem(SKEY);
  if (!sessionId){ sessionId = "s_" + Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem(SKEY, sessionId); }
  let history = [];
  let busy = false;

  /* ---------- markdown (HTML-escaped first → XSS-safe) ----------
     This used to handle bullets, bold and code fences only. Harvey's replies are
     full of `###` headings and `|` tables, so a structured answer rendered as a
     wall of raw punctuation — the same "codey" problem the Jobs page had. Escape
     everything first, then re-introduce a known set of tags. */
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function mdInline(t){
    return esc(t)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g,'$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function isTableSep(l){ return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && l.indexOf("-") >= 0; }
  function splitRow(l){
    return l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c => c.trim());
  }
  function renderMarkdown(src){
    const lines = String(src == null ? "" : src).replace(/\r\n/g,"\n").split("\n");
    let html = "", i = 0, listOpen = null;
    const closeList = () => { if (listOpen){ html += "</" + listOpen + ">"; listOpen = null; } };

    while (i < lines.length){
      const l = lines[i];

      if (/^\s*```/.test(l)){
        closeList(); i++;
        const buf = [];
        while (i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++;
        html += "<pre><code>" + esc(buf.join("\n")) + "</code></pre>";
        continue;
      }
      if (!l.trim()){ closeList(); i++; continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ closeList(); html += '<hr class="mdhr">'; i++; continue; }

      const h = /^(#{1,6})\s+(.*)$/.exec(l);
      if (h){ closeList(); html += '<div class="mdh mdh' + Math.min(h[1].length,4) + '">' + mdInline(h[2]) + "</div>"; i++; continue; }

      if (l.indexOf("|") >= 0 && i + 1 < lines.length && isTableSep(lines[i+1])){
        closeList();
        const head = splitRow(l); i += 2;
        const rows = [];
        while (i < lines.length && lines[i].indexOf("|") >= 0 && lines[i].trim()){ rows.push(splitRow(lines[i])); i++; }
        html += '<div class="mdtwrap"><table class="mdt"><thead><tr>' +
          head.map(c => "<th>" + mdInline(c) + "</th>").join("") + "</tr></thead><tbody>" +
          rows.map(r => "<tr>" + head.map((_,n) => "<td>" + mdInline(r[n] == null ? "" : r[n]) + "</td>").join("") + "</tr>").join("") +
          "</tbody></table></div>";
        continue;
      }

      const li = /^\s*[-*+]\s+(.*)$/.exec(l);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(l);
      if (li || ol){
        const want = li ? "ul" : "ol";
        if (listOpen !== want){ closeList(); listOpen = want; html += "<" + want + ">"; }
        html += "<li>" + mdInline((li || ol)[1]) + "</li>"; i++; continue;
      }
      if (/^\s*>\s?/.test(l)){ closeList(); html += '<blockquote class="mdq">' + mdInline(l.replace(/^\s*>\s?/,"")) + "</blockquote>"; i++; continue; }

      closeList();
      const para = [l]; i++;
      while (i < lines.length && lines[i].trim()
             && !/^\s*(#|[-*+]\s|\d+[.)]\s|>|```|\|)/.test(lines[i])
             && !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
      html += "<p>" + mdInline(para.join(" ")) + "</p>";
    }
    closeList();
    return html;
  }

  /* ---------- message rendering ---------- */
  function scrollDown(){ main.scrollTop = main.scrollHeight; }
  function addUser(text){
    const el = document.createElement("div"); el.className = "msg user";
    el.innerHTML = '<div class="bubble"></div>';
    el.querySelector(".bubble").textContent = text;
    thread.appendChild(el); scrollDown();
  }
  function addAI(){
    const el = document.createElement("div"); el.className = "msg ai";
    el.innerHTML = '<div class="av"></div><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    thread.appendChild(el); scrollDown();
    return el.querySelector(".bubble");
  }

  // typewriter reveal, capped so long replies aren't slow (~1.5s total)
  function typeInto(bubble, text, note){
    return new Promise(resolve => {
      const total = 1500, minStep = 8;
      const chars = text.length;
      const step = Math.max(1, Math.ceil(chars / (total / minStep)));
      let i = 0;
      bubble.innerHTML = "";
      const span = document.createElement("span"); bubble.appendChild(span);
      const caret = document.createElement("span"); caret.className = "caret"; bubble.appendChild(caret);
      const tick = () => {
        i = Math.min(chars, i + step);
        span.innerHTML = renderMarkdown(text.slice(0, i));
        scrollDown();
        if (i < chars){ setTimeout(tick, minStep); }
        else {
          caret.remove();
          span.innerHTML = renderMarkdown(text);
          if (note){ const n = document.createElement("div"); n.className = "note"; n.textContent = note; bubble.appendChild(n); }
          scrollDown(); resolve();
        }
      };
      tick();
    });
  }

  /* ---------- empty state ---------- */
  function showEmpty(){
    thread.innerHTML =
      '<div class="empty"><div class="av-lg"></div>' +
      '<h1>' + esc(C.emptyTitle || "How can I help?") + '</h1>' +
      '<p>' + esc(C.emptySub || "") + '</p>' +
      '<div class="chips">' + (C.chips||[]).map(c => '<button class="chip">'+esc(c)+'</button>').join("") + '</div></div>';
    thread.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => { send(ch.textContent); }));
  }

  /* ---------- reel-link analysis (Harvey only) ----------
     If the message contains an Instagram/TikTok/YouTube-Shorts link, Harvey
     downloads and watches the reel, then reports back. This mirrors the main
     Harvey command bar, but text-only (no TTS) since this is a chat surface. */
  const REEL_URL_RE = /(https?:\/\/[^\s]*(?:instagram\.com|tiktok\.com|youtube\.com\/shorts|youtu\.be)[^\s]*)/i;

  async function analyzeReel(bubble, url, note){
    // instant acknowledgement so it never feels like nothing happened
    await typeInto(bubble, "Got it, pulling that reel up and analyzing it now. This takes a bit, I'm watching the whole thing…");
    const working = addAI();
    try {
      const res = await fetch(withToken("/api/jarvis/analyze-reel"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, note: note || "" }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.jobId) throw new Error(data.error || ("Couldn't start the analysis (" + res.status + ")"));

      let analysis = "";
      for (let i = 0; i < 120; i++){
        await new Promise(r => setTimeout(r, 3000));
        const pr = await fetch(withToken("/api/jarvis/analyze-reel/" + encodeURIComponent(data.jobId)));
        const pd = await pr.json().catch(() => ({}));
        if (pd.status === "complete"){ analysis = pd.analysis || pd.spoken || "(no analysis returned)"; break; }
        if (pd.status === "failed"){ throw new Error(pd.error || "The analysis failed while processing the reel."); }
      }
      if (!analysis) throw new Error("That reel took too long to analyze. Try again in a moment.");
      await typeInto(working, analysis);
      history.push({ role:"assistant", content: analysis });
    } catch (e) {
      working.innerHTML = '<span class="err">⚠ ' + esc(e.message || "Couldn't analyze that reel.") + '</span>';
    }
  }

  /* ---------- background jobs ----------
     Harvey escalates long work to a background job and replies with an id. Until
     now that was the end of it: the chat had no idea the job existed, so a job
     that finished in 100 seconds looked identical to one that had hung — the
     operator sat watching a static reply for ten minutes and reasonably concluded
     it was stuck. Self-escalation without a handoff back is not delegation, it is
     a dropped thread. The chat now watches any job Harvey starts and reports the
     outcome in the conversation, the way a person would. */
  const JOB_ID_RE = /\bjob_[a-z0-9]{6,}_[a-z0-9]{4,}\b/i;
  const watching = new Set();

  function jobCard(){
    const el = document.createElement("div");
    el.className = "msg ai";
    el.innerHTML = '<div class="av"></div><div class="bubble jobcard"></div>';
    thread.appendChild(el); scrollDown();
    return el.querySelector(".bubble");
  }
  function fileRow(path){
    const dl = withToken("/api/harvey/workspace/download?path=" + encodeURIComponent(path));
    const name = path.split("/").pop();
    return '<div class="jfile"><span class="jfn">' + esc(name) + '</span>' +
      '<a class="jdl" href="' + dl + '" download>Download</a>' +
      '<a class="jdl" href="' + dl + '&inline=1" target="_blank" rel="noopener">Open</a></div>';
  }
  function filesFromJob(job){
    const seen = [];
    for (const st of (job.steps || [])){
      if (st.kind !== "tool") continue;
      const list = Array.isArray(st.files) && st.files.length ? st.files
        : st.file ? [st.file]
        : (String(st.output || "").match(/"path"\s*:\s*"([^"]+)"/) || [])[1] ? [(String(st.output).match(/"path"\s*:\s*"([^"]+)"/))[1]] : [];
      for (const f of list) if (f && seen.indexOf(f) < 0 && !/\/(script\.(js|py)|guard\.cjs|sitecustomize\.py|output\.txt)$/.test(f)) seen.push(f);
    }
    return seen;
  }

  /**
   * Poll a job until it stops, updating one card in place.
   *
   * Deliberately open-ended (up to ~20 min) rather than a short timeout: giving
   * up early and leaving a "still working" card is the exact failure this fixes.
   * If it does run out, it says so and points at /jobs rather than going quiet.
   */
  async function watchJob(id){
    if (watching.has(id)) return;
    watching.add(id);
    const card = jobCard();
    const label = t => '<span class="jspin"></span><b>Working on it</b> · ' + esc(t);
    card.innerHTML = label("starting…");
    for (let i = 0; i < 400; i++){
      await new Promise(r => setTimeout(r, 3000));
      let job = null;
      try {
        const res = await fetch(withToken("/api/harvey/jobs/" + encodeURIComponent(id)));
        const data = await res.json().catch(() => ({}));
        job = data.job || data;
      } catch (_) { continue; }              // a blip should not kill the watch
      if (!job || !job.status) continue;

      if (job.status === "running" || job.status === "queued"){
        const steps = (job.steps || []).length;
        const last = (job.steps || []).slice().reverse().find(s => s.kind === "tool");
        card.innerHTML = label((last ? prettyTool(last.tool) : "getting started") + " · step " + steps);
        scrollDown();
        continue;
      }

      const files = filesFromJob(job);
      if (job.status === "done"){
        card.innerHTML = '<div class="jdone">✓ Done' +
          ((job.steps || []).length ? ' · ' + job.toolCalls + ' tool call' + (job.toolCalls === 1 ? "" : "s") : "") + '</div>' +
          renderMarkdown(job.result || "(finished with no report)") +
          (files.length ? '<div class="jfiles">' + files.map(fileRow).join("") + '</div>' : "");
        history.push({ role:"assistant", content: job.result || "(job finished)" });
      } else {
        card.innerHTML = '<div class="jbad">' +
          (job.status === "cancelled" ? "Stopped" : job.status === "interrupted" ? "Interrupted" : "Didn’t finish") +
          '</div><span class="err">' + esc(job.error || "No reason recorded.") + '</span>' +
          (files.length ? '<div class="jfiles">' + files.map(fileRow).join("") + '</div>' : "");
      }
      scrollDown();
      watching.delete(id);
      return;
    }
    card.innerHTML = '<span class="err">This job has been running over 20 minutes — I have stopped watching it here. ' +
      'It may still be going: check <a href="/jobs" target="_blank" rel="noopener">Jobs</a>.</span>';
    watching.delete(id);
  }

  var TOOL_LABELS = {
    search_tracker:"searching the tracker", get_tracker_summary:"reading the tracker",
    get_tracker_record:"reading a record", get_tracker_pipelines:"checking the pipelines",
    get_lead:"reading a lead", write_file:"writing the file", edit_file:"editing the file",
    read_file:"reading a file", list_files:"looking through files",
    get_social_analytics:"pulling social analytics", get_task_board:"reading the task board",
    create_task:"creating a task", gmail_send:"sending an email", send_sms:"sending a text",
    run_script:"running a script to compute it", get_command_settings:"checking settings"
  };
  function prettyTool(t){ return t ? (TOOL_LABELS[t] || String(t).replace(/_/g," ")) : "working"; }

  /* ---------- send flow ---------- */
  async function send(text){
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    const empty = thread.querySelector(".empty"); if (empty) thread.innerHTML = "";
    addUser(text);
    history.push({ role:"user", content:text });
    input.value = ""; autosize();
    const bubble = addAI();
    try {
      const reelMatch = (AGENT_KEY === "harvey") ? text.match(REEL_URL_RE) : null;
      if (reelMatch){
        await analyzeReel(bubble, reelMatch[1], text.replace(REEL_URL_RE, "").trim());
      } else {
        const out = await C.send({ message:text, sessionId, history });
        const reply = (out && out.text) || "(no response)";
        await typeInto(bubble, reply, out && out.note);
        history.push({ role:"assistant", content:reply });
        /* If he handed the work to a background job, follow it through to the
           end instead of leaving the operator to guess. */
        const jm = reply.match(JOB_ID_RE);
        if (jm) watchJob(jm[0]);
      }
    } catch (e) {
      bubble.innerHTML = '<span class="err">⚠ ' + esc(e.message || "Something went wrong.") + '</span>';
    } finally {
      busy = false; sendBtn.disabled = input.value.trim() === ""; input.focus();
    }
  }

  /* ---------- composer behaviour ---------- */
  function autosize(){ input.style.height = "auto"; input.style.height = Math.min(180, input.scrollHeight) + "px"; }
  input.addEventListener("input", () => { autosize(); sendBtn.disabled = input.value.trim() === "" || busy; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
  });
  sendBtn.addEventListener("click", () => send(input.value));
  $("newChat").addEventListener("click", () => {
    history = [];
    sessionId = "s_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    sessionStorage.setItem(SKEY, sessionId);
    showEmpty(); input.focus();
  });

  /* ---------- optional upload sheet ---------- */
  if (UPLOAD.enabled){
    const scrim = $("scrim"), sheet = $("sheet");
    const open = () => { scrim.classList.add("on"); sheet.classList.add("on"); };
    const close = () => { scrim.classList.remove("on"); sheet.classList.remove("on"); };
    $("plusBtn").addEventListener("click", open);
    scrim.addEventListener("click", close);
    $("upCancel").addEventListener("click", close);
    $("upSend").addEventListener("click", async () => {
      try { await UPLOAD.submit({ title: $("upTitle").value.trim(), text: $("upText").value.trim() }); } catch(_){}
      $("upTitle").value = ""; $("upText").value = ""; close();
    });
    const drop = $("drop");
    ["dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); }));
    document.addEventListener("drop", e => {
      e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return;
      open(); const r = new FileReader(); r.onload = () => { $("upText").value = r.result; if(!$("upTitle").value) $("upTitle").value = f.name; }; r.readAsText(f);
    });
  }

  showEmpty();
  input.focus();
})();
</script>
