name: Fly maintenance

# Manually-triggered diagnostics/repair for the Fly app. Exists because the
# deploy pipeline reported success while production kept serving an old
# image — this surfaces machine/release state without needing local flyctl.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: "status"
        type: choice
        options:
          - status            # fly status + machines + releases (read-only)
          - restart           # restart all machines (picks up current release image)
          - destroy-stale     # destroy machines NOT on the latest release image, then status
  # Fallback trigger for tokens that cannot dispatch workflows: push a branch
  # named fly-maint/status, fly-maint/restart, or fly-maint/destroy-stale.
  push:
    branches:
      - "fly-maint/**"
jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      # From dispatch input, or from the fly-maint/<action> branch name.
      MAINT_ACTION: ${{ inputs.action || github.ref_name }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Status (always)
        run: |
          flyctl status -a marco-90-automation
          echo "===== machines ====="
          flyctl machines list -a marco-90-automation
          echo "===== machines (json: id/state/region/image) ====="
          flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id'], m['state'], m['region'], m.get('config',{}).get('image','?')) for m in json.load(sys.stdin)]"
          echo "===== machine event history ====="
          for id in $(flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]"); do
            flyctl machine status "$id" -a marco-90-automation || true
          done
          echo "===== releases ====="
          flyctl releases -a marco-90-automation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Force every machine onto the image of the LATEST release. Fixes the
      # "release complete but machine still runs the old image" failure mode.
      - name: Sync machines to latest release image
        if: ${{ contains(env.MAINT_ACTION, 'sync-image') }}
        run: |
          IMAGE=$(flyctl releases -a marco-90-automation --json | python3 -c "
          import json, sys
          rels = json.load(sys.stdin)
          for r in rels:
              ref = r.get('ImageRef') or r.get('image_ref') or ''
              if ref:
                  print(ref)
                  break
          ")
          if [ -z "$IMAGE" ]; then echo "Could not resolve latest release image"; exit 1; fi
          echo "Target image: $IMAGE"
          for id in $(flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]"); do
            echo "Updating $id → $IMAGE"
            flyctl machine update "$id" -a marco-90-automation --image "$IMAGE" --yes
          done
          echo "===== post-sync verification ====="
          flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id'], m['state'], m.get('config',{}).get('image','?')) for m in json.load(sys.stdin)]"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Update to the latest release image WITHOUT health-wait, then capture the
      # machine's boot logs while it tries (and possibly fails) to come up.
      # Exists because flyd reverts the new image on boot failure and hides the
      # crash — this catches the actual error in the act.
      - name: Boot debug
        if: ${{ contains(env.MAINT_ACTION, 'boot-debug') }}
        run: |
          IMAGE=$(flyctl releases -a marco-90-automation --json | python3 -c "
          import json, sys
          rels = json.load(sys.stdin)
          for r in rels:
              ref = r.get('ImageRef') or r.get('image_ref') or ''
              if ref:
                  print(ref)
                  break
          ")
          echo "Target image: $IMAGE"
          MID=$(flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          echo "Machine: $MID"
          # Fire the update without blocking on health, then tail logs during boot.
          flyctl machine update "$MID" -a marco-90-automation --image "$IMAGE" --yes --skip-health-checks || true
          echo "===== capturing logs for 150s ====="
          timeout 150 flyctl logs -a marco-90-automation --no-tail=false 2>&1 | head -300 || true
          echo "===== post-attempt machine state ====="
          flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id'], m['state'], m.get('config',{}).get('image','?')) for m in json.load(sys.stdin)]"
          flyctl machine status "$MID" -a marco-90-automation || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # EMERGENCY: force every machine onto the last-known-good image (v240,
      # under the 8GB unpack limit) and start it. Used after the oversized
      # image left the app with no startable machine.
      - name: Rescue to last-good image
        if: ${{ contains(env.MAINT_ACTION, 'rescue') }}
        run: |
          GOOD="registry.fly.io/marco-90-automation:deployment-01KX7GG6JFS96ZBST8PR8SKFZN"
          for id in $(flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]"); do
            echo "Rescuing $id → $GOOD"
            flyctl machine update "$id" -a marco-90-automation --image "$GOOD" --yes --skip-health-checks || true
            flyctl machine start "$id" -a marco-90-automation || true
          done
          sleep 20
          echo "===== post-rescue state ====="
          flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id'], m['state'], m.get('config',{}).get('image','?')) for m in json.load(sys.stdin)]"
          curl -sS -o /dev/null -w "health: HTTP %{http_code}\n" --max-time 20 https://marco-90-automation.fly.dev/health || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Restart machines
        if: ${{ contains(env.MAINT_ACTION, 'restart') }}
        run: |
          for id in $(flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id']) for m in json.load(sys.stdin)]"); do
            echo "Restarting $id"
            flyctl machine restart "$id" -a marco-90-automation
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Destroy stale machines
        if: ${{ contains(env.MAINT_ACTION, 'destroy-stale') }}
        run: |
          python3 - <<'EOF' > /tmp/stale.txt
          import json, subprocess
          ms = json.loads(subprocess.check_output(
              ["flyctl", "machines", "list", "-a", "marco-90-automation", "--json"]))
          images = {}
          for m in ms:
              images.setdefault(m.get("config", {}).get("image", "?"), []).append(m["id"])
          if len(images) <= 1:
              print("")  # all machines on one image — nothing stale
          else:
              # newest deployment tag sorts last; keep those, mark the rest stale
              latest = sorted(images.keys())[-1]
              stale = [i for img, ids in images.items() if img != latest for i in ids]
              print(" ".join(stale))
          EOF
          STALE=$(cat /tmp/stale.txt)
          if [ -z "$STALE" ]; then echo "No stale machines."; exit 0; fi
          for id in $STALE; do
            echo "Destroying stale machine $id"
            flyctl machine destroy "$id" -a marco-90-automation --force
          done
          flyctl status -a marco-90-automation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
