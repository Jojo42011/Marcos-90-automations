<!DOCTYPE html>
<html lang="en">
<head>
<script src="/account-session.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DM Agent · Marco 90</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #0d1219;
      --surface-2: #0f1621;
      --border: rgba(0,212,255,0.18);
      --border-2: rgba(255,255,255,0.06);
      --text: #f1f5f9;
      --muted: #8b9cb3;
      --accent: #00d4ff;
      --accent-2: #38bdf8;
      --user: rgba(0,212,255,0.14);
      --bot: rgba(255,255,255,0.05);
      --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
      --font: "Plus Jakarta Sans", system-ui, Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
      padding: 0.7rem 1rem; border-bottom: 1px solid var(--border);
      background: var(--surface); display: flex; align-items: center; gap: 0.7rem;
      flex: 0 0 auto;
    }
    .dm-mark { width: 20px; height: 20px; border-radius: 6px; flex: 0 0 auto;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .dm-title-wrap { display: flex; flex-direction: column; line-height: 1.15; }
    .dm-title-wrap h1 { margin: 0; font-size: 0.95rem; font-weight: 700; }
    .dm-title-wrap small { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.04em; }
    .dm-live { margin-left: auto; display: flex; align-items: center; gap: 0.4rem;
      font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
    .dm-live i { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; }

    /* ── Overview stat cards (Reporting-style) ── */
    .dm-stats { flex: 0 0 auto; display: grid; gap: 0.6rem; padding: 0.75rem 1rem;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      border-bottom: 1px solid var(--border-2); background: rgba(255,255,255,0.015); }
    .dm-stat { border: 1px solid var(--border-2); background: var(--surface-2);
      border-radius: 6px; padding: 0.6rem 0.75rem; min-width: 0; }
    .dm-stat .lbl { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.35rem; }
    .dm-stat .num { font-size: 1.45rem; font-weight: 800; line-height: 1.1; color: #fff; }
    .dm-stat .sub { font-size: 0.66rem; color: var(--muted); margin-top: 0.25rem; line-height: 1.5; }
    .dm-stat .sub b { color: var(--accent); font-weight: 600; }
    .dm-stat.warn { border-color: rgba(245,158,11,0.4); }
    .dm-stat.warn .num { color: #f59e0b; }
    @media (max-width: 900px) { .dm-stats { grid-template-columns: repeat(2, 1fr); } }

    .dm-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* ── Conversations list (CRM Messages-style, list section only) ── */
    .dm-list { flex: 1; display: flex; flex-direction: column; min-height: 0;
      width: 100%; margin: 0; background: var(--surface); }
    .dm-list-head { padding: 14px 18px 10px; display: flex; align-items: center; gap: 0.6rem;
      border-bottom: 1px solid var(--border-2); }
    .dm-list-head .t { font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .dm-list-head .t #dm-count { color: var(--accent); font-weight: 700; }
    .dm-new { margin-left: auto; background: var(--accent); border: none;
      color: #001018; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
      padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer; }
    .dm-new:hover { filter: brightness(1.06); }
    .dm-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px;
      border-bottom: 1px solid var(--border-2); }
    .dm-fchip { border: 1px solid var(--border-2); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 600;
      cursor: pointer; line-height: 1.3; }
    .dm-fchip:hover { border-color: var(--accent); color: var(--text); }
    .dm-fchip.on { background: rgba(0,212,255,0.12); border-color: var(--accent); color: var(--accent); }
    .dm-fchip .n { opacity: 0.75; font-weight: 500; margin-left: 2px; }
    .dm-search-wrap { padding: 12px 18px; border-bottom: 1px solid var(--border-2); }
    .dm-search-wrap input { width: 100%; height: 36px; padding: 0 14px; border: 1px solid var(--border-2);
      border-radius: 18px; background: var(--surface-2); color: var(--text); font-size: 13px; }
    .dm-search-wrap input::placeholder { color: var(--muted); }
    .dm-search-wrap input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .dm-threads { flex: 1; overflow-y: auto; }
    .dm-thread { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px;
      border-bottom: 1px solid var(--border-2); cursor: pointer; transition: background 0.12s; }
    .dm-thread:hover { background: rgba(255,255,255,0.03); }
    .dm-thread.active { background: rgba(0,212,255,0.09); box-shadow: inset 3px 0 0 var(--accent); }
    .dm-av { width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 0.02em;
      background: linear-gradient(135deg, #5b6fae, #7f93c9); border: 2px solid var(--surface); }
    .dm-av.tiktok { background: linear-gradient(135deg, #25f4ee, #fe2c55); }
    .dm-av.instagram { background: linear-gradient(135deg, #f09433, #dc2743 50%, #bc1888); }
    .dm-av.facebook { background: linear-gradient(135deg, #1877f2, #60a5fa); }
    .dm-av.sms, .dm-av.twilio { background: linear-gradient(135deg, #16a34a, #4ade80); }
    .dm-thread-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .dm-thread-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .dm-thread-name { font-weight: 700; font-size: 13.5px; color: var(--text); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .dm-thread-time { font-size: 11.5px; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
    .dm-thread-preview { font-size: 13px; color: var(--muted); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
    .dm-thread-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; }
    .dm-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border-2);
      color: var(--muted); background: rgba(255,255,255,0.03); flex: 0 0 auto; }
    .dm-badge.instagram { color: #c026d3; border-color: rgba(192,38,211,0.35); background: rgba(192,38,211,0.08); }
    .dm-badge.sms, .dm-badge.twilio { color: #16a34a; border-color: rgba(22,163,74,0.35); background: rgba(22,163,74,0.08); }
    .dm-badge.tiktok { color: #0d9488; border-color: rgba(13,148,136,0.35); background: rgba(13,148,136,0.08); }
    .dm-badge.facebook { color: #2563eb; border-color: rgba(37,99,235,0.35); background: rgba(37,99,235,0.08); }
    .dm-state { font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 999px; flex: 0 0 auto;
      background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border-2); }
    .dm-state.flag_for_call { background: rgba(245,158,11,0.14); color: #d97706; border-color: rgba(245,158,11,0.4); }
    .dm-state.phone_requested { background: rgba(59,130,246,0.1); color: #2563eb; border-color: rgba(59,130,246,0.35); }
    .dm-state.criteria_collected,
    .dm-state.property_sent,
    .dm-state.opening_offered_details { background: rgba(0,212,255,0.1); color: var(--accent); border-color: rgba(0,212,255,0.3); }
    .dm-state.closed { background: rgba(74,222,128,0.1); color: #16a34a; border-color: rgba(74,222,128,0.35); }
    .dm-phone { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; color: #16a34a;
      border: 1px solid rgba(22,163,74,0.35); background: rgba(22,163,74,0.08);
      padding: 3px 9px; border-radius: 999px; flex: 0 0 auto; text-decoration: none; }
    .dm-phone:hover { background: rgba(22,163,74,0.16); }
    .dm-phone-none { font-size: 10.5px; color: var(--muted); flex: 0 0 auto;
      padding: 3px 8px; border-radius: 999px; border: 1px dashed var(--border-2); }
    .dm-conv-head .dm-phone { font-size: 0.68rem; }
    .dm-empty { padding: 2.2rem 1.2rem; text-align: center; color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
    .dm-thread-open { color: var(--muted); flex: 0 0 auto; font-size: 18px; line-height: 1;
      align-self: center; opacity: 0.45; transition: opacity 0.12s, color 0.12s; }
    .dm-thread:hover .dm-thread-open { color: var(--accent); opacity: 1; }

    /* ── Conversation popup (modal) ── */
    .dm-modal { position: fixed; inset: 0; z-index: 100; display: none; }
    .dm-modal.open { display: block; }
    .dm-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.62); backdrop-filter: blur(2px); }
    .dm-modal-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: min(680px, 94vw); height: min(80vh, 760px); background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.55); animation: dm-pop 0.16s ease-out; }
    @keyframes dm-pop { from { opacity: 0; transform: translate(-50%,-48%) scale(0.98); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    .dm-conv-head { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-2);
      display: flex; align-items: center; gap: 0.6rem; flex: 0 0 auto; }
    .dm-conv-head .nm { font-weight: 700; font-size: 0.95rem; }
    .dm-conv-head .sub { font-size: 0.66rem; color: var(--muted); font-family: var(--mono); }
    .dm-modal-close { margin-left: auto; background: transparent; border: none; color: var(--muted);
      font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 0.15rem; }
    .dm-modal-close:hover { color: var(--accent); }
    #log { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: 0.55rem; width: 100%; }
    .bubble { max-width: 82%; padding: 0.6rem 0.8rem; border-radius: 12px; line-height: 1.45;
      font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    .bubble .who { display: block; font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.2rem; font-family: var(--mono); }
    .bubble.user { align-self: flex-end; background: var(--user); border: 1px solid var(--border); }
    .bubble.bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border-2); }
    .bubble.bot .who { color: var(--accent); }
    .bubble.error { align-self: stretch; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5; font-size: 0.82rem; }
    .bubble.pending { opacity: 0.6; font-style: italic; }
    footer { padding: 0.7rem 1rem; border-top: 1px solid var(--border-2); background: var(--surface); flex: 0 0 auto; }
    form { display: flex; gap: 0.5rem; }
    form input[type="text"] { flex: 1; padding: 0.6rem 0.75rem; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text); font-size: 0.95rem; }
    form input:focus { outline: none; border-color: var(--accent); }
    form button { padding: 0.6rem 1.1rem; border: none; border-radius: 8px; background: var(--accent);
      color: #001018; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
    form button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { margin: 0.45rem 0 0; font-size: 0.68rem; color: var(--muted); }
    @media (max-width: 720px) { .dm-modal-card { width: 100vw; height: 100vh; border-radius: 0; } }
  </style>
    <style id="brivity-skin">
      /* Brivity theme - white + teal, matching the CRM/shell. */
      :root{
        --bg:#f9fbfb; --surface:#ffffff; --surface-2:#f7f9fa; --border:#edf0f0; --border-2:#edf0f0;
        --text:#333333; --muted:#5f6b78; --accent:#59c4c4;
        --user:rgba(89,196,196,0.12); --bot:#ffffff;
      }
      body{ background:#f9fbfb !important; color:#333 !important; }
      /* KPI stat cards: white surface + dark numbers (they hard-coded #fff) */
      .dm-stat{ background:#ffffff !important; box-shadow:0 1px 3px rgba(16,24,40,.06); }
      .dm-stat .num{ color:#333333 !important; }
      .dm-list{ background:#fff; border-color:#edf0f0; box-shadow:0 1px 3px rgba(16,24,40,.04); }
      .dm-thread:hover{ background:#f7f9fa !important; }
      .dm-thread.active{ background:rgba(89,196,196,0.10) !important; box-shadow:inset 3px 0 0 #59c4c4; }
      .dm-new{ background:#59c4c4 !important; color:#fff !important; }
      .dm-new:hover{ filter:brightness(1.05); }
      .dm-fchip.on{ background:rgba(89,196,196,0.14) !important; border-color:#59c4c4 !important; color:#2a8f8f !important; }
      .dm-fchip:hover{ border-color:#59c4c4; color:#333; }
      .dm-search-wrap input{ background:#f7f9fa; border-color:#edf0f0; }
      .dm-search-wrap input:focus{ background:#fff; border-color:#59c4c4; }
      .dm-av{ border-color:#fff; }
      .dm-badge{ background:#f7f9fa; }
      .dm-badge.tiktok{ color:#0f766e; background:rgba(13,148,136,0.08); }
      .dm-state{ background:#f1f4f6; color:#5b6570; border-color:#e3e8e8; }
      .dm-state.flag_for_call{ background:rgba(245,158,11,0.12); color:#b45309; }
      .dm-state.phone_requested{ background:rgba(59,130,246,0.1); color:#1d4ed8; }
      .dm-phone{ color:#15803d; }
      .dm-phone-none{ color:#9aa6b2; border-color:#e3e8e8; }
      *{ scrollbar-color:rgba(89,196,196,.4) transparent; }
    </style>
</head>
<body>
  <header>
    <span class="dm-mark" aria-hidden="true"></span>
    <div class="dm-title-wrap">
      <h1>DM Agent</h1>
      <small>Instagram &middot; SMS reply console</small>
    </div>
    <span class="dm-live"><i></i> Agent live</span>
  </header>

  <div class="dm-stats" id="dm-stats">
    <div class="dm-stat"><div class="lbl">&#128172; Conversations</div><div class="num" id="st-conv">-</div><div class="sub" id="st-conv-sub"></div></div>
    <div class="dm-stat"><div class="lbl">&#128248; Platforms</div><div class="num" id="st-plat">-</div><div class="sub" id="st-plat-sub"></div></div>
    <div class="dm-stat"><div class="lbl">&#9993; Messages</div><div class="num" id="st-msgs">-</div><div class="sub" id="st-msgs-sub"></div></div>
    <div class="dm-stat"><div class="lbl">&#127381; Today</div><div class="num" id="st-today">-</div><div class="sub" id="st-today-sub"></div></div>
    <div class="dm-stat"><div class="lbl">&#128241; Phone Captures</div><div class="num" id="st-phones">-</div><div class="sub" id="st-phones-sub"></div></div>
    <div class="dm-stat" id="st-marco-card"><div class="lbl">&#9888; Needs Marco</div><div class="num" id="st-marco">-</div><div class="sub" id="st-marco-sub"></div></div>
  </div>

  <div class="dm-body">
    <div class="dm-list">
      <div class="dm-list-head">
        <span class="t">Conversations <span id="dm-count"></span></span>
        <button type="button" class="dm-new" id="dm-new-btn">+ New</button>
      </div>
      <div class="dm-filters" id="dm-filters" role="tablist" aria-label="Filter conversations">
        <button type="button" class="dm-fchip on" data-filter="all">All <span class="n" id="fc-all"></span></button>
        <button type="button" class="dm-fchip" data-filter="needs_call">Needs call <span class="n" id="fc-needs"></span></button>
        <button type="button" class="dm-fchip" data-filter="has_phone">Has phone <span class="n" id="fc-phone"></span></button>
        <button type="button" class="dm-fchip" data-filter="no_phone">No phone <span class="n" id="fc-nophone"></span></button>
      </div>
      <div class="dm-search-wrap">
        <input type="search" id="dm-search" placeholder="Search name or message…" autocomplete="off" />
      </div>
      <div class="dm-threads" id="threads">
        <div class="dm-empty">Loading…</div>
      </div>
    </div>
  </div>

  <!-- Conversation popup - opens when a conversation is clicked -->
  <div class="dm-modal" id="dm-modal" aria-hidden="true">
    <div class="dm-modal-backdrop" id="dm-modal-backdrop"></div>
    <div class="dm-modal-card" role="dialog" aria-modal="true">
      <div class="dm-conv-head">
        <span class="nm" id="conv-name">-</span>
        <span class="sub" id="conv-sub"></span>
        <button type="button" class="dm-modal-close" id="dm-modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="log"></div>
      <footer>
        <form id="f">
          <input type="text" id="msg" placeholder="Type a message as the lead…" autocomplete="off" required />
          <button type="submit" id="send">Send</button>
        </form>
        <p class="hint">Messages are sent as the lead; the DM agent replies automatically.</p>
      </footer>
    </div>
  </div>

  <script>
    function getToken() {
      return new URLSearchParams(location.search).get("token") || localStorage.getItem("dashboardToken") || "";
    }
    function apiUrl(path) {
      const u = new URL(path, location.origin);
      const t = getToken();
      if (t) u.searchParams.set("token", t);
      return u.toString();
    }
    const threadsEl = document.getElementById("threads");
    const logEl = document.getElementById("log");
    const modal = document.getElementById("dm-modal");
    const form = document.getElementById("f");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send");

    function openModal() {
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }
    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      current = null;
      renderThreads();
    }

    // current selected thread: {id?, platform, userId, name}
    let current = null;
    let convCache = [];

    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function timeAgo(iso) {
      if (!iso) return "";
      const d = new Date(iso); if (isNaN(d)) return "";
      const s = Math.floor((Date.now() - d.getTime()) / 1000);
      if (s < 60) return s + "s";
      if (s < 3600) return Math.floor(s / 60) + "m";
      if (s < 86400) return Math.floor(s / 3600) + "h";
      return Math.floor(s / 86400) + "d";
    }
    function platClass(p) {
      p = String(p || "").toLowerCase();
      if (p.includes("insta")) return "instagram";
      if (p.includes("sms") || p.includes("twilio") || p.includes("sinch")) return "sms";
      if (p.includes("tiktok")) return "tiktok";
      if (p.includes("face")) return "facebook";
      return "";
    }

    let searchQ = "";
    let listFilter = "all";
    let totalCount = 0;

    function initialOf(name) {
      const s = String(name || "?").trim();
      return (s[0] || "?").toUpperCase();
    }
    function stateLabel(state) {
      return String(state || "").replace(/_/g, " ");
    }
    function matchesFilter(c) {
      const st = String(c.state || "");
      const hasPhone = !!c.phone;
      if (listFilter === "needs_call") return st === "flag_for_call";
      if (listFilter === "has_phone") return hasPhone;
      if (listFilter === "no_phone") return !hasPhone;
      return true;
    }
    function updateFilterCounts() {
      const all = convCache.length;
      let needs = 0, phone = 0, nophone = 0;
      for (const c of convCache) {
        if (String(c.state || "") === "flag_for_call") needs++;
        if (c.phone) phone++; else nophone++;
      }
      const setN = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n ? "(" + n + ")" : ""; };
      setN("fc-all", all);
      setN("fc-needs", needs);
      setN("fc-phone", phone);
      setN("fc-nophone", nophone);
    }

    function fmtNum(n) { return Number(n || 0).toLocaleString(); }

    async function loadStats() {
      try {
        const res = await fetch(apiUrl("/api/dm/stats"));
        if (!res.ok) return;
        const s = await res.json();
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
        set("st-conv", fmtNum(s.conversations));
        set("st-conv-sub", "<b>" + fmtNum(s.today?.activeConversations) + "</b> active today");
        const plats = Object.entries(s.byPlatform || {}).sort((a, b) => b[1] - a[1]);
        set("st-plat", plats.length ? fmtNum(plats[0][1]) : "0");
        set("st-plat-sub", plats.map(([p, n]) => esc(p) + ": <b>" + fmtNum(n) + "</b>").join(" &middot; ") || "no platforms yet");
        set("st-msgs", fmtNum(s.messages?.total));
        set("st-msgs-sub", "<b>" + fmtNum(s.messages?.fromLeads) + "</b> from leads &middot; <b>" + fmtNum(s.messages?.agentReplies) + "</b> agent replies");
        set("st-today", fmtNum(s.today?.newLeads));
        set("st-today-sub", "new leads &middot; <b>" + fmtNum(s.messages?.today) + "</b> messages today");
        set("st-phones", fmtNum(s.phoneCaptures?.total));
        set("st-phones-sub", "<b>" + (s.phoneCaptures?.rate ?? 0) + "%</b> of conversations");
        const needs = (s.needsMarco?.flaggedForCall || 0) + (s.needsMarco?.automationPaused || 0);
        set("st-marco", fmtNum(needs));
        set("st-marco-sub", "<b>" + fmtNum(s.needsMarco?.flaggedForCall) + "</b> flagged for call &middot; <b>" + fmtNum(s.needsMarco?.automationPaused) + "</b> paused");
        document.getElementById("st-marco-card")?.classList.toggle("warn", needs > 0);
      } catch (_) { /* stats are best-effort; inbox still works */ }
    }

    async function loadConversations(opts) {
      try {
        threadsEl.innerHTML = '<div class="dm-empty">Loading conversations…</div>';
        const sync = opts && opts.sync ? "&sync=1" : "";
        const res = await fetch(apiUrl("/api/dm/conversations?limit=500" + sync));
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        convCache = data.conversations || [];
        totalCount = data.total ?? convCache.length;
        renderThreads();
      } catch (e) {
        threadsEl.innerHTML = '<div class="dm-empty">Could not load conversations.<br>' + esc(e.message) + '</div>';
      }
    }

    function renderThreads() {
      updateFilterCounts();
      const countEl = document.getElementById("dm-count");
      if (countEl) countEl.textContent = totalCount ? "· " + totalCount : "";
      if (!convCache.length) {
        threadsEl.innerHTML = '<div class="dm-empty">No DM conversations yet.<br>' +
          'If this account is connected to Zernio, open Analytics → DM Agent again to pull the inbox, or tap <b>Refresh</b>.</div>';
        return;
      }
      const q = searchQ.trim().toLowerCase();
      const shown = convCache.filter((c) => {
        if (!matchesFilter(c)) return false;
        if (!q) return true;
        return String(c.name || "").toLowerCase().includes(q) ||
          String(c.userId || "").toLowerCase().includes(q) ||
          String(c.lastText || "").toLowerCase().includes(q);
      });
      if (!shown.length) {
        threadsEl.innerHTML = '<div class="dm-empty">' +
          (q ? 'No conversations match "' + esc(searchQ) + '".' : "No conversations in this filter.") +
          '</div>';
        return;
      }
      threadsEl.innerHTML = shown.map((c) => {
        const active = current && current.id === c.id ? " active" : "";
        const pc = platClass(c.platform);
        const st = String(c.state || "");
        const state = st
          ? `<span class="dm-state ${esc(st)}">${esc(stateLabel(st))}</span>`
          : "";
        const phone = c.phone
          ? `<a class="dm-phone" href="tel:${esc(c.phone)}" onclick="event.stopPropagation()" title="Captured number - tap to call">${esc(c.phone)}</a>`
          : `<span class="dm-phone-none">No phone</span>`;
        const preview = (c.lastRole === "assistant" ? "You: " : "") + (c.lastText || "");
        return `<div class="dm-thread${active}" data-id="${esc(c.id)}" data-platform="${esc(c.platform)}" data-userid="${esc(c.userId)}" data-name="${esc(c.name)}" data-phone="${esc(c.phone || "")}" role="button" tabindex="0" title="Open conversation">
          <div class="dm-av ${pc}" aria-hidden="true">${esc(initialOf(c.name))}</div>
          <div class="dm-thread-body">
            <div class="dm-thread-top">
              <span class="dm-thread-name">${esc(c.name)}</span>
              <span class="dm-thread-time">${esc(timeAgo(c.lastAt))}</span>
            </div>
            <div class="dm-thread-preview">${esc(preview)}</div>
            <div class="dm-thread-meta">
              <span class="dm-badge ${pc}">${esc(c.platform || "dm")}</span>
              ${phone}
              ${state}
            </div>
          </div>
          <span class="dm-thread-open" aria-hidden="true">›</span>
        </div>`;
      }).join("");
      threadsEl.querySelectorAll(".dm-thread").forEach((el) => {
        const open = () => selectThread({ id: el.dataset.id, platform: el.dataset.platform, userId: el.dataset.userid, name: el.dataset.name, phone: el.dataset.phone || "" });
        el.addEventListener("click", open);
        el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      });
    }

    function renderMessages(messages) {
      logEl.innerHTML = (messages || []).map((m) => {
        const cls = m.role === "assistant" ? "bot" : "user";
        const who = m.role === "assistant" ? "DM Agent" : "Lead";
        return `<div class="bubble ${cls}"><span class="who">${who}</span>${esc(m.text)}</div>`;
      }).join("");
      logEl.scrollTop = logEl.scrollHeight;
    }

    function renderConvHeader(t) {
      document.getElementById("conv-name").textContent = t.name || t.userId || "New conversation";
      const phone = t.phone
        ? `<a class="dm-phone" href="tel:${esc(t.phone)}">📞 ${esc(t.phone)}</a>`
        : `<span class="dm-phone-none">no number captured yet</span>`;
      document.getElementById("conv-sub").innerHTML =
        esc(t.platform) + " · " + esc(t.userId || "") + " &nbsp; " + phone;
    }

    async function selectThread(t) {
      current = t;
      renderThreads();
      renderConvHeader(t);
      msgInput.placeholder = "Message " + (t.name || "the lead") + "…";
      renderMessages([]);
      openModal();
      if (!t.id) { msgInput.focus(); return; }
      logEl.innerHTML = '<div class="bubble bot pending"><span class="who">DM Agent</span>loading…</div>';
      try {
        const res = await fetch(apiUrl("/api/dm/conversation/" + encodeURIComponent(t.id)));
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        // Prefer the authoritative phone from the conversation record.
        if (data.lead && data.lead.phone) { current.phone = data.lead.phone; renderConvHeader(current); }
        renderMessages(data.messages || []);
      } catch (e) {
        renderMessages([]);
      }
      msgInput.focus();
    }

    // Close the popup: X button, backdrop click, or Escape.
    document.getElementById("dm-modal-close").addEventListener("click", closeModal);
    document.getElementById("dm-modal-backdrop").addEventListener("click", closeModal);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

    document.getElementById("dm-search").addEventListener("input", (e) => {
      searchQ = e.target.value || "";
      renderThreads();
    });

    document.getElementById("dm-filters").addEventListener("click", (e) => {
      const btn = e.target.closest(".dm-fchip");
      if (!btn) return;
      listFilter = btn.dataset.filter || "all";
      document.querySelectorAll(".dm-fchip").forEach((el) => el.classList.toggle("on", el === btn));
      renderThreads();
    });

    document.getElementById("dm-new-btn").addEventListener("click", () => {
      const handle = prompt("New conversation - enter the lead's handle / user id (e.g. an Instagram username):", "");
      if (!handle || !handle.trim()) return;
      const uid = handle.trim();
      selectThread({ id: null, platform: "instagram", userId: uid, name: uid });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text || !current) return;
      msgInput.value = "";
      // optimistic lead bubble
      const b = document.createElement("div");
      b.className = "bubble user"; b.innerHTML = '<span class="who">Lead</span>' + esc(text);
      logEl.appendChild(b);
      const pending = document.createElement("div");
      pending.className = "bubble bot pending"; pending.innerHTML = '<span class="who">DM Agent</span>…';
      logEl.appendChild(pending); logEl.scrollTop = logEl.scrollHeight;
      sendBtn.disabled = true; msgInput.disabled = true;
      try {
        const res = await fetch(apiUrl("/simulate"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ platform: current.platform || "instagram", user_id: current.userId, message: text, comment_or_dm: "dm" }),
        });
        const data = await res.json().catch(() => ({}));
        pending.remove();
        if (!res.ok) {
          const err = document.createElement("div");
          err.className = "bubble error"; err.textContent = data.error || ("Request failed (" + res.status + ")");
          logEl.appendChild(err);
        } else {
          const reply = document.createElement("div");
          reply.className = "bubble bot";
          reply.innerHTML = '<span class="who">DM Agent</span>' + esc(data.reply || "(no reply)");
          logEl.appendChild(reply);
        }
        logEl.scrollTop = logEl.scrollHeight;
        await loadConversations();
        // the thread now exists server-side - attach its id if we can match on userId
        if (!current.id) {
          const match = convCache.find((c) => c.userId === current.userId && platClass(c.platform) === platClass(current.platform));
          if (match) { current.id = match.id; current.name = match.name; renderThreads(); }
        }
      } catch (err) {
        pending.remove();
        const el = document.createElement("div");
        el.className = "bubble error"; el.textContent = String(err.message || err);
        logEl.appendChild(el);
      } finally {
        sendBtn.disabled = false; msgInput.disabled = false; msgInput.focus();
      }
    });

    loadConversations();
    loadStats();
    setInterval(loadConversations, 8000);
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
