<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buyers &amp; Sellers Tracker · Marco Puga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BUYERS & SELLERS TRACKER
   Same design system as Task Command (rounded-square geometry,
   Marco crimson + Brivity teal, light/dark). The pipeline board
   is a horizontally scrolling column per stage.

   Side colours are deliberately OUTSIDE the task-status palette
   (slate / blue / amber / green / red) so a buyer banner can
   never be misread as a task state: buyer = indigo, seller =
   orange, both = split.
   ============================================================ */
:root{
  --brand1:#f4695b; --brand2:#bd1e2b;
  --teal:#59c4c4; --teal-strong:#4ca7a7;
  --buyer:#4F46E5; --seller:#EA580C;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,Roboto,sans-serif;
  --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.32,.72,.28,1);
  --bg:#f6f8f9; --card:#ffffff; --line:#e8ecee; --ink:#2f3438; --muted:#5f6b78;
  --soft:#f2f6f6; --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#0f1418; --card:#171d24; --line:#242c35; --ink:#e6ebef; --muted:#93a0ac;
  --soft:#1c242c; --shadow:0 1px 3px rgba(0,0,0,.4);
  --buyer:#8189F0; --seller:#FB8B4C;
  color-scheme: dark;
}
/* Native dropdown lists are painted by the OS, so the popup needs solid colours
   of its own and not the transparent background the closed control uses. */
select option, select optgroup{background:var(--card);color:var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  font-optical-sizing:auto;font-feature-settings:"cv02","cv03","cv04";
  display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#9aa6b2;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#7c8894;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#4a5560;background-clip:padding-box}
*{scrollbar-color:#9aa6b2 transparent}
html[data-theme="dark"] *{scrollbar-color:#4a5560 transparent}

/* ── Topbar ── */
#top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:40}
.brand{display:flex;align-items:center;gap:9px}
.brand .wm{display:flex;flex-direction:column;line-height:1;font-family:var(--serif)}
.brand .wm small{font-size:5.6px;letter-spacing:.18em;color:#c23b3b;margin-bottom:2px;white-space:nowrap}
.brand .wm b{font-size:13px;letter-spacing:.06em;color:var(--ink)}
.brand .wm i{font-style:normal;font-size:9px;letter-spacing:.3em;color:var(--muted);margin-top:3px}
.tbtn{height:36px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;
  padding:0 13px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tbtn:hover{color:var(--teal-strong);border-color:var(--teal)}
.tbtn.primary{background:linear-gradient(180deg,var(--brand1),var(--brand2));border-color:transparent;color:#fff}
.tbtn.primary:hover{color:#fff;filter:brightness(1.05)}
#search{flex:1;max-width:340px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:0 12px;font-size:13px}
#search:focus{outline:none;border-color:var(--teal)}

/* Side switch — the one control that changes which pipeline you are looking at. */
#sideSwitch{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
#sideSwitch button{border:0;background:transparent;color:var(--muted);border-radius:8px;height:30px;padding:0 15px;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
#sideSwitch button .dot{width:8px;height:8px;border-radius:50%}
#sideSwitch button[data-side="buyer"] .dot{background:var(--buyer)}
#sideSwitch button[data-side="seller"] .dot{background:var(--seller)}
#sideSwitch button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ── Filter bar ── */
#filters{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;
  background:var(--card);border-bottom:1px solid var(--line)}
.flabel{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;height:28px;
  padding:0 11px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.chip .cdot{width:7px;height:7px;border-radius:50%}
.chip.on{color:#fff;border-color:transparent}
/* Force the stage row onto its own line: appended to the status row, the
   "STAGE" label reads as if it belongs to the statuses. */
.frow-break{flex-basis:100%;height:0}
.chip .chipn{font-size:10px;font-weight:800;opacity:.75;margin-left:1px}
.chip.empty{opacity:.42}
.chip.empty:hover{opacity:.75}
.chip.on .cdot{background:rgba(255,255,255,.85)}
.fsel{height:28px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 8px;
  font-size:12px;font-weight:600;max-width:170px}
.fdate{height:28px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 8px;font-size:12px}
#clearF{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:700;text-decoration:underline}
#clearF:hover{color:var(--brand2)}
#countLine{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
#countLine b{color:var(--ink)}

/* ── Board ── */
#boardWrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:14px 20px 0}
#board{flex:1 1 auto;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;align-items:stretch;
  padding-bottom:4px}
/* Native horizontal bar is overlay-only on some platforms and vanishes when idle;
   #boardScroll below is always visible and drives the same scrollLeft. */
#board{scrollbar-width:none;-ms-overflow-style:none}
#board::-webkit-scrollbar{height:0;display:none}
#boardScroll{flex:0 0 auto;height:12px;margin:8px 0 12px;border-radius:8px;background:rgba(127,140,155,.16);
  position:relative;cursor:pointer;display:none}
#boardScroll.on{display:block}
#boardThumb{position:absolute;top:0;left:0;height:100%;min-width:40px;border-radius:8px;background:#7c8894;cursor:grab}
#boardThumb:hover{background:#6a7682}
#boardThumb.drag{cursor:grabbing;background:#5f6b77}
html[data-theme="dark"] #boardScroll{background:rgba(255,255,255,.07)}
html[data-theme="dark"] #boardThumb{background:#5c6875}

.col{flex:0 0 268px;display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:border-color .12s var(--ease)}
.col.drop{border-color:var(--teal);box-shadow:0 0 0 2px rgba(89,196,196,.25),var(--shadow)}
.colhead{flex:0 0 auto;padding:11px 12px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.colhead .cbar{width:3px;height:16px;border-radius:2px;flex:0 0 auto}
.colhead h3{font-size:12.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.colhead .cnt{font-size:11px;font-weight:800;color:var(--muted);background:var(--soft);border-radius:999px;
  padding:2px 8px;flex:0 0 auto}
.colbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:9px}
.colempty{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 6px;border:1px dashed var(--line);
  border-radius:var(--r-sm)}

/* ── Card ── */
/* flex:0 0 auto is load-bearing: .colbody is a flex column, so once a column holds
   more cards than fit, the default flex-shrink squashes every card and clips its
   text instead of letting the column scroll. */
.rec{flex:0 0 auto;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 11px 10px 13px;
  cursor:pointer;transition:box-shadow .14s var(--ease),transform .14s var(--ease);overflow:hidden}
.rec:hover{box-shadow:0 5px 16px rgba(16,24,40,.12);transform:translateY(-1px)}
html[data-theme="dark"] .rec:hover{box-shadow:0 6px 18px rgba(0,0,0,.45)}
.rec.dragging{opacity:.45}
/* Select mode: a checkbox on every card, dragging suspended so a click always
   means "select" and never an accidental stage move. */
.rec .rsel{display:none;position:absolute;top:8px;right:8px;width:16px;height:16px;z-index:2}
body.selecting .rec{padding-right:28px}
body.selecting .rec .rsel{display:block}
.rec.picked{box-shadow:0 0 0 2px var(--teal),0 5px 16px rgba(16,24,40,.12);background:var(--glass-tint,var(--soft))}
/* Side banner: the left edge stripe. Two-sided records get both colours. */
.rec::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.rec.side-buyer::before{background:var(--buyer)}
.rec.side-seller::before{background:var(--seller)}
.rec.side-both::before{background:linear-gradient(180deg,var(--buyer) 0 50%,var(--seller) 50% 100%)}
.rec .rtop{display:flex;align-items:flex-start;gap:7px}
.rec .rname{font-weight:700;font-size:13.5px;flex:1;min-width:0;line-height:1.3}
.pill{font-size:10px;font-weight:800;letter-spacing:.03em;color:#fff;border-radius:999px;padding:2px 7px;
  flex:0 0 auto;text-transform:uppercase}
.rec .rmeta{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 6px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Combined view: two lists instead of many stage columns, so each gets far more
   width — the point of the request was seeing both books at once. */
.col.col-wide{flex:1 1 0;min-width:300px;max-width:none}
/* Funnel view */
.funnelbody{padding:14px 14px 16px}
.fnrow{margin-bottom:13px}
.fnrow.zero{opacity:.45}
.fnhead{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.fnlabel{flex:1;font-size:12.5px;font-weight:700}
.fnn{font-size:13px;font-weight:800}
.fnpct{font-size:11px;color:var(--muted);min-width:34px;text-align:right}
.fnbar{height:9px;border-radius:5px;background:var(--soft);overflow:hidden}
.fnbar i{display:block;height:100%;border-radius:5px;transition:width .25s}
.fndrop{font-size:10.5px;color:var(--muted);margin-top:3px}
.fnfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.tag.stagetag{background:rgba(8,145,178,.14);color:#0E7490;font-weight:700}
.tag.stagetag.none{background:var(--soft);color:var(--muted);font-weight:600}
[data-theme="dark"] .tag.stagetag{background:rgba(34,211,238,.16);color:#67E8F9}
.tag.sidetag{color:#fff}
.tag.sidetag.b{background:var(--buyer)}
.tag.sidetag.s{background:var(--seller)}
.ckchip{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 6px}
.ckchip.alldone{color:#fff;background:#059669}
.rec .rfoot{margin-top:7px;font-size:10.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.rec .stale{color:#DC2626;font-weight:700}

/* ── Drawer ── */
#scrim{position:fixed;inset:0;background:rgba(15,20,24,.42);opacity:0;pointer-events:none;
  transition:opacity .18s var(--ease);z-index:50}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s var(--ease);z-index:51;display:flex;flex-direction:column}
#drawer.on{transform:none}
#dHead{flex:0 0 auto;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
#dHead h2{font-family:var(--serif);font-size:20px;flex:1;min-width:0;line-height:1.25}
#dBody{flex:1 1 auto;overflow-y:auto;padding:16px 18px 26px;display:flex;flex-direction:column;gap:16px}
#dFoot{flex:0 0 auto;padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
.sect{border:1px solid var(--line);border-radius:var(--r);padding:13px}
.sect > h4{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted);margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:0 9px;font-size:13px}
.f textarea{height:auto;min-height:74px;padding:8px 9px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--teal)}
.sidepick{display:flex;gap:8px}
.sidepick label{flex:1;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.sidepick label.on{border-color:transparent;color:#fff}
.sidepick label.on.b{background:var(--buyer)}
.sidepick label.on.s{background:var(--seller)}
.sidepick input{display:none}

/* Stage rail — the pipeline as a vertical list so the current step is obvious. */
.rail{display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;
  padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;width:100%}
.rail button:hover{background:var(--soft);color:var(--ink)}
.rail button .rdot{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.rail button.done .rdot{background:var(--line);border-color:var(--line)}
.rail button.cur{color:#fff;font-weight:800}
.rail button.cur .rdot{background:#fff;border-color:#fff}
.rail.b button.cur{background:var(--buyer)}
.rail.s button.cur{background:var(--seller)}
.rail button .rwhen{margin-left:auto;font-size:10.5px;font-weight:600;opacity:.85}
.railnote{font-size:11px;color:var(--muted);margin-top:8px}

/* Checklist — same interaction as the task modal. */
.ckitem{display:flex;align-items:flex-start;gap:8px;padding:5px 0}
.ckitem input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex:0 0 auto;accent-color:var(--teal-strong)}
.ckitem .cktext{flex:1;border:0;background:transparent;font-size:13px;line-height:1.4;resize:none;overflow:hidden;padding:0}
.ckitem .cktext:focus{outline:none}
.ckitem.done .cktext{text-decoration:line-through;color:var(--muted)}
.ckdel{border:0;background:transparent;color:var(--muted);font-size:14px;line-height:1;padding:2px 4px}
.ckdel:hover{color:#DC2626}
.ckempty{font-size:12px;color:var(--muted);padding:4px 0}
/* Task Manager link controls, one per checklist row. */
.ckitem{align-items:center}
.cksend{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;height:24px;
  padding:0 8px;font-size:10.5px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.cksend:hover{border-color:var(--teal);color:var(--teal-strong)}
.cktask{display:flex;align-items:center;gap:5px;border-radius:7px;height:24px;padding:0 8px;font-size:10.5px;
  font-weight:700;white-space:nowrap;flex:0 0 auto;background:#7C3AED;color:#fff;border:0}
.cktask.done{background:#059669}
.cktask.gone{background:var(--soft);color:var(--muted)}
.ckunlink{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 3px;flex:0 0 auto}
.ckunlink:hover{color:#DC2626}
#ckPushAll{margin-top:8px}
.tasknote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
#ckNew{height:32px;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:0 9px;
  font-size:12.5px;width:100%;margin-top:6px}
#ckNew:focus{outline:none;border-color:var(--teal);border-style:solid}
.danger{border-color:#f2c2c2;color:#DC2626}
.danger:hover{background:#fee2e2;border-color:#DC2626;color:#DC2626}
html[data-theme="dark"] .danger{border-color:#5b2626}
html[data-theme="dark"] .danger:hover{background:#3b1a1a}

#empty{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);
  text-align:center;padding:40px 20px}
#empty h3{font-family:var(--serif);font-size:20px;color:var(--ink)}
#empty p{font-size:13px;max-width:440px;line-height:1.5}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#1f2937;color:#fff;
  padding:10px 16px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:all .2s var(--ease);z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Bulk stage bar ── hidden unless select mode is on. */
#bulkBar{display:none;align-items:center;gap:9px;padding:9px 20px;background:var(--card);
  border-bottom:1px solid var(--teal);flex-wrap:wrap}
body.selecting #bulkBar{display:flex}
#selectModeBtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
#bulkCount{font-size:12.5px;font-weight:800;color:var(--ink);min-width:82px}
.bulkDivider{width:1px;height:22px;background:var(--line)}
#bulkStageSel{max-width:220px}
#bulkEngageBtn{border-color:var(--teal);color:var(--teal-strong)}
#bulkEngageBtn:hover{background:var(--glass-tint,var(--soft))}
</style>
</head>
<body>

<header id="top">
  <!-- Hidden when embedded (CRM tab, shell): the host page already shows the
       Marco Puga mark, and two stacked logos read as a broken nesting. -->
  <div class="brand" id="brand">
    <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
      <defs><linearGradient id="mp" x1="0" y1="2" x2="0" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4695b"/><stop offset="1" stop-color="#bd1e2b"/></linearGradient></defs>
      <path d="M24 4 44 24 24 44 4 24Z" stroke="url(#mp)" stroke-width="2.2"/>
      <path d="M14.5 22 24 12.5 33.5 22" stroke="url(#mp)" stroke-width="1.9" stroke-linejoin="round"/>
      <text x="24" y="33.5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="14.5" fill="url(#mp)">M</text>
    </svg>
    <span class="wm"><small>HAPPINESS BEGINS AT HOME</small><b>MARCO PUGA</b><i>TRACKER</i></span>
  </div>
  <div id="sideSwitch">
    <button data-side="buyer" class="on"><span class="dot"></span>Buyers</button>
    <button data-side="seller"><span class="dot"></span>Sellers</button>
    <button data-side="both"><span class="dot"></span>Both</button>
    <button data-side="funnel"><span class="dot"></span>Funnel</button>
  </div>
  <input id="search" placeholder="Search name, phone, email, address…" autocomplete="off" />
  <button class="tbtn" id="themeBtn">◐ Theme</button>
  <button class="tbtn" id="refreshBtn">↺ Refresh</button>
  <button class="tbtn" id="selectModeBtn">☐ Select</button>
  <button class="tbtn primary" id="addBtn">+ Add Person</button>
</header>

<div id="filters">
  <span class="flabel">SHOW</span>
  <button class="chip" id="fContact" title="Hide people with no phone and no email">
    <span class="cdot" style="background:#0891B2"></span><span id="fContactLabel">Contactable only</span>
  </button>
  <span class="flabel">STATUS</span>
  <div class="chips" id="statusChips"></div>
  <span class="frow-break"></span>
  <span class="flabel">STAGE</span>
  <div class="chips" id="stageChips"></div>
  <span class="frow-break"></span>
  <span class="flabel">SOURCE</span>
  <select class="fsel" id="fSource"><option value="">All</option></select>
  <span class="flabel">ASSIGNED</span>
  <select class="fsel" id="fAssigned"><option value="">Anyone</option></select>
  <span class="flabel">ADDED</span>
  <input class="fdate" type="date" id="fFrom" title="Added on or after" />
  <span style="color:var(--muted)">–</span>
  <input class="fdate" type="date" id="fTo" title="Added on or before" />
  <button id="clearF">Clear</button>
  <div id="countLine"></div>
</div>

<!-- Bulk-stage bar: appears in select mode. Most of the tracker has no automatic
     signal to stage from — this is how the team actually advances the board. -->
<div id="bulkBar">
  <span id="bulkCount">0 selected</span>
  <button class="tbtn" id="bulkSelectPage">Select all shown</button>
  <button class="tbtn" id="bulkClearSel">Clear</button>
  <span class="bulkDivider"></span>
  <select class="fsel" id="bulkStageSel"><option value="">Move to stage…</option></select>
  <button class="tbtn primary" id="bulkApplyBtn" disabled>Apply</button>
  <span class="bulkDivider"></span>
  <button class="tbtn" id="bulkEngageBtn" title="Stage anyone with a real DM conversation to Contacted">
    ✨ Auto-stage from conversations
  </button>
  <div style="flex:1"></div>
  <button class="tbtn" id="bulkDoneBtn">Done</button>
</div>

<div id="boardWrap">
  <div id="board"></div>
  <div id="boardScroll"><div id="boardThumb"></div></div>
</div>
<div id="empty">
  <h3>Nothing in this pipeline yet</h3>
  <p id="emptyMsg">Add a person with “+ Add Person”, or drop an existing one into a stage.</p>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div id="dHead">
    <h2 id="dName">—</h2>
    <button class="tbtn" id="dClose">✕</button>
  </div>
  <div id="dBody"></div>
  <div id="dFoot">
    <button class="tbtn danger" id="dDelete">Delete</button>
    <div style="flex:1"></div>
    <span id="dSaved" style="font-size:11.5px;color:var(--muted)"></span>
    <button class="tbtn primary" id="dSave">Save</button>
  </div>
</aside>

<div id="toast"></div>

<script>
"use strict";

/* ================= constants ================= */
/* Status colours are picked to stay clear of the two side colours (indigo /
   orange) so a card never reads as "buyer" when it means "hot". */
var STATUS_META = {
  new:         {label:"New",         c:"#64748B"},
  unqualified: {label:"Unqualified", c:"#94A3B8"},
  watch:       {label:"Watch",       c:"#0891B2"},
  nurture:     {label:"Nurture",     c:"#7C3AED"},
  hot:         {label:"Hot",         c:"#DC2626"},
  pending:     {label:"Pending",     c:"#059669"}
};
var SIDE_COLOR = {buyer:"#4F46E5", seller:"#EA580C", both:"#0891B2"};
/* Stage at which the tracker asks for a timeline date (per the spec). */
var TIMELINE_STAGE = {buyer:"qualified", seller:"cma_requested"};
var STALE_DAYS = 14;

/* ================= state ================= */
var SIDE   = "buyer";          // which pipeline the board is showing
var SCHEMA = {statuses:[], buyerStages:[], sellerStages:[]};
var RECORDS = [];              // everything, unfiltered
var FILTER  = {status:{}, stage:{}, source:"", assigned:"", from:"", to:"", q:"", contactable:false};
/* Most of the imported book is Instagram/TikTok handles with no phone or email.
   The preference sticks, because someone who only ever works the reachable
   people should not have to re-hide the rest on every visit. */
var CONTACT_KEY="trackerContactableOnly";
try{ FILTER.contactable = localStorage.getItem(CONTACT_KEY)==="1"; }catch(_){}
/* Select mode: most of the tracker has no automatic signal to stage from, so
   moving many people at once by hand is the real daily lever. SELECTED is
   keyed by id rather than an array so toggling and lookup are both O(1) and
   survive a re-render (drag/filter change) without losing the picks. */
var SELECTING = false;
var SELECTED = {};
var CUR = null;                // record open in the drawer
var CK  = [];                  // drawer checklist working copy
var TASKS = {};                // taskId -> live Task Manager state for CUR
var DIRTY = false;

/* ================= helpers ================= */
function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},2200);}
var EMBEDDED = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
if(EMBEDDED){ var _b=document.getElementById("brand"); if(_b) _b.style.display="none"; }

function api(p,opts){return fetch(p,opts).then(function(r){
  if(!r.ok)return r.json().catch(function(){return{};}).then(function(j){
    throw new Error(j.error||("HTTP "+r.status));});
  return r.json();});}
function jsonReq(method,body){return {method:method,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};}
function stages(side){return side==="seller"?SCHEMA.sellerStages:SCHEMA.buyerStages;}
function stageOf(rec,side){return side==="seller"?(rec.sellerStage||null):(rec.buyerStage||null);}

/* ================= combined stage vocabulary =================
   Buyers and sellers do NOT share a stage list — 11 vs 14, overlapping on six
   keys (contacted, under_contract, option_period, clear_to_close, closed,
   past_client). For one flat row of stage buttons "like the statuses", the
   shared keys have to collapse into a single chip: two "Under Contract"
   buttons that mean the same thing, one of which silently ignores half the
   book, is worse than none.

   Side-specific stages keep a small B/S marker so it is obvious WHY tapping
   "Pre-Approved" shows no sellers — the filter isn't broken, sellers simply
   don't have that stage. */
function mergedStages(){
  var seen={}, out=[];
  var add=function(list,side){
    (list||[]).forEach(function(s){
      if(seen[s.key]){ seen[s.key].sides[side]=true; return; }
      seen[s.key]={key:s.key,label:s.label,sides:{}};
      seen[s.key].sides[side]=true;
      out.push(seen[s.key]);
    });
  };
  /* Seller list first: it is the longer one and its ordering reads as the
     fuller funnel, so buyer-only stages slot in rather than the reverse. */
  add(SCHEMA.sellerStages,"seller");
  add(SCHEMA.buyerStages,"buyer");
  return out;
}
/* Which pipelines the current view covers. "both" and "funnel" are views, not
   pipelines — every side test goes through here so a new view can never end up
   silently filtering for a side no record has. */
function sidesShown(){return (SIDE==="both"||SIDE==="funnel")?["buyer","seller"]:[SIDE];}
function oneSide(){var s=sidesShown();return s.length===1?s[0]:null;}

/** Stage chips for whichever side(s) the board is showing. */
function stageOptions(){
  if(!oneSide()) return mergedStages();
  return stages(oneSide()).map(function(s){
    var o={key:s.key,label:s.label,sides:{}};
    o.sides[oneSide()]=true;
    return o;
  });
}
function anyStageOn(){return Object.keys(FILTER.stage).some(function(k){return FILTER.stage[k];});}

/**
 * How many people sit in each stage right now.
 *
 * Counted against every OTHER active filter but not the stage filter itself —
 * the standard faceted count. Counting against the stage filter too would make
 * every unselected chip read 0 the moment you picked one, which is the exact
 * opposite of what the number is for.
 */
function stageCounts(){
  var out={__unstaged:0};
  var check=sidesShown(), only=oneSide();
  RECORDS.forEach(function(rec){
    var sides=rec.sides||[];
    if(!sides.length) return;
    if(only && sides.indexOf(only)<0) return;
    if(FILTER.contactable && !contactable(rec)) return;
    if(anyStatusOn() && !FILTER.status[rec.status]) return;
    if(FILTER.source && (rec.source||"").trim().toLowerCase()!==FILTER.source) return;
    if(FILTER.assigned && (rec.assignedTo||"").trim().toLowerCase()!==FILTER.assigned) return;
    if(FILTER.from && ymdOf(rec.addedAt) < FILTER.from) return;
    if(FILTER.to   && ymdOf(rec.addedAt) > FILTER.to)   return;
    if(FILTER.q && !matchesQuery(rec)) return;

    var staged=false;
    check.forEach(function(side){
      if(sides.indexOf(side)<0) return;
      var k=stageOf(rec,side);
      if(k){ staged=true; out[k]=(out[k]||0)+1; }
    });
    if(!staged) out.__unstaged++;
  });
  return out;
}
function stageLabel(side,key){var s=stages(side).find(function(x){return x.key===key;});return s?s.label:key;}
function sideClass(rec){var s=rec.sides||[];
  if(s.indexOf("buyer")>=0&&s.indexOf("seller")>=0)return "side-both";
  return s.indexOf("seller")>=0?"side-seller":"side-buyer";}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6);}
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function shortDate(iso){var d=new Date(iso);if(isNaN(d))return"";
  return MONTHS[d.getMonth()]+" "+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?", "+d.getFullYear():"");}
function daysSince(iso){var d=new Date(iso);if(isNaN(d))return null;
  return Math.floor((Date.now()-d.getTime())/86400000);}
function ymdOf(iso){return String(iso||"").slice(0,10);}

/* ================= theme ================= */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light");
  localStorage.setItem("teamTasksTheme",t);}
applyTheme(localStorage.getItem("teamTasksTheme")||"light");
document.getElementById("themeBtn").onclick=function(){
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");};

/* ================= filtering =================
   Done client-side: the whole tracker is small enough to hold in memory, and it
   keeps the board responsive while typing instead of firing a request per key. */
function anyStatusOn(){return Object.keys(FILTER.status).some(function(k){return FILTER.status[k];});}
/* "Contactable" means there is a way to actually reach them. A social handle is
   not one — the DM agent owns that conversation until they hand over a number. */
function contactable(rec){return !!((rec.phone||"").trim()||(rec.email||"").trim());}

/**
 * Does this record sit in any selected stage?
 *
 * Checks whichever side(s) the board is showing, so someone who is buying AND
 * selling matches on either of their two stages — filtering to "Under
 * Contract" should surface them if either side of their deal is under
 * contract, not only the one that happens to be on screen.
 *
 * "__unstaged" is a real, selectable choice. After the CRM import most of the
 * book has no stage at all, and those people are exactly who the team needs to
 * find; a filter that could not name them would hide the largest group.
 */
function matchesStage(rec){
  var check=sidesShown();
  var sides=rec.sides||[];
  var unstagedWanted=!!FILTER.stage.__unstaged;
  var anyOnSide=false, anyStaged=false;
  for(var i=0;i<check.length;i++){
    var side=check[i];
    if(sides.indexOf(side)<0) continue;
    anyOnSide=true;
    var k=stageOf(rec,side);
    if(k){ anyStaged=true; if(FILTER.stage[k]) return true; }
  }
  if(unstagedWanted && anyOnSide && !anyStaged) return true;
  return false;
}
function passes(rec){
  var sides=rec.sides||[];
  /* "Both" is every record on either pipeline — including someone selling and
     buying at once, who appears in each column rather than being shown twice
     in one. */
  if(!sides.length) return false;
  var only=oneSide();
  if(only && sides.indexOf(only)<0) return false;
  if(FILTER.contactable && !contactable(rec)) return false;
  if(anyStatusOn() && !FILTER.status[rec.status]) return false;
  if(anyStageOn() && !matchesStage(rec)) return false;
  if(FILTER.source && (rec.source||"").trim().toLowerCase()!==FILTER.source) return false;
  if(FILTER.assigned && (rec.assignedTo||"").trim().toLowerCase()!==FILTER.assigned) return false;
  if(FILTER.from && ymdOf(rec.addedAt) < FILTER.from) return false;
  if(FILTER.to   && ymdOf(rec.addedAt) > FILTER.to)   return false;
  if(FILTER.q && !matchesQuery(rec)) return false;
  return true;
}

/* Pulled out of passes() so the stage counts use the SAME search logic rather
   than a second copy that quietly drifts from it. */
function matchesQuery(rec){
  var q=FILTER.q.toLowerCase();
  var hay=[rec.name,rec.phone,rec.email,rec.address,rec.source,rec.notes]
    .filter(Boolean).join(" ").toLowerCase();
  var digits=String(rec.phone||"").replace(/\D/g,"");
  return hay.indexOf(q)>=0 || (/\d/.test(q)&&digits.indexOf(q.replace(/\D/g,""))>=0);
}
function visible(){return RECORDS.filter(passes);}

/* ================= board ================= */
/**
 * @param viewSide Which pipeline this card is being shown under. Only passed
 *   by the combined view, where a column no longer implies the side — and,
 *   more importantly, no longer implies the STAGE. On the kanban the column
 *   header is the stage; in a flat list nothing is, so the stage has to travel
 *   on the card or it disappears from the view entirely.
 */
function cardHtml(rec,viewSide){
  var mine = viewSide || (SIDE==="seller"?"seller":"buyer");
  var st=STATUS_META[rec.status]||STATUS_META.new;
  var bits=[];
  if(viewSide){
    var ms=stageOf(rec,mine);
    bits.push('<span class="tag stagetag'+(ms?"":" none")+'">'+
      (ms?esc(stageLabel(mine,ms)):"Unstaged")+'</span>');
  }
  if(rec.phone)   bits.push('<span class="tag">'+esc(rec.phone)+'</span>');
  if(rec.address) bits.push('<span class="tag">'+esc(rec.address)+'</span>');
  if(rec.source)  bits.push('<span class="tag">'+esc(rec.source)+'</span>');
  /* A two-sided person shows where they sit on the OTHER pipeline, so working the
     buyer board never hides the fact that they are also selling. */
  var other = mine==="buyer"?"seller":"buyer";
  if((rec.sides||[]).indexOf(other)>=0){
    var os=stageOf(rec,other);
    bits.push('<span class="tag sidetag '+(other==="buyer"?"b":"s")+'">'+
      (other==="buyer"?"Buying":"Selling")+(os?" · "+esc(stageLabel(other,os)):"")+'</span>');
  }
  var ck=Array.isArray(rec.checklist)?rec.checklist:[];
  if(ck.length){
    var done=ck.filter(function(i){return i.done;}).length;
    bits.push('<span class="ckchip'+(done===ck.length?" alldone":"")+'">'+
      (done===ck.length?"☑":"☐")+" "+done+"/"+ck.length+'</span>');
  }
  /* Only ever reported from a real logged contact. Falling back to updatedAt made
     every untouched record claim "Contacted today", which is the opposite of what
     this line is for. */
  var d=rec.lastInteractionAt?daysSince(rec.lastInteractionAt):null;
  var foot = d===null
    ? '<span style="opacity:.7">No contact logged</span>'
    : (d>=STALE_DAYS
        ? '<span class="stale">● '+d+'d since contact</span>'
        : '<span>'+(d<=0?"Contacted today":d+"d since contact")+'</span>');
  return '<article class="rec '+sideClass(rec)+(SELECTED[rec.id]?" picked":"")+
    '" draggable="'+(SELECTING?"false":"true")+'" data-id="'+esc(rec.id)+'">'+
    '<input type="checkbox" class="rsel" data-selid="'+esc(rec.id)+'"'+(SELECTED[rec.id]?" checked":"")+'>'+
    '<div class="rtop"><div class="rname">'+esc(rec.name)+'</div>'+
      '<span class="pill" style="background:'+st.c+'">'+esc(st.label)+'</span></div>'+
    (bits.length?'<div class="rmeta">'+bits.join("")+'</div>':'')+
    '<div class="rfoot">'+foot+'</div>'+
  '</article>';
}

/**
 * Sales funnel — both pipelines as ordered stages with drop-off.
 *
 * The one half of the requested dashboard that has real data behind it: 1,219
 * tracker records with stages. It is honest about the shape of that data
 * rather than flattering it — most of the book is unstaged, and a funnel drawn
 * over three used stages would look like a healthy pipeline if the empty ones
 * were hidden. They are shown at zero instead.
 *
 * "Reached" is cumulative: someone Under Contract has necessarily been
 * Contacted, so each row counts everyone at that stage OR beyond it. A funnel
 * built from per-stage occupancy instead would show a jagged sawtooth and
 * imply people had gone backwards.
 */
function funnelFor(side){
  const list = RECORDS.filter(function(r){
    return (r.sides||[]).indexOf(side)>=0 && passesExceptSide(r);
  });
  const st = stages(side);
  const idx = {}; st.forEach(function(s,i){ idx[s.key]=i; });

  const atOrBeyond = st.map(function(){ return 0; });
  let unstaged = 0;
  list.forEach(function(r){
    const k = stageOf(r,side);
    if(k==null || idx[k]==null){ unstaged++; return; }
    for(let i=0;i<=idx[k];i++) atOrBeyond[i]++;
  });

  const top = atOrBeyond.length ? atOrBeyond[0] : 0;
  return { side:side, total:list.length, unstaged:unstaged, top:top,
    rows: st.map(function(s,i){
      const n = atOrBeyond[i];
      const prev = i===0 ? n : atOrBeyond[i-1];
      return { key:s.key, label:s.label, n:n,
               pct: top ? Math.round((n/top)*100) : 0,
               dropped: Math.max(0, prev-n) };
    }) };
}

/* passes() minus the side test, so the funnel honours the status/source/date
   filters without excluding the other pipeline. */
function passesExceptSide(rec){
  if(FILTER.contactable && !contactable(rec)) return false;
  if(anyStatusOn() && !FILTER.status[rec.status]) return false;
  if(FILTER.source && (rec.source||"").trim().toLowerCase()!==FILTER.source) return false;
  if(FILTER.assigned && (rec.assignedTo||"").trim().toLowerCase()!==FILTER.assigned) return false;
  if(FILTER.from && ymdOf(rec.addedAt) < FILTER.from) return false;
  if(FILTER.to   && ymdOf(rec.addedAt) > FILTER.to)   return false;
  if(FILTER.q && !matchesQuery(rec)) return false;
  return true;
}

function funnelHtml(f){
  const color = SIDE_COLOR[f.side];
  const name = f.side==="buyer" ? "BUYERS" : "SELLERS";
  const used = f.rows.filter(function(r){ return r.n>0; }).length;
  return '<section class="col col-wide nodrop">'+
    '<div class="colhead"><span class="cbar" style="background:'+color+'"></span>'+
      '<h3>'+name+' FUNNEL</h3><span class="cnt">'+f.total+'</span></div>'+
    '<div class="colbody funnelbody">'+
      (f.total===0
        ? '<div class="colempty">Nobody matches these filters</div>'
        : f.rows.map(function(r){
            return '<div class="fnrow'+(r.n?"":" zero")+'">'+
              '<div class="fnhead"><span class="fnlabel">'+esc(r.label)+'</span>'+
                '<span class="fnn">'+r.n+'</span>'+
                '<span class="fnpct">'+r.pct+'%</span></div>'+
              '<div class="fnbar"><i style="width:'+Math.max(r.pct,r.n?1.5:0)+'%;background:'+color+'"></i></div>'+
              (r.dropped ? '<div class="fndrop">'+r.dropped+' did not reach this stage</div>' : '')+
            '</div>';
          }).join("")
      )+
      '<div class="fnfoot">'+
        '<b>'+f.unstaged+'</b> of '+f.total+' have no stage set yet'+
        (used<=1 && f.total ? ' · only '+used+' stage'+(used===1?" is":"s are")+' in use, so this funnel is mostly empty — that is the data, not a bug.' : '')+
      '</div>'+
    '</div></section>';
}

function renderFunnel(){
  const b = funnelFor("buyer"), s = funnelFor("seller");
  document.getElementById("board").innerHTML = funnelHtml(b) + funnelHtml(s);
  document.getElementById("countLine").innerHTML =
    '<b>'+b.total+'</b> buyers · <b>'+s.total+'</b> sellers · '+
    (b.unstaged+s.unstaged)+' unstaged';
  const none = RECORDS.length===0;
  document.getElementById("empty").style.display=none?"flex":"none";
  document.getElementById("boardWrap").style.display=none?"none":"flex";
  syncScrollbar();
}

function renderBoard(){
  if(SIDE==="funnel") return renderFunnel();
  if(SIDE==="both") return renderCombined();
  var board=document.getElementById("board");
  var list=visible();
  var st=stages(SIDE);
  var byStage={}; st.forEach(function(s){byStage[s.key]=[];});
  var unstaged=[];
  list.forEach(function(r){
    var k=stageOf(r,SIDE);
    if(k&&byStage[k])byStage[k].push(r); else unstaged.push(r);
  });

  var cols=[];
  /* Unstaged is a real column, not a hidden bucket: after the CRM import every
     record lands here, and a person you cannot see is a person you never work. */
  cols.push({key:"",label:"Unstaged",items:unstaged,muted:true});
  st.forEach(function(s){cols.push({key:s.key,label:s.label,items:byStage[s.key]});});

  board.innerHTML=cols.map(function(c){
    return '<section class="col" data-stage="'+esc(c.key)+'">'+
      '<div class="colhead">'+
        '<span class="cbar" style="background:'+(c.muted?"var(--line)":SIDE_COLOR[SIDE])+'"></span>'+
        '<h3'+(c.muted?' style="color:var(--muted)"':'')+'>'+esc(c.label)+'</h3>'+
        '<span class="cnt">'+c.items.length+'</span>'+
      '</div>'+
      '<div class="colbody">'+
        (c.items.length?c.items.map(cardHtml).join("")
          :'<div class="colempty">'+(c.muted?"Everyone is staged":"Drop someone here")+'</div>')+
      '</div>'+
    '</section>';
  }).join("");

  var onSide=RECORDS.filter(function(r){return (r.sides||[]).indexOf(SIDE)>=0;});
  var total=onSide.length;
  /* Say plainly how many are hidden for having no phone or email, rather than
     letting the total quietly shrink. */
  var hidden=FILTER.contactable?onSide.filter(function(r){return !contactable(r);}).length:0;
  document.getElementById("countLine").innerHTML=
    '<b>'+list.length+'</b> of '+total+' '+(SIDE==="buyer"?"buyers":"sellers")+
    (hidden?' · <span title="No phone or email on file">'+hidden+' hidden with no contact info</span>':'')+
    (RECORDS.length!==total?' · '+RECORDS.length+' total in tracker':'');

  var none=RECORDS.length===0;
  document.getElementById("empty").style.display=none?"flex":"none";
  document.getElementById("boardWrap").style.display=none?"none":"flex";

  if(SELECTING)updateBulkBar();
  bindCards();
  syncScrollbar();
}

/**
 * Combined view: BUYERS and SELLERS side by side, one page.
 *
 * Not a kanban, deliberately. The stage-column board only works for one side
 * at a time because the two pipelines have different stage lists — laying both
 * out as columns would need two incompatible column sets on one screen. Here
 * the stage becomes a FILTER (the chip row) instead of the layout, which is
 * what makes "show me everyone under contract, both sides" a single click.
 *
 * Consequence worth knowing: there are no stage columns to drag into, so
 * staging by drag is off in this view. The card still opens the drawer, and
 * select-mode bulk staging still works, so nothing is actually lost.
 */
function renderCombined(){
  var board=document.getElementById("board");
  var list=visible();
  var cols=[
    {side:"buyer",  label:"BUYERS",  items:list.filter(function(r){return (r.sides||[]).indexOf("buyer")>=0;})},
    {side:"seller", label:"SELLERS", items:list.filter(function(r){return (r.sides||[]).indexOf("seller")>=0;})}
  ];

  board.innerHTML=cols.map(function(c){
    return '<section class="col col-wide nodrop" data-side="'+esc(c.side)+'">'+
      '<div class="colhead">'+
        '<span class="cbar" style="background:'+SIDE_COLOR[c.side]+'"></span>'+
        '<h3>'+esc(c.label)+'</h3>'+
        '<span class="cnt">'+c.items.length+'</span>'+
      '</div>'+
      '<div class="colbody">'+
        (c.items.length?c.items.map(function(r){return cardHtml(r,c.side);}).join("")
          :'<div class="colempty">Nothing matches these filters</div>')+
      '</div>'+
    '</section>';
  }).join("");

  var totalBuyers=RECORDS.filter(function(r){return (r.sides||[]).indexOf("buyer")>=0;}).length;
  var totalSellers=RECORDS.filter(function(r){return (r.sides||[]).indexOf("seller")>=0;}).length;
  var hidden=FILTER.contactable
    ? RECORDS.filter(function(r){return (r.sides||[]).length && !contactable(r);}).length : 0;
  document.getElementById("countLine").innerHTML=

    '<b>'+cols[1].items.length+'</b> of '+totalSellers+' sellers'+
    (hidden?' · <span title="No phone or email on file">'+hidden+' hidden with no contact info</span>':'');

  var none=RECORDS.length===0;
  document.getElementById("empty").style.display=none?"flex":"none";
  document.getElementById("boardWrap").style.display=none?"none":"flex";

  if(SELECTING)updateBulkBar();

/* ================= drag between stages ================= */
var dragId=null;
function bindCards(){
  document.querySelectorAll(".rec").forEach(function(el){
    var id=el.getAttribute("data-id");
    el.onclick=function(e){
      /* In select mode a card click toggles selection instead of opening the
         drawer — the whole point is picking many people without a detour
         through each one's detail view. */
      if(SELECTING){ if(e.target.tagName!=="INPUT") toggleSelect(id); return; }
      openDrawer(id);
    };
    el.ondragstart=function(e){
      if(SELECTING){e.preventDefault();return;}
      dragId=id;el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",dragId);}catch(_){}};
    el.ondragend=function(){el.classList.remove("dragging");dragId=null;
      document.querySelectorAll(".col.drop").forEach(function(c){c.classList.remove("drop");});};
  });
  document.querySelectorAll("[data-selid]").forEach(function(cb){
    cb.onclick=function(e){e.stopPropagation();toggleSelect(cb.getAttribute("data-selid"));};
  });
  document.querySelectorAll(".col").forEach(function(col){
    /* The combined view's columns are pipelines, not stages. Dropping a card
       there would have no stage to move it to, so it must not even look like a
       target — a highlight that does nothing is worse than no highlight. */
    if(col.classList.contains("nodrop")) return;
    col.ondragover=function(e){if(!dragId)return;e.preventDefault();e.dataTransfer.dropEffect="move";col.classList.add("drop");};
    col.ondragleave=function(){col.classList.remove("drop");};
    col.ondrop=function(e){
      e.preventDefault();col.classList.remove("drop");
      var id=dragId||e.dataTransfer.getData("text/plain");
      if(!id)return;
      moveStage(id,col.getAttribute("data-stage")||null);
    };
  });
}

function moveStage(id,stageKey){
  var rec=RECORDS.find(function(r){return r.id===id;});
  if(!rec)return;
  if(stageOf(rec,SIDE)===(stageKey||null))return;
  var meta={};
  /* The spec asks for a timeline date at Qualified (buyers) / CMA Requested
     (sellers). Ask once, on entry, rather than burying it in the drawer. */
  if(stageKey===TIMELINE_STAGE[SIDE]){
    var prev=(rec.stageMeta&&rec.stageMeta[SIDE+":"+stageKey]&&rec.stageMeta[SIDE+":"+stageKey].timelineDate)||"";
    var ans=prompt("Timeline for "+rec.name+" — when are they looking to "+
      (SIDE==="buyer"?"buy":"list")+"? (YYYY-MM-DD, or leave blank)",prev);
    if(ans===null)return;                       // cancelled: leave the card put
    if(ans.trim())meta.timelineDate=ans.trim();
  }
  api("/api/tracker/records/"+encodeURIComponent(id)+"/stage",
      jsonReq("POST",{side:SIDE,stage:stageKey,meta:meta}))
    .then(function(j){
      replaceRecord(j.record);
      renderBoard();
      if(CUR&&CUR.id===id){CUR=j.record;paintDrawer();}
      toast(rec.name+" → "+(stageKey?stageLabel(SIDE,stageKey):"Unstaged"));
    })
    .catch(function(e){toast("Could not move: "+e.message);});
}

function replaceRecord(rec){
  var i=RECORDS.findIndex(function(r){return r.id===rec.id;});
  if(i>=0)RECORDS[i]=rec; else RECORDS.push(rec);
}

/* ================= synthetic horizontal scrollbar =================
   Native overlay bars fade out and are unverifiable in a headless pass, so the
   board drives a visible one of its own. */
function syncScrollbar(){
  var b=document.getElementById("board"), bar=document.getElementById("boardScroll"),
      th=document.getElementById("boardThumb");
  var need=b.scrollWidth>b.clientWidth+2;
  bar.classList.toggle("on",need);
  if(!need)return;
  var ratio=b.clientWidth/b.scrollWidth;
  var w=Math.max(40,bar.clientWidth*ratio);
  th.style.width=w+"px";
  var maxLeft=bar.clientWidth-w, maxScroll=b.scrollWidth-b.clientWidth;
  th.style.left=(maxScroll?(b.scrollLeft/maxScroll)*maxLeft:0)+"px";
}
(function bindScrollbar(){
  var b=document.getElementById("board"), bar=document.getElementById("boardScroll"),
      th=document.getElementById("boardThumb");
  b.addEventListener("scroll",syncScrollbar);
  window.addEventListener("resize",syncScrollbar);
  var drag=false,startX=0,startLeft=0;
  th.addEventListener("mousedown",function(e){drag=true;startX=e.clientX;
    startLeft=parseFloat(th.style.left||"0");th.classList.add("drag");e.preventDefault();});
  document.addEventListener("mousemove",function(e){
    if(!drag)return;
    var maxLeft=bar.clientWidth-th.offsetWidth, maxScroll=b.scrollWidth-b.clientWidth;
    var left=Math.max(0,Math.min(maxLeft,startLeft+(e.clientX-startX)));
    th.style.left=left+"px";
    b.scrollLeft=maxLeft?(left/maxLeft)*maxScroll:0;
  });
  document.addEventListener("mouseup",function(){drag=false;th.classList.remove("drag");});
  bar.addEventListener("mousedown",function(e){
    if(e.target===th)return;
    var maxLeft=bar.clientWidth-th.offsetWidth, maxScroll=b.scrollWidth-b.clientWidth;
    var left=Math.max(0,Math.min(maxLeft,e.offsetX-th.offsetWidth/2));
    th.style.left=left+"px";
    b.scrollLeft=maxLeft?(left/maxLeft)*maxScroll:0;
  });
})();

/**
 * Stage chips — the same interaction as the status row, multi-select.
 *
 * Rebuilt whenever the side changes, because the vocabulary changes with it.
 * Any selected stage that doesn't exist on the new side is dropped rather than
 * left silently filtering: a sticky "Pre-Approved" while looking at sellers
 * would show an empty board with no visible cause.
 */
function paintStageChips(){
  var wrap=document.getElementById("stageChips");
  /* The funnel already IS the stage breakdown — a stage filter on top of it
     would collapse every bar to one row and read as a broken chart. */
  var row=wrap.parentElement;
  var lbl=wrap.previousElementSibling;
  if(SIDE==="funnel"){ wrap.innerHTML=""; wrap.style.display="none"; if(lbl&&lbl.className==="flabel")lbl.style.display="none"; return; }
  wrap.style.display=""; if(lbl&&lbl.className==="flabel")lbl.style.display="";
  var opts=stageOptions();
  var valid={__unstaged:true};
  opts.forEach(function(o){valid[o.key]=true;});
  Object.keys(FILTER.stage).forEach(function(k){ if(!valid[k]) delete FILTER.stage[k]; });

  var counts=stageCounts();
  var chip=function(key,label,marker,color){
    var on=!!FILTER.stage[key];
    var n=counts[key]||0;
    /* Counts matter more here than on the status row. The book is barely
       staged — in live data 18 of the 21 stages hold nobody — so without a
       number every one of those chips is a dead end you only discover by
       clicking it. Empty chips stay visible (a stage that exists but is unused
       is real information) but are dimmed so the eye skips them. */
    return '<button class="chip'+(on?" on":"")+(n?"":" empty")+'" data-stg="'+esc(key)+'"'+
      (on?' style="background:'+color+'"':'')+
      ' title="'+esc(label)+' — '+n+' '+(n===1?"person":"people")+'">'+
      '<span class="cdot" style="background:'+(on?"rgba(255,255,255,.85)":color)+'"></span>'+
      esc(label)+(marker?' <span style="opacity:.6;font-size:9px;font-weight:800">'+marker+'</span>':'')+
      ' <span class="chipn">'+n+'</span>'+
      '</button>';
  };

  var html=chip("__unstaged","Unstaged","", "#94A3B8");
  html+=opts.map(function(o){
    var b=!!o.sides.buyer, s=!!o.sides.seller;
    /* Only mark a stage when the board could show both vocabularies and this
       one belongs to just one of them. */
    var marker=(SIDE==="both"&&!(b&&s))?(b?"B":"S"):"";
    var color=(b&&s)?"#0891B2":(b?SIDE_COLOR.buyer:SIDE_COLOR.seller);
    if(SIDE!=="both") color=SIDE_COLOR[SIDE];
    return chip(o.key,o.label,marker,color);
  }).join("");
  wrap.innerHTML=html;

  wrap.querySelectorAll("[data-stg]").forEach(function(b){
    b.onclick=function(){
      var k=b.getAttribute("data-stg");
      FILTER.stage[k]=!FILTER.stage[k];
      paintStageChips();renderBoard();
    };
  });
}

/* Sources arrive from several intake paths with inconsistent casing ("instagram"

var SOURCE_LABELS={instagram:"Instagram",tiktok:"TikTok",facebook:"Facebook",zillow:"Zillow",

/* ================= bulk select + stage ================= */
function toggleSelect(id){
  if(SELECTED[id])delete SELECTED[id]; else SELECTED[id]=true;
  var el=document.querySelector('.rec[data-id="'+CSS.escape(id)+'"]');
  if(el){
    el.classList.toggle("picked",!!SELECTED[id]);
    var cb=el.querySelector("[data-selid]"); if(cb)cb.checked=!!SELECTED[id];
  }
  updateBulkBar();
}
function clearSelection(){SELECTED={};updateBulkBar();
  document.querySelectorAll(".rec.picked").forEach(function(e){e.classList.remove("picked");});
  document.querySelectorAll("[data-selid]").forEach(function(cb){cb.checked=false;});}
function selectedIds(){return Object.keys(SELECTED);}
function updateBulkBar(){
  var n=selectedIds().length;
  document.getElementById("bulkCount").textContent=n+" selected";
  var sel=document.getElementById("bulkStageSel");
  document.getElementById("bulkApplyBtn").disabled=!(n>0 && sel.selectedIndex>0);
}
function paintBulkStageOptions(){
  var sel=document.getElementById("bulkStageSel");
  /* In Both view the two vocabularies are merged, so an option has to carry
     which side(s) it belongs to — the server only understands "buyer" or
     "seller" and defaults anything else to buyer, which would quietly stage a
     seller on their buyer pipeline. */
  var opts=(oneSide()?stageOptions():mergedStages()).map(function(s){
    return '<option value="'+esc(s.key)+'" data-sides="'+Object.keys(s.sides).join(",")+'">'+esc(s.label)+'</option>';
  }).join("");

    '<option value="" data-sides="buyer,seller">— Unstaged —</option>'+opts;

  visible().forEach(function(r){SELECTED[r.id]=true;});
  renderBoard();updateBulkBar();
};
document.getElementById("bulkStageSel").onchange=updateBulkBar;
document.getElementById("bulkApplyBtn").onclick=function(){
  var ids=selectedIds();
  var sel=document.getElementById("bulkStageSel");
  if(!ids.length||sel.selectedIndex<=0)return;
  var stage=sel.value;
  var opt=sel.options[sel.selectedIndex];
  var label=opt.textContent;
  /* Split the selection by pipeline and send one request per side, so a
     seller is staged as a seller even when the chip came from a merged list.
     A record on both pipelines and a stage that exists on both moves on both,
     which is what the shared chip already means everywhere else. */
  var sides=(opt.getAttribute("data-sides")||"buyer").split(",").filter(Boolean);
  var byId={}; RECORDS.forEach(function(r){byId[r.id]=r;});
  var batches=sides.map(function(side){
    return {side:side, ids:ids.filter(function(id){
      var r=byId[id]; return r && (r.sides||[]).indexOf(side)>=0;
    })};
  }).filter(function(b){return b.ids.length;});
  if(!batches.length){toast("Nobody selected is on that pipeline.");return;}

  var btn=this;btn.disabled=true;var was=btn.textContent;btn.textContent="Moving…";
  Promise.all(batches.map(function(b){
    return api("/api/tracker/records/bulk-stage",jsonReq("POST",{ids:b.ids,side:b.side,stage:stage||null}));
  }))
    .then(function(rs){
      var moved=rs.reduce(function(n,j){return n+(j.moved||0);},0);
      var nf=rs.reduce(function(n,j){return n+(j.notFound||0);},0);
      toast("Moved "+moved+" to "+label+(nf?(" ("+nf+" not found)"):""));
      clearSelection();
      return load(false);
    })
    .catch(function(e){toast("Bulk move failed: "+e.message);})
    .then(function(){btn.disabled=false;btn.textContent=was;});
};
document.getElementById("bulkEngageBtn").onclick=function(){
  var btn=this;btn.disabled=true;var was=btn.textContent;btn.textContent="Checking…";
  api("/api/tracker/stage-from-engagement",jsonReq("POST",{}))
    .then(function(plan){
      if(!plan.changes.length){
        toast("Nothing to stage — every record with a real conversation is already staged.");
        return null;
      }
      var people={};
      plan.changes.forEach(function(c){people[c.recordId]=true;});
      var n=Object.keys(people).length;
      var msg="Move "+n+" "+(n===1?"person":"people")+" from Unstaged to Contacted?\n\n"+
        "Only people who actually exchanged messages with the DM agent — a phone or "+
        "criteria was collected, or a property breakdown was sent. Nothing past Contacted is "+
        "ever guessed; anything further needs a real call.\n\n"+
        "This never touches a stage you've already set by hand.";
      if(!confirm(msg))return null;
      return api("/api/tracker/stage-from-engagement",jsonReq("POST",{apply:true}));
    })
    .then(function(result){
      if(!result)return;
      var people={};
      result.changes.forEach(function(c){people[c.recordId]=true;});
      toast("Staged "+Object.keys(people).length+" people to Contacted from real conversations");
      return load(false);
    })
    .catch(function(e){toast("Could not auto-stage: "+e.message);})
    .then(function(){btn.disabled=false;btn.textContent=was;});
};

     current — the list endpoint reflects completion but not the rest. */

      '<div id="ckList"></div>'+
      '<input id="ckNew" placeholder="Add an item and press Enter…">'+
      '<button class="tbtn" id="ckPushAll">↗ Send unsent items to Task Manager</button>'+
      '<div class="tasknote">Sent items become real tasks on the Task Command board, assigned to '+
        'whoever this person is assigned to. Ticking it here completes the task, and completing '+
        'the task ticks it here.</div>'+
    '</div>'+
    '<div class="sect"><h4>RECORD</h4>'+
      '<div style="font-size:12px;color:var(--muted);line-height:1.7">'+
        'Added '+esc(shortDate(r.addedAt)||"—")+'<br>'+
        'Updated '+esc(shortDate(r.updatedAt)||"—")+
        (r.legacyStage?'<br>Imported from CRM stage <b>'+esc(r.legacyStage)+'</b>':'')+
        (r.leadId?'<br>Linked lead <code>'+esc(r.leadId)+'</code>':'')+
      '</div></div>';
  bindDrawer();
  renderChecklist();
}

function bindDrawer(){
  ["eName","ePhone","eEmail","eAddr","eSource","eAssigned","eNotes","eStatus","eLast"].forEach(function(id){
    var el=document.getElementById(id); if(!el)return;
    el.oninput=function(){DIRTY=true;};
    el.onchange=function(){DIRTY=true;};
  });
  document.querySelectorAll("[data-sidebox]").forEach(function(lab){
    lab.onclick=function(e){
      e.preventDefault();
      var side=lab.getAttribute("data-sidebox");
      var sides=(CUR.sides||[]).slice();
      var i=sides.indexOf(side);
      if(i>=0){
        if(sides.length===1){toast("Someone has to be a buyer or a seller.");return;}
        sides.splice(i,1);
      } else sides.push(side);
      saveSides(sides);
    };
  });
  document.querySelectorAll("[data-rail] [data-stage]").forEach(function(b){
    b.onclick=function(){
      var side=b.closest("[data-rail]").getAttribute("data-rail");
      setStageFor(CUR.id,side,b.getAttribute("data-stage"));
    };
  });
  document.querySelectorAll("[data-clear]").forEach(function(b){
    b.onclick=function(){setStageFor(CUR.id,b.getAttribute("data-clear"),null);};
  });
}

/* Stage moves save on their own — a pipeline move is the single most common
   action here and making it wait behind Save would lose it constantly. */
function setStageFor(id,side,stageKey){
  var rec=RECORDS.find(function(r){return r.id===id;});
  if(!rec)return;
  var meta={};
  if(stageKey===TIMELINE_STAGE[side]){
    var prev=(rec.stageMeta&&rec.stageMeta[side+":"+stageKey]&&rec.stageMeta[side+":"+stageKey].timelineDate)||"";
    var ans=prompt("Timeline for "+rec.name+" — when are they looking to "+
      (side==="buyer"?"buy":"list")+"? (YYYY-MM-DD, or leave blank)",prev);
    if(ans===null)return;
    if(ans.trim())meta.timelineDate=ans.trim();
  }
  api("/api/tracker/records/"+encodeURIComponent(id)+"/stage",
      jsonReq("POST",{side:side,stage:stageKey,meta:meta}))
    .then(function(j){
      replaceRecord(j.record);
      if(CUR&&CUR.id===id){CUR=j.record;paintDrawer();}
      renderBoard();
      toast(stageKey?("Moved to "+stageLabel(side,stageKey)):"Moved to Unstaged");
    })
    .catch(function(e){toast("Could not move: "+e.message);});
}

function saveSides(sides){
  api("/api/tracker/records/"+encodeURIComponent(CUR.id),jsonReq("PATCH",{sides:sides}))
    .then(function(j){
      replaceRecord(j.record);CUR=j.record;paintDrawer();renderBoard();
    })
    .catch(function(e){toast("Could not update: "+e.message);});
}

/* ================= checklist ================= */
function autoGrow(ta){ta.style.height="auto";ta.style.height=Math.max(18,ta.scrollHeight)+"px";}
/* Task Manager wording for a linked item. The task is authoritative once linked,
   so this reflects the task's real state rather than restating the checkbox. */
var TASK_COLUMN_LABEL={urgent:"Urgent",today:"Today",tomorrow:"Tomorrow",this_week:"This Week",this_month:"This Month"};
function taskChip(it){
  if(!it.taskId) return '<button type="button" class="cksend" data-cksend="'+esc(it.id)+'">↗ Task</button>';
  var t=TASKS[it.taskId];
  if(!t) return '<span class="cktask gone" title="The task was deleted in Task Manager">task removed</span>';
  var done=t.status==="done";
  return '<span class="cktask'+(done?" done":"")+'" title="'+
      esc((TASK_COLUMN_LABEL[t.column]||t.column)+(t.assignedTo?" · "+t.assignedTo:""))+'">'+
      (done?"✓ in Tasks":"↗ in Tasks")+'</span>'+
    '<button type="button" class="ckunlink" data-ckunlink="'+esc(it.id)+'" title="Unlink (keeps the task)">⊘</button>';
}
function renderChecklist(){
  var list=document.getElementById("ckList"); if(!list)return;
  list.innerHTML=CK.length?CK.map(function(it,i){
    return '<div class="ckitem'+(it.done?" done":"")+'">'+
      '<input type="checkbox" data-ck="'+i+'"'+(it.done?" checked":"")+'>'+
      '<textarea class="cktext" data-cktext="'+i+'" rows="1">'+esc(it.text)+'</textarea>'+
      taskChip(it)+
      '<button type="button" class="ckdel" data-ckdel="'+i+'" title="Remove">✕</button>'+
    '</div>';
  }).join(""):'<div class="ckempty">No items yet.</div>';
  list.querySelectorAll("[data-cksend]").forEach(function(b){
    b.onclick=function(){pushItems([b.getAttribute("data-cksend")]);};
  });
  list.querySelectorAll("[data-ckunlink]").forEach(function(b){
    b.onclick=function(){unlinkItem(b.getAttribute("data-ckunlink"));};
  });
  var all=document.getElementById("ckPushAll");
  if(all){
    var unsent=CK.filter(function(i){return !i.taskId&&i.text.trim();}).length;
    all.style.display=unsent?"flex":"none";
    all.textContent="↗ Send "+unsent+" item"+(unsent===1?"":"s")+" to Task Manager";
    all.onclick=function(){pushItems(null);};
  }
  var done=CK.filter(function(i){return i.done;}).length;
  var c=document.getElementById("ckCount");
  if(c)c.textContent=CK.length?(done+"/"+CK.length+" done"):"";
  list.querySelectorAll("[data-ck]").forEach(function(cb){
    cb.onchange=function(){CK[+cb.getAttribute("data-ck")].done=cb.checked;DIRTY=true;renderChecklist();};
  });
  list.querySelectorAll("[data-ckdel]").forEach(function(b){
    b.onclick=function(){CK.splice(+b.getAttribute("data-ckdel"),1);DIRTY=true;renderChecklist();};
  });
  list.querySelectorAll("[data-cktext]").forEach(function(ta){
    autoGrow(ta);
    ta.oninput=function(){CK[+ta.getAttribute("data-cktext")].text=ta.value;DIRTY=true;autoGrow(ta);};
    ta.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();ta.blur();
      document.getElementById("ckNew").focus();}};
  });
  var n=document.getElementById("ckNew");
  if(n)n.onkeydown=function(e){
    if(e.key!=="Enter")return;
    e.preventDefault();
    var v=n.value.trim(); if(!v)return;
    CK.push({id:uid("ck"),text:v,done:false});
    n.value="";DIRTY=true;renderChecklist();
    document.getElementById("ckNew").focus();
  };
}

/* ================= Task Manager link =================
   The server pushes from the STORED checklist, so anything typed and not yet
   saved has to land first — otherwise "send" would quietly skip the item the
   user just added, which is exactly when they would use it. */
function pushItems(itemIds){
  if(!CUR)return;
  var clean=CK.filter(function(i){return i.text.trim();});
  api("/api/tracker/records/"+encodeURIComponent(CUR.id),jsonReq("PATCH",{checklist:clean}))
    .then(function(){
      return api("/api/tracker/records/"+encodeURIComponent(CUR.id)+"/tasks",
        jsonReq("POST",itemIds?{itemIds:itemIds}:{}));
    })
    .then(function(j){
      replaceRecord(j.record);
      adoptRecord(j.record,j.tasks||{});
      DIRTY=false;
      paintDrawer();renderBoard();
      toast(j.created
        ? ("Sent "+j.created+" to Task Manager"+(j.alreadyLinked?" ("+j.alreadyLinked+" already there)":""))
        : "Nothing new to send");
    })
    .catch(function(e){toast("Could not send: "+e.message);});
}
function unlinkItem(itemId){
  if(!CUR)return;
  api("/api/tracker/records/"+encodeURIComponent(CUR.id)+"/tasks/"+encodeURIComponent(itemId),
      {method:"DELETE"})
    .then(function(j){
      replaceRecord(j.record);
      adoptRecord(j.record,j.tasks||{});
      paintDrawer();renderBoard();
      toast("Unlinked — the task is still on the board");
    })
    .catch(function(e){toast("Could not unlink: "+e.message);});
}

/* ================= save / delete ================= */
document.getElementById("dSave").onclick=function(){
  if(!CUR)return;
  var name=document.getElementById("eName").value.trim();
  if(!name){toast("A name is required.");return;}
  var last=document.getElementById("eLast").value;
  var payload={
    name:name,
    phone:document.getElementById("ePhone").value.trim(),
    email:document.getElementById("eEmail").value.trim(),
    address:document.getElementById("eAddr").value.trim(),
    source:document.getElementById("eSource").value.trim(),
    assignedTo:document.getElementById("eAssigned").value.trim(),
    status:document.getElementById("eStatus").value,
    notes:document.getElementById("eNotes").value,
    checklist:CK.filter(function(i){return i.text.trim();}),
    lastInteractionAt: last?new Date(last+"T12:00:00").toISOString():""
  };
  api("/api/tracker/records/"+encodeURIComponent(CUR.id),jsonReq("PATCH",payload))
    .then(function(j){
      replaceRecord(j.record);adoptRecord(j.record,j.tasks||{});DIRTY=false;
      paintSelectFilters();renderBoard();renderChecklist();
      if(j.tasksUpdated)toast(j.tasksUpdated+" task"+(j.tasksUpdated===1?"":"s")+" updated in Task Manager");
      var s=document.getElementById("dSaved");
      s.textContent="Saved";setTimeout(function(){s.textContent="";},1800);
    })
    .catch(function(e){toast("Save failed: "+e.message);});
};

document.getElementById("dDelete").onclick=function(){
  if(!CUR)return;
  if(!confirm("Delete "+CUR.name+" from the tracker? This does not touch their CRM lead."))return;
  var id=CUR.id;
  api("/api/tracker/records/"+encodeURIComponent(id),{method:"DELETE"})
    .then(function(){
      RECORDS=RECORDS.filter(function(r){return r.id!==id;});
      DIRTY=false;closeDrawer();paintSelectFilters();renderBoard();toast("Deleted");
    })
    .catch(function(e){toast("Delete failed: "+e.message);});
};

/* ================= add ================= */
document.getElementById("addBtn").onclick=function(){
  /* Both and Funnel are views, not pipelines. sides:["both"] would create
     someone who shows up in neither column, so ask which one they are. */
  var side=oneSide();
  if(!side){
    var a=prompt("Is this a buyer or a seller? (type buyer or seller)","buyer");
    if(a===null)return;
    a=String(a).trim().toLowerCase();
    side = /^b/.test(a) ? "buyer" : /^s/.test(a) ? "seller" : null;
    if(!side){toast("Type buyer or seller.");return;}
  }
  var name=prompt("Name of the "+side+"?");
  if(name===null)return;
  name=name.trim();
  if(!name){toast("A name is required.");return;}
  api("/api/tracker/records",jsonReq("POST",{name:name,sides:[side],status:"new"}))
    .then(function(j){
      RECORDS.push(j.record);
      paintSelectFilters();renderBoard();
      openDrawer(j.record.id);
      toast("Added — fill in the rest here.");
    })
    .catch(function(e){toast("Could not add: "+e.message);});
};

/* ================= boot ================= */
function load(announce){
  return Promise.all([api("/api/tracker/schema"),api("/api/tracker/records")])
    .then(function(res){
      SCHEMA={statuses:res[0].statuses||[],buyerStages:res[0].buyerStages||[],sellerStages:res[0].sellerStages||[]};
      RECORDS=res[1].records||[];
      paintStatusChips();paintStageChips();paintContactChip();paintSelectFilters();paintBulkStageOptions();renderBoard();
      if(announce)toast("Refreshed — "+RECORDS.length+" in tracker");
    })
    .catch(function(e){
      document.getElementById("empty").style.display="flex";
      document.getElementById("boardWrap").style.display="none";
      document.getElementById("emptyMsg").textContent="Could not load the tracker: "+e.message;
    });
}
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&document.getElementById("drawer").classList.contains("on"))closeDrawer();
});
load(false);
</script>
