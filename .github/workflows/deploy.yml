name: Deploy marco-90-automation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Buildx enables the cross-run layer cache below. Without it every deploy
      # reinstalled torch + mediapipe + whisper from scratch (~5 min) even for a
      # one-line source change.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Build on the runner and push to Fly's registry WITH a GitHub Actions
      # layer cache that persists between runs. Combined with the Dockerfile's
      # deps-before-source ordering, a source-only deploy reuses every heavy
      # dependency layer and only rebuilds the cheap tail. Fly's --remote-only
      # builder is intentionally avoided (it was repeatedly crashing mid-build:
      # failed to list workers / rpc EOF).
      - name: Build & push image (cross-run layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.fly.io/marco-90-automation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy prebuilt image to Fly
        run: flyctl deploy --image registry.fly.io/marco-90-automation:${{ github.sha }} -c fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Post-deploy truth check: list every machine and the image it actually
      # runs. Exists because a deploy once reported success while production
      # kept serving an old image (stale machine) — this makes that visible.
      - name: Verify machine images
        if: always()
        run: |
          echo "===== fly status ====="
          flyctl status -a marco-90-automation || true
          echo "===== machines (id / state / region / image) ====="
          flyctl machines list -a marco-90-automation --json | python3 -c "import json,sys; [print(m['id'], m['state'], m['region'], m.get('config',{}).get('image','?')) for m in json.load(sys.stdin)]" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
