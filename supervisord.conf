[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

[program:nodejs]
command=node /app/dist/src/server.js
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3000"

[program:openshorts]
command=python3 app_marco.py
directory=/app/services/openshorts
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/tmp/openshorts.log
stderr_logfile=/tmp/openshorts_err.log
environment=GEMINI_API_KEY="%(ENV_GEMINI_API_KEY)s",CLIPS_OUTPUT_DIR="/data/clips",UPLOADS_INPUT_DIR="/data/uploads/videos",OPENSHORTS_PORT="8000"
