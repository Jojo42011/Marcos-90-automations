<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analytics — Marco Puga Realty</title>
<style>
  :root{
    --accent:#59c4c4; --accent-2:#4ca7a7; --soft:#eef8f8;
    --line:#e8edee; --text:#1f2b30; --muted:#6b7a82; --bg:#f7fafa;
    --ok:#0f9d76; --warn:#b45309; --bad:#c0616a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:22px 26px 40px}
  h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .head .grow{flex:1;min-width:220px}
  button.refresh{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
  button.refresh:hover{border-color:var(--accent)}
  button.refresh[disabled]{opacity:.55;cursor:default}

  /* Tabs: one per platform, plus the combined roll-up. */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tab{position:relative;display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid transparent;border-bottom:none;
       border-radius:9px 9px 0 0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;background:transparent;bottom:-1px}
  .tab:hover{color:var(--text);background:#fff}
  .tab.active{color:var(--text);background:#fff;border-color:var(--line);border-bottom:1px solid #fff}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:#cbd5d5;flex:0 0 auto}
  .tab .dot.live{background:var(--ok)} .tab .dot.warn{background:var(--warn)} .tab .dot.bad{background:var(--bad)}

  .banner{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-bottom:16px;border:1px solid}
  .banner.info{background:var(--soft);border-color:rgba(89,196,196,.35);color:#215b5b}
  .banner.warn{background:#fffbeb;border-color:rgba(180,83,9,.25);color:#8a4b09}
  .banner.bad{background:#fef2f2;border-color:rgba(192,97,106,.3);color:#8f3a41}
  .banner b{font-weight:700}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 15px}
  .card .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .card .v{font-size:25px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
  .card .v.none{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
  .card .n{font-size:11px;color:var(--muted);margin-top:4px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px 17px;margin-bottom:16px}
  .panel h2{font-size:13px;font-weight:700;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #f2f5f5;font-size:13px}
  .row:last-child{border-bottom:none}
  .row .lbl{color:var(--muted)}
  .row .val{font-weight:600;text-align:right}
  .mix{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#f0f3f3;margin:10px 0 8px}
  .mix i{display:block;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
  a.top{color:#0f766e;text-decoration:none;font-weight:600}
  a.top:hover{text-decoration:underline}
  .empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .empty .big{font-size:14px;font-weight:600;color:var(--text);margin-bottom:6px}
  .src{font-size:11px;color:var(--muted);margin-top:12px}
  .cover{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .chip.in{border-color:rgba(15,157,118,.35);color:#0f6f56;background:#f0fbf7}
</style>
</head>
<body>

<div class="head">
  <div class="grow">
    <h1>Analytics</h1>
    <div class="sub" id="sub">Loading…</div>
  </div>
  <button class="refresh" id="refresh">Refresh</button>
</div>

<div class="tabs" id="tabs"></div>
<div id="view"><div class="empty">Loading analytics…</div></div>

<script>
"use strict";

var DATA = null;
var CURRENT = "all";

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

/* null and 0 are different answers and must never render the same: null is
   "no source for this", 0 is "measured, and it's zero". */
function num(v){
  if (v == null) return null;
  if (Math.abs(v) >= 1000000) return (v/1000000).toFixed(v >= 10000000 ? 0 : 1).replace(/\.0$/,"") + "M";
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/,"") + "K";
  return String(v);
}
function full(v){ return v == null ? "—" : v.toLocaleString(); }

function ago(iso){
  if (!iso) return "never";
  var ms = Date.now() - Date.parse(iso);
  if (!isFinite(ms)) return "unknown";
  var m = Math.round(ms/60000);
  if (m < 60) return m + "m ago";
  var h = Math.round(m/60);
  if (h < 48) return h + "h ago";
  return Math.round(h/24) + "d ago";
}

function dotClass(p){
  if (p.status === "live") return p.stale ? "warn" : "live";
  if (p.status === "error" || p.status === "unreadable") return "bad";
  return "";
}

function card(k, v, note, suffix){
  var shown = num(v);
  return '<div class="card"><div class="k">' + esc(k) + '</div>' +
    (shown === null
      ? '<div class="v none">No data</div>'
      : '<div class="v" title="' + esc(full(v)) + '">' + esc(shown) + esc(suffix || "") + '</div>') +
    (note ? '<div class="n">' + esc(note) + '</div>' : '') + '</div>';
}

/* Captions on listing posts run to hundreds of characters with hashtags. Shown
   whole they push every other row off the panel, so the number the operator
   came for stops being the first thing they see. */
function shortCaption(s){
  var t = String(s || "").replace(/\s+/g, " ").trim();
  return t.length > 150 ? t.slice(0, 150) + "…" : t;
}

function statusBanner(p){
  if (p.status === "live" && p.stale) {
    return '<div class="banner warn"><b>These numbers are stale.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "error") {
    return '<div class="banner bad"><b>Couldn\'t load this platform.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "unreadable") {
    return '<div class="banner bad"><b>Zernio replied, but the response couldn\'t be read.</b> ' + esc(p.note || "") + '</div>';
  }
  if (p.status === "not_connected") {
    return '<div class="banner info"><b>Not connected yet.</b> ' + esc(p.note || "") + '</div>';
  }
  return "";
}

function mixBar(mix){
  if (!mix) return "";
  var total = (mix.viral||0)+(mix.hot||0)+(mix.average||0)+(mix.cold||0);
  if (!total) return "";
  var seg = [
    ["Viral", mix.viral||0, "#7c3aed"],
    ["Hot", mix.hot||0, "#0f9d76"],
    ["Average", mix.average||0, "#59c4c4"],
    ["Cold", mix.cold||0, "#cbd5d5"]
  ];
  return '<div class="panel"><h2>Post performance mix</h2>' +
    '<div class="mix">' + seg.map(function(s){
      return '<i style="width:' + ((s[1]/total)*100).toFixed(2) + '%;background:' + s[2] + '"></i>';
    }).join("") + '</div>' +
    '<div class="legend">' + seg.map(function(s){
      return '<span><b style="background:' + s[2] + '"></b>' + s[0] + ' · ' + s[1] + '</span>';
    }).join("") + '</div></div>';
}

function metricsBody(p){
  var html = statusBanner(p);

  if (p.status !== "live") {
    html += '<div class="panel"><div class="empty">' +
      '<div class="big">Nothing to show for ' + esc(p.label) + ' yet</div>' +
      esc(p.note || "No data source is connected for this platform.") +
      '</div></div>';
    return html;
  }

  html += '<div class="cards">' +
    card("Followers", p.followers) +
    card("Posts", p.posts) +
    card("Views", p.views) +
    card("Likes", p.likes) +
    card("Comments", p.comments) +
    card("Shares", p.shares) +
    card("Avg views / post", p.avgViews) +
    card("Engagement rate", p.engagementRate, p.engagementRate == null ? null : "of views interacted", "%") +
  '</div>';

  html += '<div class="panel"><h2>Detail</h2>' +
    '<div class="row"><span class="lbl">Views</span><span class="val">' + full(p.views) + '</span></div>' +
    '<div class="row"><span class="lbl">Likes</span><span class="val">' + full(p.likes) + '</span></div>' +
    '<div class="row"><span class="lbl">Comments</span><span class="val">' + full(p.comments) + '</span></div>' +
    '<div class="row"><span class="lbl">Shares</span><span class="val">' + full(p.shares) + '</span></div>' +
    '<div class="row"><span class="lbl">Engagement rate</span><span class="val">' +
      (p.engagementRate == null ? "—" : p.engagementRate + "%") + '</span></div>' +
    '<div class="src">Source: ' + esc(p.source || "unknown") + ' · updated ' + esc(ago(p.lastUpdated)) + '</div>' +
  '</div>';

  if (p.topPost && (p.topPost.url || p.topPost.caption)) {
    html += '<div class="panel"><h2>Top post</h2>' +
      '<div class="row"><span class="lbl">Views</span><span class="val">' + full(p.topPost.views) + '</span></div>' +
      (p.topPost.caption ? '<div class="row"><span class="lbl">Caption</span><span class="val">' + esc(shortCaption(p.topPost.caption)) + '</span></div>' : '') +
      (p.topPost.url ? '<div class="row"><span class="lbl">Link</span><span class="val"><a class="top" target="_blank" rel="noopener" href="' + esc(p.topPost.url) + '">Open</a></span></div>' : '') +
      (p.topPost.platform ? '<div class="row"><span class="lbl">Platform</span><span class="val">' + esc(p.topPost.platform) + '</span></div>' : '') +
    '</div>';
  }

  html += mixBar(p.mix);
  return html;
}

function combinedBody(c){
  var html = "";

  /* The combined tab is the easiest place to mislead: a total that quietly
     leaves out three platforms still reads as "everything". Say what it
     covers, every time, before any number. */
  if (c.included && c.included.length) {
    html += '<div class="banner ' + (c.excluded && c.excluded.length ? "warn" : "info") + '">' +
      '<b>These totals cover ' + esc(c.included.join(", ")) + '.</b>' +
      (c.excluded && c.excluded.length
        ? ' Not included: ' + esc(c.excluded.map(function(e){ return e.label; }).join(", ")) +
          ' — no data source connected yet.'
        : '') +
      '</div>';
  } else {
    html += '<div class="banner info"><b>No platform is reporting yet.</b> ' + esc(c.note || "") + '</div>';
  }

  html += '<div class="cover">' +
    (c.included || []).map(function(l){ return '<span class="chip in">' + esc(l) + ' · counted</span>'; }).join("") +
    (c.excluded || []).map(function(e){ return '<span class="chip">' + esc(e.label) + ' · not counted</span>'; }).join("") +
  '</div>';

  if (!c.included || !c.included.length) return html;

  html += '<div style="height:14px"></div>';
  html += '<div class="cards">' +
    card("Followers", c.followers) +
    card("Posts", c.posts) +
    card("Views", c.views) +
    card("Likes", c.likes) +
    card("Comments", c.comments) +
    card("Shares", c.shares) +
    card("Avg views / post", c.avgViews) +
    card("Engagement rate", c.engagementRate, c.engagementRate == null ? null : "of views interacted", "%") +
  '</div>';

  html += '<div class="panel"><h2>Per platform</h2>' +
    DATA.platforms.map(function(p){
      return '<div class="row"><span class="lbl">' + esc(p.label) + '</span><span class="val">' +
        (p.status === "live" ? full(p.views) + ' views' : '<span style="color:var(--muted);font-weight:500">' +
          (p.status === "not_connected" ? "not connected" : p.status) + '</span>') +
      '</span></div>';
    }).join("") +
    '<div class="src">Oldest data in this roll-up: ' + esc(ago(c.lastUpdated)) + '</div>' +
  '</div>';

  if (c.topPost && (c.topPost.url || c.topPost.caption)) {
    html += '<div class="panel"><h2>Best performing post, any platform</h2>' +
      '<div class="row"><span class="lbl">Platform</span><span class="val">' + esc(c.topPost.platform || "—") + '</span></div>' +
      '<div class="row"><span class="lbl">Views</span><span class="val">' + full(c.topPost.views) + '</span></div>' +
      (c.topPost.caption ? '<div class="row"><span class="lbl">Caption</span><span class="val">' + esc(shortCaption(c.topPost.caption)) + '</span></div>' : '') +
      (c.topPost.url ? '<div class="row"><span class="lbl">Link</span><span class="val"><a class="top" target="_blank" rel="noopener" href="' + esc(c.topPost.url) + '">Open</a></span></div>' : '') +
    '</div>';
  }

  return html;
}

function render(){
  if (!DATA) return;

  var tabs = [{ id:"all", label: DATA.combined.label, status: DATA.combined.status, stale: DATA.combined.stale }]
    .concat(DATA.platforms.map(function(p){ return { id:p.id, label:p.label, status:p.status, stale:p.stale }; }));

  document.getElementById("tabs").innerHTML = tabs.map(function(t){
    return '<button class="tab' + (t.id === CURRENT ? " active" : "") + '" data-id="' + esc(t.id) + '">' +
      '<span class="dot ' + dotClass(t) + '"></span>' + esc(t.label) + '</button>';
  }).join("");

  var live = DATA.platforms.filter(function(p){ return p.status === "live"; }).length;
  document.getElementById("sub").textContent =
    live + " of " + DATA.platforms.length + " platforms reporting" +
    (DATA.zernio.configured ? "" : " · Zernio not connected");

  document.getElementById("view").innerHTML = CURRENT === "all"
    ? combinedBody(DATA.combined)
    : metricsBody(DATA.platforms.filter(function(p){ return p.id === CURRENT; })[0] || DATA.platforms[0]);
}

async function load(){
  var btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    var res = await fetch("/api/analytics/social", { headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("Server returned " + res.status);
    DATA = await res.json();
    render();
  } catch (err) {
    document.getElementById("sub").textContent = "Couldn't load analytics";
    document.getElementById("view").innerHTML =
      '<div class="banner bad"><b>Couldn\'t load analytics.</b> ' + esc(err.message) +
      '</div><div class="panel"><div class="empty">Nothing is shown rather than showing stale or made-up numbers. Try Refresh.</div></div>';
  } finally {
    btn.disabled = false; btn.textContent = "Refresh";
  }
}

document.getElementById("tabs").addEventListener("click", function(e){
  var t = e.target.closest(".tab");
  if (!t) return;
  CURRENT = t.getAttribute("data-id");
  render();
});
document.getElementById("refresh").addEventListener("click", load);

load();
</script>
</body>
</html>
